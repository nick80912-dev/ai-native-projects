# Sanity CI — 每次 push / PR 自動跑的輕量檢查
# 目的:把 Gate 從「文字規範」升級為「自動檢查」。
# 涵蓋:①文件標題/檔名一致性(防上傳錯位)②manifest JSON 有效性 ③runtime 版本一致性 ④活文件 generation 一致性 ⑤既有回歸測試
# Playwright 在獨立 job 驗證三情境,以及 SW 更新後的快取正確性與離線 fallback 型別。
#
# 觸發策略(2026-07-30 修訂,對應 backlog #21 的 sanity 部分):
#   sanity      → main push / dev push / PR 都跑。輕量、無瀏覽器,dev 每次推送都值得綠勾。
#   browser-qa  → main push / dev push / PR 都跑(2026-09-12 修訂)。
#
#   為什麼反轉 2026-07-30 的「dev push 不跑」決定:v114→v115 升版時漏改 sw.js 的
#   versionedShellKind() 三條路徑,混世代 install 守衛被靜默停用 —— 四個 gate 與 95 個
#   Node 測試全部綠燈,唯一抓到的是本 job 的 sw-update-cache mixed-generation 規格。
#   當時它只在 PR 跑,若照 dev 的綠勾發布就會送出防線已死的版本。
#   結論:Chromium 那 ~5 分鐘買的是「SW 換代正確性」,而那正是本專案最貴的失敗模式
#   (裝置端無聲壞掉、且依 ADR 0019 不得倒退覆寫,只能 forward bump)。
name: qa-sanity
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: 文件標題/檔名一致性 + manifest 檢查
        run: node tools/check-doc-titles.js
      - name: 版本一致性檢查(app-version.js / sw.js / index.html / netlify.toml)
        run: node tools/check-app-version.js
      - name: 活文件 generation 一致性檢查(文件不得停在舊 shell/vNNN)
        run: node tools/check-doc-generation.js
      - name: 全部回歸測試(自動涵蓋 tests/ 內所有 *.test.js,新增測試免改本檔)
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "== $f =="
            node "$f"
          done

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: 安裝 Playwright 測試依賴
        run: npm ci
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright QA(三情境 + SW 更新快取正確性)
        # 疑似並行波動時，以 `npx playwright test --workers=1` 重跑定位；正式 gate 不啟用 retry。
        run: npm run test:browser
