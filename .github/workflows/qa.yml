# Sanity CI — 每次 push / PR 自動跑的輕量檢查
# 目的:把 Gate 從「文字規範」升級為「自動檢查」。
# 涵蓋:①文件標題/檔名一致性(防上傳錯位)②manifest JSON 有效性 ③既有回歸測試
# Playwright 三情境在獨立 job 驗證斷網內建、連網同步與旅行日 mock Date。
name: qa-sanity
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 文件標題/檔名一致性 + manifest 檢查
        run: node tools/check-doc-titles.js
      - name: 全部回歸測試(自動涵蓋 tests/ 內所有 *.test.js,新增測試免改本檔)
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "== $f =="
            node "$f"
          done

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安裝 Playwright 測試依賴
        run: npm ci
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright 三情境 QA
        run: npm run test:browser
