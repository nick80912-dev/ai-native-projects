# SW 與外殼入口:禁止 CDN/瀏覽器快取,確保「改版必到」
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# app-version.js —— **防禦性設定,不是修復**。
# 2026-07-30 實測 Netlify 對 JS 資產的預設已是 public,max-age=0,must-revalidate,
# 本規則只是把它明確化,避免未來 Netlify 預設變更後產生沉默的更新盲窗。
# 注意:這**無法**修復 GitHub Pages —— Pages 不讀本檔,固定送 max-age=600。
# 真正的修復在 sw.js:版本寫在頂層 + install 用 reload + fetch 用 no-cache。
[[headers]]
  for = "/app-version.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shell/v208/app-version.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shell/v208/builtin-snapshot.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# 2026-11-19 健檢(Bar 核准):基本安全標頭,套用全站。不影響使用 ——
# 不允許別的網站把 App 嵌進框架、瀏覽器不猜檔案型別、外連時只帶網域不帶完整網址。
# Google 登入用彈出視窗,不受 frame 限制影響。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
