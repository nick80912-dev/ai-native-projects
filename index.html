/* ================= 渲染:行程頁 ================= */
var curDay=0, curView='today';
/* ---- 暫態 UI 狀態(session-only)----
   捲動位置、面板展開、操作焦點原本只活在 DOM 裡,重繪即消失 —— 三個症狀同一個根因。
   刻意**不**寫 localStorage、**不**進備份:把 A 手機的捲動位置還原到 B 手機毫無意義,
   而且會讓備份格式再升一版。重開 App 一律歸零。 */
var viewUiState={
  today:{scrollY:0,openMore:{}},
  trip:{scrollY:0,openPanels:{}},
  shop:{scrollY:0},
  split:{scrollY:0}
};
/* 入口意圖以參數傳遞而非模組層變數:天然只消耗一次,不會有殘留狀態需要清除。
   結構化資料(而非布林旗標)讓日後新增入口不必改動判斷邏輯。 */
function viewScrollElement(){ return document.scrollingElement||document.documentElement; }
function captureViewScroll(view){
  var state=viewUiState[view];
  if(state) state.scrollY=Math.max(0,Math.round(viewScrollElement().scrollTop));
}
/* 還原一律用 behavior:'instant'。html{scroll-behavior:smooth} 會讓 'auto' 沿用 CSS 值,
   還原就變成頁面自己滑動的動畫,快速切換時還會互相打架。 */
function applyViewPosition(view,intent){
  requestAnimationFrame(function(){
    if(intent&&applyViewIntent(view,intent)) return;
    var doc=viewScrollElement();
    var state=viewUiState[view];
    var max=Math.max(0,doc.scrollHeight-doc.clientHeight);
    window.scrollTo({top:Math.min(state?state.scrollY:0,max),behavior:'instant'});
  });
}
/* 回傳 true 代表這個 intent 已自行完成定位,不再套用捲動還原。
   意圖用結構化資料而非布林旗標,才好測試、也方便日後新增入口。 */
function applyViewIntent(view,intent){
  var el;
  if(intent.type==='top'||intent.type==='trip-day'){ window.scrollTo({top:0,behavior:'instant'}); return true; }
  if(intent.type==='trip-item'||intent.type==='trip-now'){
    el=intent.itemId?document.getElementById('it_'+intent.itemId):null;
    /* 目標不存在(例如被篩掉或資料變了)就退到頂,不留在還原來的舊位置 —— 那會很困惑 */
    if(!el){ window.scrollTo({top:0,behavior:'instant'}); return true; }
    el.scrollIntoView({behavior:'instant',block:'center'});
    return true;
  }
  if(intent.type==='shop-place'){
    el=document.getElementById('shopmall_'+cssId(String(intent.placeId||'').toUpperCase()));
    if(el) el.scrollIntoView({behavior:'instant',block:'start'});
    else window.scrollTo({top:0,behavior:'instant'});
    return true;
  }
  return false;
}
var tripHideDone=true;
function setTripHideDone(v){
  tripHideDone=!!v;
  renderTrip();
}
function isTripCheckableItem(it){
  return !!(it&&it.id&&(it.act||it.place||it.ref));
}
function isTripItemCleared(it,day,dayIndex,checks){
  return isNextStopCleared(it,getDayProgress(day,dayIndex),checks);
}
function getCurrentTripItemId(day,dayIndex,checks){
  if(!day) return null;
  checks=checks||getChecks();
  var items=(day.items||[]).filter(function(it){ return it&&it.id&&it.act; });
  var next=items.find(function(it){ return !isTripItemCleared(it,day,dayIndex,checks); });
  return next?next.id:null;
}
/* 走共用的 switchView 路徑,不再自己複製一份 view／tabbar 切換的 body ——
   複製版本無法參與捲動保存與意圖機制,兩邊行為只會愈長愈不一樣。 */
function openTripItem(dayIndex,itemId){

  switchView('trip',{type:'trip-item',itemId:itemId});
}
function renderDaybar(){

  }).join('');

}
/* 回到「現在」= 今天那一天 + 目前這一站。逛完別天之後要回到當下,
   原本得先找到今天的 chip、再自己捲到現在的位置。 */
function backToNow(){
  var di=findToday();
  if(di===null) return;
  curDay=di;
  var day=DB.trip.days[di];
  var currentId=selectCurrentTripItem(day,di,getChecks());
  switchView('trip',currentId?{type:'trip-now',itemId:currentId}:{type:'top'});
}
function tripPanelKey(itemId,kind){ return String(itemId)+'::'+kind; }
function isTripPanelOpen(itemId,kind){ return !!viewUiState.trip.openPanels[tripPanelKey(itemId,kind)]; }
/* 展開狀態必須有落點:原本只做 classList.toggle,狀態只活在 DOM 裡,
   而 onCheck() 會 renderTrip() —— 每打一次卡,所有展開的面板就全部收合。 */
function togglePanel(itemId,kind,btn){
  var el=document.getElementById('pn_'+kind+'_'+itemId);
  if(!el) return;
  var open=el.classList.toggle('open');
  if(open) viewUiState.trip.openPanels[tripPanelKey(itemId,kind)]=true;
  else delete viewUiState.trip.openPanels[tripPanelKey(itemId,kind)];
  if(btn) btn.classList.toggle('on',open);
}
/* 只保留目前仍會渲染的 item,否則被篩掉的項目會在暫態狀態裡無限累積 */
function pruneTripPanelState(visibleIds){
  var keep={};
  visibleIds.forEach(function(id){ keep[String(id)]=true; });
  Object.keys(viewUiState.trip.openPanels).forEach(function(key){
    if(!keep[key.split('::')[0]]) delete viewUiState.trip.openPanels[key];
  });
}
/* 重繪會換掉整個列表,鍵盤焦點會掉回 body —— 連續打卡第二下就沒有作用。
   契約的例外在這裡落實:目標仍在就還原它;使用者刻意讓它離開結果集(隱藏已完成)
   則移到原位置的下一筆;連下一筆都沒有就退到篩選按鈕,而不是把焦點丟掉。 */
function restoreTripCheckFocus(id,prevIndex){
  var el=document.getElementById('it_'+id),chk=el?el.querySelector('.chk'):null;
  if(chk){ chk.focus(); return; }
  var all=document.querySelectorAll('#view-trip .item .chk');
  if(all.length){ all[Math.min(prevIndex,all.length-1)].focus(); return; }
  var filter=document.querySelector('#view-trip .trip-filter-btn');
  if(filter) filter.focus();
}
function onCheck(id,fromKeyboard){
  /* 先記住它在可見清單中的位置,重繪後才知道「下一筆」是哪一筆 */
  var prevIndex=0;
  if(fromKeyboard){
    var rows=document.querySelectorAll('#view-trip .item');
    for(var i=0;i<rows.length;i++){ if(rows[i].id==='it_'+id){ prevIndex=i; break; } }
  }
  var day=DB.trip&&DB.trip.days?DB.trip.days[curDay]:null;
  if(day){
    var progress=getDayProgress(day,curDay);
    if(isAutoSkipped(id,progress)){
      /* 這站被系統自動略過(時間已過但你沒手動處理);現在點打卡 = 你確認其實有完成,修正為完成 */
      markNextStop(day,curDay,id,'done');
      if(curView==='trip') renderTrip();
      else if(curView==='today') renderToday();
      if(fromKeyboard&&curView==='trip') restoreTripCheckFocus(id,prevIndex);
      toast('已修正為完成 ✓');
      return;
    }
  }
  var progress=day?getDayProgress(day,curDay):null;
  var wasDone=!!(getChecks()[id]||(progress&&progress.done[id]));
  if(day) setItemCompletion(day,curDay,id,wasDone?'clear':'done');
  else toggleCheck(id);
  var cancelledPast=false;
  if(wasDone&&day){
    var item=(day.items||[]).find(function(it){return it.id===id;});
    var crossDay=findToday()!==curDay;
    var timePick=item?pickNextStop([item],getDayProgress(day,curDay),{},currentMinutes(),null):null;
    var timePast=!!(item&&parseStartMinutes(item.time)!==null&&timePick&&timePick.source==='time-stale');
    cancelledPast=crossDay||timePast;
    if(cancelledPast) autoSkipStaleItem(day,curDay,id);
  }
  renderToday();
  if(curView==='trip') renderTrip();
  if(fromKeyboard&&curView==='trip') restoreTripCheckFocus(id,prevIndex);
  toast(cancelledPast?'已取消,該行程時間已過,列於已略過':(getChecks()[id]?'已打卡 ✓':'取消打卡'));
}
function renderItem(it,checks,currentItemId,dayProgress){
  var done=checks[it.id];
  var isNow=currentItemId&&it.id===currentItemId;
  var autoSkipped=isAutoSkipped(it.id,dayProgress);
  var res=resolveRef(it);
  var cat=typeTag(res);
  if(!cat){
    var s=it.act+(it.place||'');
    if(/早餐|午餐|晚餐|吃/.test(s)) cat={cls:'food',label:'🍜 美食'};
    else if(/前往|出發|抵達|回|機場|>>|搭/.test(it.act)) cat={cls:'move',label:'🚗 移動'};
    else cat=null;
  }
  var hasPlaceTxt=it.place&&it.place.trim();
  var p=res&&res.kind==='place'?res.p:null;
  /* 交通 chip:行程「交通」欄優先;空值時退回資料庫的「交通/交通時間」欄 */
  var drive=extractDrive(it.move) || (p&&p.travel) || (res&&res.kind==='rest'&&res.r.travel) || '';
  var driveIcon = /開車/.test(drive) ? '🚗' : /步行|走路/.test(drive) ? '🚶' : /渡輪|航程|搭船/.test(drive) ? '⛴' : '🚗';

  var qa='';
  if(hasPlaceTxt||res){
    qa+=renderTripNavigationLink(it,res,curDay,'qa-btn drv');
  }
  var pk=p&&(p.mapcode||p.pfee||p.pnote)?parkingPanel(p):'';
  if(pk&&transport()==='drive') qa+='<button class="qa-btn pk'+(isTripPanelOpen(it.id,'pk')?' on':'')+'" onclick="togglePanel(\''+it.id+'\',\'pk\',this)">🅿 停車</button>';
  var info=infoPanel(res);
  if(info){
    var lbl='ℹ️ 資訊';
    if(res.kind==='rest') lbl='🍜 資訊';
    else if(p){ lbl=({shopping:'🏬 資訊',restarea:'🍜 美食',hotel:'🏨 資訊',ferry:'⛴ 渡輪',parking:'🚗 租車',fuel:'⛽ 加油資訊'})[p.tnorm]||'ℹ️ 資訊'; }
    qa+='<button class="qa-btn '+(p&&p.tnorm==='ferry'?'fr':'nf')+(isTripPanelOpen(it.id,'nf')?' on':'')+'" onclick="togglePanel(\''+it.id+'\',\'nf\',this)">'+lbl+'</button>';
  }
  if(p&&p.tnorm==='shopping'&&DB.shop.some(function(s){return (s.placeId||'').toUpperCase()===(p.placeId||'').toUpperCase();})){
    qa+='<button class="qa-btn sp" onclick="openShopPlace(\''+jsString(p.placeId)+'\')">🏬 樓層</button>';
  }
  var hasMore=it.move||it.note;
  if(hasMore) qa+='<button class="qa-btn mo'+(isTripPanelOpen(it.id,'mo')?' on':'')+'" onclick="togglePanel(\''+it.id+'\',\'mo\',this)">📝 更多</button>';

  var panels='',pnCls=function(kind){ return 'panel'+(isTripPanelOpen(it.id,kind)?' open':''); };
  if(pk) panels+='<div class="'+pnCls('pk')+'" id="pn_pk_'+it.id+'">'+pk+'</div>';
  if(info) panels+='<div class="'+pnCls('nf')+'" id="pn_nf_'+it.id+'">'+info+'</div>';
  if(hasMore){
    panels+='<div class="'+pnCls('mo')+'" id="pn_mo_'+it.id+'">'+
      (it.move?'<div class="sec move"><div class="sec-lbl">🚗 交通</div>'+highlightNote(it.move)+'</div>':'')+
      (it.note?'<div class="sec" style="margin-top:8px"><div class="sec-lbl">📝 備註</div>'+renderNote(it.note)+'</div>':'')+
      '</div>';
  }
  return '<div class="item '+(done?'checked':'')+' '+(isNow?'now-item':'')+'" id="it_'+it.id+'">'+
    '<div class="item-main">'+
      /* role="checkbox" 而非 button:這是二元狀態。.chk 內沒有列文字,
         必須自帶 aria-label,否則螢幕閱讀器只會唸「核取方塊」。
         鍵盤路徑明確傳 fromKeyboard —— <div tabindex="0"> 被點擊時同樣會取得焦點,
         用 document.activeElement 反推不出是滑鼠還是鍵盤。 */
      '<div class="chk '+(done?'on':'')+'" role="checkbox" tabindex="0"'+
        ' aria-checked="'+(done?'true':'false')+'"'+
        ' aria-label="'+escapeHtml('打卡：'+String(it.act||it.place||'此行程').replace(/\n/g,' '))+'"'+
        ' onclick="onCheck(\''+jsHtmlAttrString(it.id)+'\')"'+
        ' onkeydown="activateKeyboardButton(event,function(){onCheck(\''+jsHtmlAttrString(it.id)+'\',true)})">'+
        '<span aria-hidden="true">'+(done?'✓':'')+'</span></div>'+
      '<div class="time '+(it.time?'':'blank')+'">'+escapeHtml(it.time||'·')+'</div>'+
      '<div class="body">'+
        (it.act?'<div class="act">'+escapeHtml(it.act)+(isNow?'<span class="now-badge">現在</span>':'')+(autoSkipped?'<span class="auto-skip-badge" title="時間已過,系統自動略過;點左側打卡可修正為完成">⏱ 自動略過</span>':'')+'</div>':'')+
        (hasPlaceTxt?'<div class="place-row"><span class="place">'+escapeHtml(it.place.replace(/\n/g,' '))+'</span>'+(isNow&&!it.act?'<span class="now-badge">現在</span>':'')+(autoSkipped&&!it.act?'<span class="auto-skip-badge" title="時間已過,系統自動略過;點左側打卡可修正為完成">⏱ 自動略過</span>':'')+'</div>':'')+
        '<div class="chip-row">'+
          (cat?'<span class="tag '+cat.cls+'">'+cat.label+'</span>':'')+
          (drive?'<span class="drive-chip">'+driveIcon+' '+escapeHtml(drive)+'</span>':'')+
        '</div>'+
      '</div>'+
    '</div>'+
    (qa?'<div class="qa-row">'+qa+'</div>':'')+panels+
  '</div>';
}
function selectCurrentTripItem(day,dayIndex,checks){ if(findToday()!==dayIndex) return null; var progress=getDayProgress(day,dayIndex); var pick=pickNextStop((day.items||[]).filter(isTripCheckableItem),progress,checks||getChecks(),currentMinutes(),{day:day,dayIndex:dayIndex}); return pick.item?pick.item.id:null; }
function renderTrip(){
  var view=document.getElementById('view-trip');
  var t=DB.trip;
  if(!t||!t.days.length){ view.innerHTML='<div class="empty-state">行程資料載入中…</div>'; return; }
  var day=t.days[curDay];
  if(!day){ curDay=0; day=t.days[0]; }
  var checks=getChecks();
  var progress=getDayProgress(day,curDay);
  var currentItemId=selectCurrentTripItem(day,curDay,checks);
  var acts=day.items.filter(isTripCheckableItem);
  var skipN=acts.filter(function(it){return !!progress.skip[it.id];}).length;
  var doneN=acts.filter(function(it){return !progress.skip[it.id]&&(!!checks[it.id]||!!progress.done[it.id]);}).length;

/* 「現在之後」的最高降雨機率。原本取整天最大值,包含已經過去的時段 ——
   早上下過雨、下午全晴,晚上看到的還是 80%,對「等一下要不要帶傘」毫無幫助。
   全部時段都過去時退回當日最大值,而不是回 null 讓畫面空白。 */
function rainChanceFromNow(hours,now){
  if(!hours||!hours.time||!hours.precipitation_probability) return null;
  var times=hours.time,values=hours.precipitation_probability;
  var len=Math.min(times.length,values.length);
  if(!len) return null;
  var cutoff=(now||appNow()).getTime(),best=null,all=null,i,v,t;
  for(i=0;i<len;i++){
    v=values[i];
    if(typeof v!=='number') continue;
    all=(all===null||v>all)?v:all;
    t=Date.parse(times[i]);
    if(isFinite(t)&&t<cutoff) continue;   /* 已經過去的時段不算 */
    if(best===null||v>best) best=v;
  }
  return best!==null?best:all;
}
function getCachedWeather(city){
  var cached=lsGet(weatherCacheKey(city),null);
  if(!cached||!cached.t) return null;
  var maxAge=3*60*60*1000;

  var data=cached.data;
  if(!data) return null;
  /* 依**當下**重算,而不是用存進去時算好的數字 —— 三小時 TTL 內時間會走,
     早上存的「現在之後」到中午就是錯的。舊格式(沒有 hours)安全降級用舊值。 */
  if(data.hours){
    var fresh=rainChanceFromNow(data.hours,appNow());
    if(fresh!==null){
      var copy={};Object.keys(data).forEach(function(k){copy[k]=data[k];});
      copy.rain=fresh;return copy;
    }
  }
  return data;
}

function fetchWeather(city){

    '&longitude='+encodeURIComponent(city.lon)+
    '&current=temperature_2m,weather_code'+
    '&hourly=precipitation_probability'+
    '&forecast_days=1&timezone=Asia%2FTokyo';

    if(!r.ok) throw new Error('weather '+r.status);
    return r.json();
  }).then(function(json){
    /* 保留原始 hourly 序列進快取,讓讀取時能依當下重算「現在之後」。
       只存算完的數字會在三小時 TTL 內失準。 */
    var hours=(json.hourly&&json.hourly.time&&json.hourly.precipitation_probability)
      ?{time:json.hourly.time,precipitation_probability:json.hourly.precipitation_probability}:null;

    if(rain===null) rain=0;

    var code=json.current?json.current.weather_code:null;

function undoNextStopAction(){
  var action=lastNextStopAction;
  if(!action) return;
  var day=DB.trip&&DB.trip.days?DB.trip.days[action.dayIndex]:null;
  if(!day) return;
  var all=getNextStopProgress();
  var key=dayProgressKey(day,action.dayIndex);
  var progress=normalizeDayProgress(all[key]);
  delete progress.done[action.itemId];
  delete progress.skip[action.itemId];
  if(action.prevDone) progress.done[action.itemId]=true;
  if(action.prevSkip) progress.skip[action.itemId]=true;
  all[key]=progress;
  saveNextStopProgress(all);
  var checks=getChecks();
  if(action.prevCheck) checks[action.itemId]=true;
  else delete checks[action.itemId];
  lsSet('trip_checks',checks);
  lastNextStopAction=null;
  renderToday();
  toast(action.status==='skip'?'已復原跳過':'已復原完成');

var homeWeatherState={};
function requestHomeWeather(dayIndex,item){
  if(!item) return;
  var day=DB.trip&&DB.trip.days?DB.trip.days[dayIndex]:null;
  var city=inferWeatherCityForDay(day,item);
  if(!city) return;
  var key='day_'+dayIndex+'_'+city.key;
  if(homeWeatherState[key]) return;
  var cached=getCachedWeather(city);
  if(cached){ homeWeatherState[key]=cached; return; }
  homeWeatherState[key]={ loading:true };
  loadWeatherForCity(city).then(function(weather){
    if(weather){ homeWeatherState[key]=weather; if(curView==='today') renderToday(); }
    else delete homeWeatherState[key];
  });
}
function homeWeatherFor(dayIndex,item){
  if(!item) return null;
  var day=DB.trip&&DB.trip.days?DB.trip.days[dayIndex]:null;
  var city=inferWeatherCityForDay(day,item);
  if(!city) return null;
  var key='day_'+dayIndex+'_'+city.key;

function daysUntilStart(){
  var raw=DB&&DB.cfg&&DB.cfg.startdate?String(DB.cfg.startdate):'';
  var parts=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!parts) return null;
  var startStamp=Date.UTC(Number(parts[1]),Number(parts[2])-1,Number(parts[3]));
  var now=appNow();
  var todayStamp=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.ceil((startStamp-todayStamp)/86400000);
}

function renderToday(){

  checks=getChecks();

  var pick=pickNextStop(items,progress,checks,nowMinutes,{day:day,dayIndex:ti});
  var completed=items.length-(pick.remaining+(pick.item?1:0));
  var clusterParent=clusterParentForPick(day.items,pick.item);
  var cluster=getChildStopCluster(day.items,clusterParent);
  var clusterPick=cluster?pickClusterChild(cluster,progress,checks,nowMinutes,{day:day,dayIndex:ti}):null;
  var currentStop=clusterPick&&clusterPick.item?clusterPick.item:pick.item;
  var currentStopRef=currentStop&&currentStop.id?currentStop.id:'';
  var weatherItem=currentStop;
  requestHomeWeather(ti,weatherItem);

  var h='<div class="today-hero today-hero-trip'+(weather?' weather-on':'')+'"><div class="today-hero-top"><div class="lbl">TODAY · DAY '+(ti+1)+'</div>'+
    '<div class="loc" aria-label="'+escapeHtml(progressLabel)+'">'+completed+' / '+items.length+'</div></div>'+
    '<div class="today-hero-main"><div class="date">'+day.date+(day.dow?' ('+day.dow+')':'')+'</div>'+renderTodayWeatherArt(weather)+'</div>'+
    renderTodayHeroSummary(weather,renderShoppingTodayEntry(day,currentStopRef))+'</div>';
  h+=cluster&&clusterPick&&clusterPick.item?renderClusterNextStopCard(day,ti,pick,cluster,checks,progress,nowMinutes):renderNextStopCard(day,ti,pick);

    if(shouldReplaceWithTomorrowPreview(pick)) h+=renderTomorrowPreview(ti,false);
    else if(shouldShowCompactTomorrowPreview(pick,nowMinutes)) h+=renderTomorrowPreview(ti,true);
  }
  h+='<button class="today-jump dark" onclick="gotoDay('+ti+')">看今日完整細節 →</button>';
  view.innerHTML=h;
}

function shoppingEditableAllocationsChanged(original,next,context){
  var policy=buyToLedgerDomain.inspectItem(original,context).editPolicy,editable={};
  policy.allocations.forEach(function(value){if(value.canEdit)editable[value.allocationId]=true;});
  var before=shoppingItemAllocations(original).filter(function(value){return editable[value.allocationId];});
  var after=shoppingItemAllocations(next).filter(function(value){return editable[value.allocationId]||!value.allocationId;});
  if(before.length!==after.length)return true;
  return before.some(function(value){
    var candidate=after.filter(function(nextValue){return nextValue.allocationId===value.allocationId;})[0];
    return !candidate||candidate.quantity!==value.quantity||canonicalMemberName(candidate.target||'')!==canonicalMemberName(value.target||'');
  });

function commitShoppingFormPayload(form,payload,saveAnother){

  var requestId=createShoppingFormRequestId();
  var requested=shoppingUiWorkflow.dispatch({type:'form-save-requested',sessionId:session.sessionId,requestId:requestId});
  if(!requested.changed)return null;
  try{
    var before=shoppingListStore.all();
    var saved=form.id?shoppingListStore.update(form.id,payload):shoppingListStore.add(payload);
    refreshShoppingPhotoAudit({force:true,reason:'shopping-mutation'});
    if(!form.id&&saveAnother===true){
      shoppingUiWorkflow.dispatch({
        type:'form-save-succeeded',sessionId:session.sessionId,requestId:requestId,saveAnother:true,
        nextForm:shoppingSaveAnotherForm(form),
        nextSession:createShoppingFormSession('add',null,'list',session.returnScrollTop,createShoppingFormSessionId()),
        notification:'採買項目已新增'
      });
      return saved;
    }
    shoppingUiWorkflow.dispatch({type:'form-save-succeeded',sessionId:session.sessionId,requestId:requestId,item:saved,notification:form.id?'採買項目已更新':'採買項目已新增'});

function saveShoppingForm(saveAnother){
  var form=shoppingUiState.form,session=shoppingUiState.formSession;
  if(!form||!session||session.savePending)return;
  try{
    /* 表單值一律是字串;在此轉成數字並交給 normalizer 做安全整數驗證。
       儲存成功即代表已轉為結構化數量,舊式文字同時清空。 */
    /* 只接受純十進位數字字串:type="number" 在部分瀏覽器仍會送出 `1e6`／`1.0`／`+3`,
       直接 Number() 會把 1e6 悄悄變成一百萬。 */
    var raw=String(form.quantity==null?'':form.quantity).trim();
    if(!/^\d+$/.test(raw))throw new Error('採買數量必須是 1 以上的安全整數');
    var payload=shoppingFormPayload(Object.assign({},form,{quantity:Number(raw)}));
    if(form.id){
      var original=shoppingListStore.all().filter(function(item){return item.id===form.id;})[0];
      if(original&&original.done&&shoppingEditableAllocationsChanged(original,payload,shoppingLedgerContext())){
        openShoppingCompletedEditConfirm(form,payload);return;
      }
    }
    commitShoppingFormPayload(form,payload,saveAnother);
  }catch(error){
    toast(error.message||'採買項目儲存失敗');focusShoppingFormError(error);
  }
}

  var sharedReady=!!(CURRENT_SNAPSHOT&&CURRENT_SNAPSHOT.source==='online')&&!(CURRENT_SNAPSHOT.sheetMeta&&CURRENT_SNAPSHOT.sheetMeta.ledger&&CURRENT_SNAPSHOT.sheetMeta.ledger.failed);
  var sharedRecords=[];
  try{sharedRecords=mergedLedgerRecords();}catch(error){sharedReady=false;sharedRecords=[];}
  return {

    personal:{ready:personalReady,records:personalRecords},

function releaseShoppingLedgerLink(id,allocationId){
  var item=shoppingListStore.all().filter(function(value){return value.id===String(id);})[0];if(!item)return;
  var inspection=buyToLedgerDomain.inspectItem(item,shoppingLedgerContext()),states={};
  inspection.allocationStates.forEach(function(value){states[value.allocationId]=value;});
  var linked=shoppingItemAllocations(item).filter(function(allocation){return states[allocation.allocationId]&&states[allocation.allocationId].state==='linked';});
  var selected=allocationId?linked.filter(function(allocation){return allocation.allocationId===String(allocationId);})[0]:null;
  if(!selected&&linked.length===1)selected=linked[0];
  if(!selected&&linked.length>1){toast('請從採買詳情選擇要改回未記帳的對象');return;}
  if(!selected||!states[selected.allocationId]||!states[selected.allocationId].activeLink){toast('這筆目前沒有記帳關聯');return;}
  closeShoppingReleaseConfirm();
  shoppingReleaseTarget={itemId:String(id),allocationId:selected.allocationId};
  var target=String(selected.target||'').trim();
  var overlay=document.createElement('div');overlay.id='shoppingReleaseDialog';overlay.className='shopping-choice-overlay';
  overlay.innerHTML='<section class="shopping-choice-panel" role="dialog" aria-modal="true" aria-labelledby="shoppingReleaseTitle"><h3 id="shoppingReleaseTitle">改回未記帳？</h3><p>'+(target?'「'+escapeHtml(target)+'」':'這個採買項目')+'只會移除採買這一側的「已記帳」標記，不會刪除或修改帳本中的消費紀錄。</p><p class="shopping-release-risk">若帳本中的原紀錄仍在，再次記帳可能產生重複消費。</p><div class="shopping-form-actions"><button type="button" class="btn ghost" onclick="closeShoppingReleaseConfirm()">取消</button><button type="button" class="btn" onclick="confirmShoppingRelease()">改回未記帳</button></div></section>';
  document.body.appendChild(overlay);
}
function closeShoppingReleaseConfirm(){
  var overlay=document.getElementById('shoppingReleaseDialog');if(overlay)overlay.remove();
  shoppingReleaseTarget={itemId:'',allocationId:''};
}
function confirmShoppingRelease(){
  var target=shoppingReleaseTarget;
  var detailOpen=!!document.getElementById('shoppingItemDetail');
  closeShoppingReleaseConfirm();
  if(!target.itemId||!target.allocationId)return;
  try{shoppingListStore.releaseLedgerLink(target.itemId,target.allocationId,timestampDate(Date.now()).toISOString());}
  catch(error){toast(error.message||'改回未記帳失敗');return;}
  renderShoppingListOverlay();
  if(detailOpen)openShoppingItemDetail(target.itemId);
  toast('已改回未記帳，可重新建立消費');
}

/* ================= 購物模式(資料來自 Shopping 表) ================= */
var _shopQ='';
var shopPlaceFilter='all';
var shopOpenFloors={};
var shopWantListOpen={};
/* 舊 key 轉換的提示在同一次 session 內只吐一次。轉換本身是冪等的 ——
   舊格式 key 第一次就被消化光,之後 dropped 必為 0,因此不需要額外的 localStorage 旗標。 */
var shopWantMigrationNoticed=false;
function cssId(s){
  return String(s).replace(/[^a-zA-Z0-9]/g,'_');
}
/* 想逛清單「展開狀態」的 key(僅存在於記憶體的 shopWantListOpen)。
   與下方的 store want key 用途完全不同,故不共用含糊的名稱。 */
function shopWantListStateKey(place,index){
  return (place&&place.placeId)?place.placeId:('M'+index);
}
/* ---- 想逛標記的唯一權威 key ----
   2026-08-02:原本的 `w_<mallIndex>_<floor>_<name>` 以 shopMalls() 的**列舉索引**識別
   購物地點,而該陣列依「行程出現順序 → 名稱」排序 —— 新增一個購物地點就會位移索引,
   已存的標記於是靜默指到別家店(實測:加入 P048 後 P007 由索引 1 變 2;
   「無印良品 1F」同時存在於 P001 與 P039,位移一格即在兩家不同店之間轉移)。

   分段以 encodeURIComponent 編碼:':' 會被編成 %3A,因此店名或樓層內含冒號也不可能
   切斷分隔;'"'、'&'、'<' 一併被編碼。index 只有在 placeId 與 name 都缺席時才會用到 ——
   shopMalls() 目前兩個分支都會跳過沒有 placeId 的項目,故該路徑不可達,
   保留它只是為了日後若放寬過濾,不會靜默退回索引語意。 */
function shopWantStoreKey(place,index,store){
  var pid=place&&place.placeId?String(place.placeId).toUpperCase():'';
  var name=place&&place.name?String(place.name):'';
  var token=pid?('p'+encodeURIComponent(pid))
    :(name?('n'+encodeURIComponent(name)):('i'+encodeURIComponent(String(index))));
  var floor=store&&store.floor?String(store.floor):'';
  var label=store&&store.name?String(store.name):'';
  return 'w2:'+token+':'+encodeURIComponent(floor)+':'+encodeURIComponent(label);
}
/* 舊索引型 key 的一次性、冪等轉換。
   刻意**不**把舊 index 直接換成「目前同一 index 的 placeId」—— 順序可能早已改變,
   那只會把錯誤映射永久固定下來。改以「樓層＋店名」在目前全部購物地點搜尋候選:
   唯一候選才轉換,0 個或多個一律移除並計數,絕不猜測。
   不自行切割 floor 與 name(兩者都可能含底線),而是重建同樣的串接字串來比對。
   非 w_ 開頭的 key(含已是 w2 的新格式)原樣保留,因此重跑不會再變更資料。 */
function migrateShopWantKeys(wants,malls){
  var source=wants&&typeof wants==='object'?wants:{};
  var list=malls||[];
  var next={},migrated=0,dropped=0,changed=false;
  Object.keys(source).forEach(function(key){
    var matched=/^w_\d+_/.exec(key);
    if(!matched){ next[key]=source[key]; return; }
    var tail=key.slice(matched[0].length);
    var hits=[];
    list.forEach(function(mall,index){
      (mall&&mall.stores||[]).forEach(function(store){
        var rebuilt=String(store&&store.floor||'')+'_'+String(store&&store.name||'');
        if(rebuilt!==tail) return;
        var stable=shopWantStoreKey(mall.place,index,store);
        if(hits.indexOf(stable)<0) hits.push(stable);
      });
    });
    changed=true;
    if(hits.length===1){ next[hits[0]]=source[key]; migrated++; }
    else dropped++;
  });
  return {wants:next,migrated:migrated,dropped:dropped,changed:changed};
}
function toggleShopWantList(key){
  shopWantListOpen[key]=!shopWantListOpen[key];
  renderShopResults();
}
function setShopPlaceFilter(key){
  shopPlaceFilter=key||'all';
  renderShopResults();
  requestAnimationFrame(centerShopFilterChip);
}
/* 比對名稱與分類。分類本來就顯示在每一列上,搜不到只是介面自己造成的期待落差。 */
function shopStoreMatches(store,query){
  var q=String(query==null?'':query).trim().toLowerCase();
  if(!q) return true;
  var s=store||{};
  if(String(s.name||'').toLowerCase().indexOf(q)>=0) return true;
  return String(s.cat||'').toLowerCase().indexOf(q)>=0;
}
var SHOP_SEARCH_DEBOUNCE_MS=120;
var shopSearchTimer=null;
/* 依輸入框的**原始值**決定,不看 _shopQ —— _shopQ 已 trim,
   使用者若只打了空白,X 仍然要出現,那些空白同樣需要一鍵清掉。 */
function updateShopSearchClear(){
  var input=document.getElementById('shopSearchInput'),btn=document.getElementById('shopSearchClear');
  var hasText=!!(input&&input.value);
  if(btn) btn.hidden=!hasText;
  /* 右側內距跟著 X 一起出現／消失,空值時把整條寬度還給 placeholder */
  if(input) input.className=hasText?'has-text':'';
}
/* _shopQ 立即更新,只延後重繪 —— 輸入框在 #shopResults 之外,focus 不受影響。 */
function shopQ(v){
  _shopQ=String(v==null?'':v).trim().toLowerCase();
  updateShopSearchClear();
  if(shopSearchTimer) clearTimeout(shopSearchTimer);
  shopSearchTimer=setTimeout(function(){ shopSearchTimer=null; renderShopResults(); },SHOP_SEARCH_DEBOUNCE_MS);
}
/* 一鍵清除:必須**取消**已排程的 debounce 重繪,否則那次重繪會晚一步跑,
   而且要立即重繪(使用者按了清除就是要馬上看到完整清單,不該再等 120ms)。
   清完把焦點還給輸入框,才能直接接著打字。 */
function clearShopSearch(){
  var input=document.getElementById('shopSearchInput');
  if(input) input.value='';
  _shopQ='';
  if(shopSearchTimer){ clearTimeout(shopSearchTimer); shopSearchTimer=null; }
  updateShopSearchClear();
  renderShopResults();
  if(input) input.focus();
}
function openShopPlace(placeId){
  var key=String(placeId||'').trim().toUpperCase();
  var exists=shopMalls().some(function(m){
    return String(m.place&&m.place.placeId||'').toUpperCase()===key;
  });
  _shopQ='';
  shopPlaceFilter=exists?key:'all';
  switchView('shop',exists?{type:'shop-place',placeId:key}:{type:'top'});
}
function centerShopFilterChip(){
  var bar=document.getElementById('shopFilterBar');
  if(!bar) return;
  var chip=bar.querySelector('.shop-filter-btn.on');
  if(!chip||!bar.clientWidth||!chip.offsetWidth) return;
  var relativeLeft=chip.offsetLeft-(bar.offsetLeft||0);
  var left=Math.max(0,relativeLeft-(bar.clientWidth-chip.offsetWidth)/2);
  if(typeof bar.scrollTo==='function') bar.scrollTo({left:left,behavior:'smooth'});
  else bar.scrollLeft=left;
}
/* 想逛數量的單一推導處:總數、每個購物地點、每個樓層。
   計數一律由 storage 重算,不從 DOM 讀回來 —— DOM 只是投影。 */
function shopWantCounts(){
  var malls=shopMalls(), wants=getWants();
  var total=0, byMall={}, byFloor={};
  malls.forEach(function(m,mi){
    var p=m.place, n=0;
    m.stores.forEach(function(s){
      if(!wants[shopWantStoreKey(p,mi,s)]) return;
      n++; total++;
      var fkey=(p.placeId||('M'+mi))+'::'+(s.floor||'其他');
      byFloor[fkey]=(byFloor[fkey]||0)+1;
    });
    byMall[shopWantListStateKey(p,mi)]=n;
  });
  return {total:total,byMall:byMall,byFloor:byFloor};
}
/* 就地更新勾選狀態與三處計數。回傳 false 代表這次改動會改變區塊結構,
   必須交給整份重繪 —— 那是內容真的變了,不是效能問題。 */
function applyWantToggleInPlace(id,on){
  var box=document.getElementById('shopResults');
  if(!box) return false;
  /* 想逛篩選下,取消標記會讓該列整個離開清單 */
  if(shopPlaceFilter==='wants') return false;
  var counts=shopWantCounts();
  /* 搜尋模式不渲染想逛清單區塊,沒有結構可比對 */
  if(!_shopQ){
    var present={},boxes=box.querySelectorAll('[data-want-box]'),bi;
    for(bi=0;bi<boxes.length;bi++) present[boxes[bi].getAttribute('data-want-box')]=true;
    var structural=false;
    Object.keys(counts.byMall).forEach(function(wkey){
      var n=counts.byMall[wkey];
      if((n>0)!==!!present[wkey]) structural=true;      /* 區塊要出現或消失 */
      if(n>0&&shopWantListOpen[wkey]) structural=true;  /* 展開中,內容要增減列 */
    });
    if(structural) return false;
  }
  var rows=box.querySelectorAll('.store-row'),updated=0,ri;
  for(ri=0;ri<rows.length;ri++){
    if(rows[ri].getAttribute('data-want')!==id) continue;
    /* aria-checked 必須跟著改 —— 否則畫面打了勾,語音仍會說未勾選 */
    rows[ri].setAttribute('aria-checked',on?'true':'false');
    var chk=rows[ri].querySelector('.st-chk');
    if(chk){ chk.className='st-chk'+(on?' on':''); chk.textContent=on?'✓':''; }
    updated++;
  }
  if(!updated) return false;
  var totalEl=document.getElementById('shopWantTotal');
  if(totalEl) totalEl.textContent=String(counts.total);
  var heads=box.querySelectorAll('[data-want-head]'),hi;
  for(hi=0;hi<heads.length;hi++){
    heads[hi].textContent='⭐ 想逛清單：'+(counts.byMall[heads[hi].getAttribute('data-want-head')]||0)+' 家';
  }
  var fls=box.querySelectorAll('[data-floor-count]'),fi;
  for(fi=0;fi<fls.length;fi++){
    var wc=counts.byFloor[fls[fi].getAttribute('data-floor-count')]||0;
    fls[fi].textContent=fls[fi].getAttribute('data-floor-total')+' 家'+(wc?'｜⭐'+wc:'');
  }
  return true;
}
/* 清除全部想逛。復原採**完整快照**而非逐筆反向切換 —— 逐筆會寫入 N 次、
   重繪 N 次,而且無法還原轉換保留下來、無法辨識的 key。
   清除與復原各只寫入一次 storage、各只重繪一次。
   顯示的家數是 shopWantCounts().total(使用者實際看得到的),清除的則是整包 ——
   若內含無法辨識的 key,它們一併清除並由快照完整還原,對使用者而言數字仍誠實。 */
function clearAllShopWants(){
  var count=shopWantCounts().total;
  if(!count) return;
  var before=getWants(), snapshot={};
  Object.keys(before).forEach(function(key){ snapshot[key]=before[key]; });
  lsSet('trip_shop_wants',{});
  renderShopResults();
  toast('已清除 '+count+' 家想逛店家','復原',function(){
    lsSet('trip_shop_wants',snapshot);
    renderShopResults();
  });
}
function focusShopRow(id){
  var box=document.getElementById('shopResults'); if(!box) return;
  var rows=box.querySelectorAll('.store-row'),i;
  for(i=0;i<rows.length;i++){
    if(rows[i].getAttribute('data-want')===id){ rows[i].focus(); return; }
  }
}
function toggleWant(id){
  var w=getWants(), on=!w[id];
  if(on) w[id]=true; else delete w[id];
  lsSet('trip_shop_wants',w);
  /* 整份重繪會把約 720 個節點全部換掉,連帶重設篩選列捲動位置;
     常見情況(勾選/取消一家)只需要改幾個字,不必重建。 */
  if(applyWantToggleInPlace(id,on)) return;
  /* 需要重繪時,鍵盤焦點會跟著整個 DOM 一起消失、掉回 body ——
     鍵盤使用者連按第二下就沒有作用。重繪後把焦點放回同一家店。 */
  var keyboard=document.activeElement&&document.activeElement.getAttribute
    &&document.activeElement.getAttribute('data-want')===id;
  renderShopResults();
  if(keyboard) focusShopRow(id);
}
function toggleFloor(fkey,btn){
  var el=document.getElementById('flbody_'+cssId(fkey));
  var open=!shopOpenFloors[fkey];
  shopOpenFloors[fkey]=open;
  if(el) el.classList.toggle('open',open);
  btn.classList.toggle('on',open);
}
function shopMalls(){
  var byPlace={};
  DB.shop.forEach(function(s){
    var pid=(s.placeId||'').toUpperCase(); if(!pid) return;
    (byPlace[pid]=byPlace[pid]||[]).push(s);
  });
  var itineraryOrder={};
  var seq=0;
  if(DB.trip&&DB.trip.days){
    DB.trip.days.forEach(function(d){
      (d.items||[]).forEach(function(it){
        var pid=(it.ref||'').toUpperCase();
        if(pid&&!itineraryOrder[pid]) itineraryOrder[pid]=++seq;
      });
    });
  }
  var seen={};
  var malls=[];
  DB.placeList.forEach(function(p){
    var pid=(p.placeId||'').toUpperCase();
    if(!pid||p.tnorm!=='shopping') return;
    seen[pid]=true;
    malls.push({ place:p, stores:byPlace[pid]||[], order:itineraryOrder[pid]||9999 });
  });
  Object.keys(byPlace).forEach(function(pid){
    if(seen[pid]) return;
    malls.push({ place:DB.places[pid]||{name:pid,placeId:pid}, stores:byPlace[pid], order:itineraryOrder[pid]||9999 });
  });
  malls.sort(function(a,b){
    if(a.order!==b.order) return a.order-b.order;
    return String(a.place.name||'').localeCompare(String(b.place.name||''),'zh-Hant');
  });
  return malls;
}
function storeRow(s,id,on){
  var must=/是|y|✓|v/i.test(s.must||'');
  var tax=/是|y|✓|v/i.test(s.taxfree||'');
  /* role="checkbox" 而非 button:這是二元選取,視覺上本來就是核取方塊,
     語音回報「未勾選／已勾選」比「按鈕」精確。可及名稱取自列內既有文字,
     不另造 aria-label —— 店名、分類、必逛／免稅與樓層本來就都在列內。 */
  var call='toggleWant(\''+jsHtmlAttrString(id)+'\')';
  return '<div class="store-row" data-want="'+escapeHtml(id)+'" role="checkbox" tabindex="0"'+
    ' aria-checked="'+(on?'true':'false')+'" onclick="'+call+'"'+
    ' onkeydown="activateKeyboardButton(event,function(){'+call+'})">'+
    '<span class="st-chk'+(on?' on':'')+'" aria-hidden="true">'+(on?'✓':'')+'</span>'+
    '<span class="st-n">'+escapeHtml(s.name)+(s.cat?' <span class="store-cat">'+escapeHtml(s.cat)+'</span>':'')+(must?' <span class="st-must">必逛</span>':'')+(tax?' <span class="st-tax">免稅</span>':'')+'</span>'+
    '<span class="st-f">'+escapeHtml([s.floor,s.note?s.note.replace('櫃位 ',''):''].filter(Boolean).join('·'))+'</span></div>';
}
function renderShop(){
  var view=document.getElementById('view-shop');
  /* 採買清單與購物地點資料無關,連沒有購物地點時也該給得到入口 */
  var pending=shoppingPendingCount();
  var listEntry='<button type="button" class="shop-list-entry" onclick="openShoppingList()">'+
    '採買清單<span id="shopListCount" class="shop-list-count"'+(pending?'':' hidden')+'>'+(pending?pending:'')+'</span></button>';
  if(!shopMalls().length){ view.innerHTML='<div class="shop-top">'+listEntry+'</div><div class="empty-state">尚無購物地點<br>在 Places 新增 Type=購物 後會自動出現</div>'; return; }
  /* 搜尋與採買清單同列:兩者都是進到購物頁最先要做的事,分兩列會把店家清單
     往下推,也讓入口看起來像是清單的一部分。 */
  view.innerHTML='<div class="shop-top">'+
    '<div class="shop-search"><input id="shopSearchInput"'+(_shopQ?' class="has-text"':'')+' placeholder="🔍 搜尋店家或分類" value="'+escapeHtml(_shopQ)+'" oninput="shopQ(this.value)">'+
      '<button type="button" id="shopSearchClear" class="shop-search-clear" aria-label="清除搜尋"'+(_shopQ?'':' hidden')+' onclick="clearShopSearch()">×</button></div>'+
    listEntry+'</div><div id="shopResults"></div>';
  renderShopResults();
  requestAnimationFrame(centerShopFilterChip);
}
function renderShopResults(){
  var box=document.getElementById('shopResults'); if(!box) return;
  var h='', malls=shopMalls();
  /* 舊索引型 key 在這裡消化掉:轉換是冪等的,只有真的動到資料才寫回。 */
  var migration=migrateShopWantKeys(getWants(),malls);
  if(migration.changed){
    lsSet('trip_shop_wants',migration.wants);
    if(migration.dropped&&!shopWantMigrationNoticed){
      shopWantMigrationNoticed=true;
      toast('有 '+migration.dropped+' 筆舊想逛標記無法安全對應，請重新勾選。');
    }
  }
  var wants=migration.wants;
  var wantTotal=0;
  malls.forEach(function(m,mi){
    wantTotal+=m.stores.filter(function(s){return wants[shopWantStoreKey(m.place,mi,s)];}).length;
  });
  h+='<div class="shop-filter" id="shopFilterBar">'+
    /* 兩個全域 chip 的數字是不同實體(地點 vs 家),把單位寫出來;
       各購物地點 chip 維持純數字 —— 名稱＋數字在情境中已無歧義。
       單位放在計數元素**之外**,就地更新才不會把單位一起洗掉。 */
    '<button class="shop-filter-btn '+(shopPlaceFilter==='all'?'on':'')+'" onclick="setShopPlaceFilter(\'all\')">全部<small>'+malls.length+' 個地點</small></button>'+
    '<button class="shop-filter-btn '+(shopPlaceFilter==='wants'?'on':'')+'" onclick="setShopPlaceFilter(\'wants\')">想逛<small><span id="shopWantTotal">'+wantTotal+'</span> 家</small></button>'+
    malls.map(function(m){
      var key=(m.place.placeId||m.place.name||'').toUpperCase();
      var label=m.place.name||key;
      return '<button class="shop-filter-btn '+(shopPlaceFilter===key?'on':'')+'" onclick="setShopPlaceFilter(\''+jsHtmlAttrString(key)+'\')">'+escapeHtml(label)+'<small>'+m.stores.length+'</small></button>';
    }).join('')+
    '</div>';
  /* 只在想逛模式且真的有資料時出現:破壞性操作不該常駐在探索用的「全部」頁籤上 */
  if(shopPlaceFilter==='wants'&&wantTotal){
    h+='<div class="shop-wants-actions"><button type="button" class="btn ghost" onclick="clearAllShopWants()">清除全部想逛</button></div>';
  }
  var rendered=0;
  /* 摘要的數字必須來自**實際渲染的那一輪**,不另外再算一次 —— 兩份計算遲早會不一致 */
  var searchHits=0,searchPlaces=0,summaryAt=h.length;
  malls.forEach(function(m,mi){
    var p=m.place;
    var pkey=(p.placeId||p.name||'').toUpperCase();

  if(_shopQ&&searchHits){

    h+='<div class="empty-state">'+

     手動捲到的位置一直拉回去。改由 setShopPlaceFilter() 與首次渲染呼叫。 */
  box.innerHTML=h;

function shoppingFormQuantity(form){

  var quantity=Number(raw);

function shoppingFormAllocations(form){
  var quantity=shoppingFormQuantity(form),targets=shoppingFormTargets(form);
  var existing=shoppingItemAllocations(form),byTarget={},policyById={};
  ((form&&form.allocationEditPolicy&&form.allocationEditPolicy.allocations)||[]).forEach(function(value){policyById[value.allocationId]=value;});
  existing.forEach(function(allocation){byTarget[canonicalMemberName(allocation.target||'')]=allocation;});
  var unequal=existing.length>1&&existing.some(function(allocation){return allocation.quantity!==existing[0].quantity;});
  var values=targets.length?targets:[''];
  var result=values.map(function(target){
    var prior=byTarget[canonicalMemberName(target)]||null;
    var locked=prior&&policyById[prior.allocationId]&&!policyById[prior.allocationId].canEdit;
    var preserveQuantity=prior&&(unequal||locked);
    return {
      allocationId:prior?String(prior.allocationId||''):'',
      target:target,
      quantity:preserveQuantity?prior.quantity:quantity,
      ledgerLinks:prior&&Array.isArray(prior.ledgerLinks)?prior.ledgerLinks.slice():[]
    };
  });
  existing.forEach(function(allocation){
    var policy=policyById[allocation.allocationId];
    var present=result.some(function(value){return value.allocationId===allocation.allocationId;});
    if(policy&&!policy.canEdit&&!present)result.push(Object.assign({},allocation,{ledgerLinks:(allocation.ledgerLinks||[]).slice()}));
  });
  return result;
}

function shoppingDeleteWarning(items,context){

function assertShoppingAllocationUpdateAllowed(previous,next,context){
  var nextById={};
  shoppingItemAllocations(next).forEach(function(allocation){nextById[allocation.allocationId]=allocation;});
  var states={};
  buyToLedgerDomain.inspectItem(previous,context||{}).editPolicy.allocations.forEach(function(value){states[value.allocationId]=value;});
  shoppingItemAllocations(previous).forEach(function(allocation){
    var policy=states[allocation.allocationId];
    var locked=policy?!policy.canEdit:false;
    if(!locked)return;
    var candidate=nextById[allocation.allocationId];
    var unchanged=candidate&&
      canonicalMemberName(candidate.target||'')===canonicalMemberName(allocation.target||'')&&
      candidate.quantity===allocation.quantity&&
      JSON.stringify(candidate.ledgerLinks||[])===JSON.stringify(allocation.ledgerLinks||[]);
    if(!unchanged)throw new Error('已記帳或狀態待確認的代購對象已鎖定');
  });
  return true;
}
function shoppingSplitGroupAllocationTotals(items,item){
  var groupId=String(item&&item.splitGroupId||item&&item.id||'').trim();
  var byTarget={},targets=[],total=0,valid=true;
  (items||[]).forEach(function(candidate){
    var candidateGroup=String(candidate&&candidate.splitGroupId||candidate&&candidate.id||'').trim();
    if(candidateGroup!==groupId)return;
    shoppingItemAllocations(candidate).forEach(function(allocation){
      var key=canonicalMemberName(allocation.target||'');
      if(!byTarget[key]){byTarget[key]={target:allocation.target||'',quantity:0};targets.push(byTarget[key]);}
      if(!isSafeShoppingQuantity(allocation.quantity)){valid=false;return;}
      byTarget[key].quantity+=allocation.quantity;
      total+=allocation.quantity;
      if(!Number.isSafeInteger(byTarget[key].quantity)||!Number.isSafeInteger(total))valid=false;
    });
  });
  return {targets:valid?targets:[],total:valid?total:null};
}
function analyzeShoppingSplitRemerge(items,splitGroupId){
  var groupId=String(splitGroupId||'').trim();
  if(!groupId)return {ok:false,reason:'missing-group'};
  var group=(items||[]).filter(function(item){
    return String(item&&item.splitGroupId||'').trim()===groupId;
  });
  if(group.some(function(item){return item.done===true;}))return {ok:false,reason:'still-purchased'};
  var original=null;
  group.forEach(function(item){if(item.id===groupId)original=item;});
  if(!original)return {ok:false,reason:'missing-original'};
  var comparable=['name','category','unit','stopRef','legacyQtyText','photoId'];
  if(group.some(function(item){
    return comparable.some(function(field){return String(item&&item[field]||'')!==String(original[field]||'');});
  }))return {ok:false,reason:'field-mismatch'};
  var own=false,proxy=false,aggregates={},total=0,reason='';
  group.forEach(function(item){
    var seen={};
    var allocations=shoppingItemAllocations(item);
    if(!allocations.length){reason=reason||'invalid-allocation';return;}
    allocations.forEach(function(allocation){
      if(reason)return;
      var key=canonicalMemberName(allocation&&allocation.target||'');
      if(Object.prototype.hasOwnProperty.call(seen,key)){reason='duplicate-target';return;}
      seen[key]=true;
      if(key)proxy=true;else own=true;
      if(allocation.quantity===null){reason='legacy-quantity';return;}
      if(!isSafeShoppingQuantity(allocation.quantity)){reason='invalid-quantity';return;}
      if(!Array.isArray(allocation.ledgerLinks)||allocation.ledgerLinks.length){reason='ledger-history';return;}
      if(!aggregates[key])aggregates[key]={target:String(allocation.target||''),quantity:0,allocationId:String(allocation.allocationId||'')};
      aggregates[key].quantity+=allocation.quantity;
      total+=allocation.quantity;
      if(!Number.isSafeInteger(aggregates[key].quantity)||!Number.isSafeInteger(total))reason='quantity-overflow';
    });
  });
  if(reason)return {ok:false,reason:reason};
  if(own&&proxy)return {ok:false,reason:'mixed-target-mode'};
  shoppingItemAllocations(original).forEach(function(allocation){
    var key=canonicalMemberName(allocation.target||'');
    aggregates[key].target=String(allocation.target||'');
    aggregates[key].allocationId=String(allocation.allocationId||'');
  });
  return {ok:true,reason:'',group:group,original:original,aggregates:aggregates};
}
function shoppingSplitRemergeEligibility(items,splitGroupId){
  var result=analyzeShoppingSplitRemerge(items,splitGroupId);
  return {ok:result.ok,reason:result.reason};
}
function buildShoppingRemergedItem(group,splitGroupId){
  var analysis=analyzeShoppingSplitRemerge(group,splitGroupId);
  if(!analysis.ok)throw new Error('採買拆分群組無法安全合併：'+analysis.reason);
  var original=analysis.original,ordered=[],seen={};
  [original].concat(analysis.group.filter(function(item){return item!==original;})).forEach(function(item){
    shoppingItemAllocations(item).forEach(function(allocation){
      var key=canonicalMemberName(allocation.target||'');
      if(seen[key])return;
      seen[key]=true;
      var aggregate=analysis.aggregates[key];
      ordered.push({
        allocationId:aggregate.allocationId,
        target:aggregate.target,
        quantity:aggregate.quantity,
        ledgerLinks:[]
      });
    });
  });
  return Object.assign({},original,{
    allocations:ordered,
    done:false,
    completedAt:'',
    splitGroupId:''
  });
}
function planShoppingMoveBackToPending(items,ids){
  var current=Array.isArray(items)?items:[],wanted={},targets=[];
  (ids||[]).forEach(function(value){
    var id=String(value||'');
    if(!wanted[id]){wanted[id]=true;targets.push(id);}
  });
  var byId={};
  current.forEach(function(item){byId[item.id]=item;});
  targets.forEach(function(id){
    if(!Object.prototype.hasOwnProperty.call(byId,id))throw new Error('找不到採買項目：'+id);
  });
  var affectedGroups={},movedCount=0;
  var next=current.map(function(item){
    if(!wanted[item.id])return item;
    if(item.done===true){
      movedCount++;
      var groupId=String(item.splitGroupId||'').trim();
      if(groupId)affectedGroups[groupId]=true;
    }
    return Object.assign({},item,{done:false,completedAt:''});
  });
  var mergedGroupCount=0,unmergedReasons={};
  Object.keys(affectedGroups).forEach(function(groupId){
    var eligibility=shoppingSplitRemergeEligibility(next,groupId);
    if(!eligibility.ok){
      unmergedReasons[eligibility.reason]=(unmergedReasons[eligibility.reason]||0)+1;
      return;
    }
    var group=next.filter(function(item){return String(item&&item.splitGroupId||'').trim()===groupId;});
    var merged=buildShoppingRemergedItem(group,groupId);
    next=next.filter(function(item){
      return String(item&&item.splitGroupId||'').trim()!==groupId||item.id===groupId;
    }).map(function(item){return item.id===groupId?merged:item;});
    mergedGroupCount++;
  });
  return {
    items:next,
    movedCount:movedCount,
    mergedGroupCount:mergedGroupCount,
    unmergedReasons:unmergedReasons
  };
}
function shoppingMoveBackFeedback(result,isBatch){
  result=result||{};
  var moved=Math.max(0,Number(result.movedCount)||0);
  var merged=Math.max(0,Number(result.mergedGroupCount)||0);
  var reasons=result.unmergedReasons||{},hasSafetyWarning=Object.keys(reasons).some(function(reason){
    return reason!=='still-purchased'&&reasons[reason]>0;
  });
  if(!isBatch){
    if(merged)return '已移回待買並合併為 1 項';
    if(hasSafetyWarning)return '已移回待買；因內容或記帳狀態不同，未自動合併';
    return '已移回待買';
  }
  var message='已將 '+moved+' 項移回待買';
  if(merged)message+='，並合併 '+merged+' 組';
  if(hasSafetyWarning)message+='；部分項目因內容或記帳狀態不同而保留分開';
  return message;
}
function shoppingDetailLedgerSummary(summary){
  var source=summary||{},total=Math.max(0,Number(source.total)||0);
  var linked=Math.max(0,Number(source.linked)||0);
  var unverified=Math.max(0,Number(source.unverified)||0);
  var unlinked=Math.max(0,total-linked-unverified);
  if(total<=1)return unverified?'待確認':linked?'已記帳':'未記帳';
  if(unverified){
    var parts=[];
    if(linked)parts.push('已記帳 '+linked);
    parts.push('待確認 '+unverified);
    if(unlinked)parts.push('未記帳 '+unlinked);
    return parts.join(' · ');
  }
  return '已記帳 '+linked+'／'+total+' 筆';
}
function shoppingDetailLedgerAction(summary){
  var source=summary||{},total=Math.max(0,Number(source.total)||0);
  var linked=Math.max(0,Number(source.linked)||0);
  var unverified=Math.max(0,Number(source.unverified)||0);
  var unlinked=Math.max(0,total-linked-unverified);
  if(unverified)return {
    kind:'waiting',label:'等待狀態確認',disabled:true,
    note:'有 '+unverified+' 筆仍在確認同步狀態，完成後才能繼續，避免重複記帳。'
  };
  if(!unlinked)return {kind:'none',label:'',disabled:false,note:''};
  return {
    kind:'entry',label:linked?'繼續記帳（剩 '+unlinked+' 筆）':'記帳',
    disabled:false,note:''
  };
}

function createShoppingAllocationId(itemId,usedIds,randomFn){

    var id=String(itemId||'shopping')+'-allocation-'+Date.now().toString(36)+'-'+suffix;
    if(!used[id])return id;
  }
  throw new Error('無法建立採買分配 ID');

function normalizeShoppingAllocation(source,options){
  source=source&&typeof source==='object'?source:{};
  options=options||{};
  var target=String(source.target==null?'':source.target).replace(/\u3000/g,' ').replace(/\s+/g,' ').trim();
  if(target)target=normalizeLedgerProxyTarget(target);
  var quantity=source.quantity;
  if(quantity!==null&&!isSafeShoppingQuantity(quantity))throw new Error('採買分配數量必須是 1 以上的安全整數');
  if(source.ledgerLinks!==undefined&&source.ledgerLinks!==null&&!Array.isArray(source.ledgerLinks))throw new Error('記帳關聯必須是陣列');
  return {
    allocationId:String(source.allocationId||options.allocationId||'').trim(),
    target:target,
    quantity:quantity,
    ledgerLinks:(source.ledgerLinks||[]).map(buyToLedgerDomain.normalizeLink)
  };
}
function normalizeShoppingAllocations(source,options){
  options=options||{};
  var itemId=String(options.itemId||''),raw=[];
  if(!Array.isArray(source.allocations)&&source.ledgerLinks!==undefined&&source.ledgerLinks!==null&&!Array.isArray(source.ledgerLinks))
    throw new Error('記帳關聯必須是陣列');
  if(Array.isArray(source.allocations))raw=source.allocations.slice();
  else if(Array.isArray(source.targets)&&source.targets.length){
    raw=source.targets.map(function(target){return {target:target,quantity:options.quantity,ledgerLinks:[]};});
  }else{
    raw=[{
      target:String(source.buyFor==null?'':source.buyFor),
      quantity:options.quantity,
      ledgerLinks:Array.isArray(source.ledgerLinks)?source.ledgerLinks:[]
    }];
  }
  if(!raw.length)throw new Error('採買分配不可空白');
  var usedIds={},usedTargets={},total=0,legacyCount=0;
  var allocations=raw.map(function(value,index){
    var preferred=String(value&&value.allocationId||'').trim();
    var allocationId=preferred;
    if(!allocationId){
      if(typeof options.allocationIdFactory==='function')allocationId=String(options.allocationIdFactory(itemId,usedIds)||'').trim();
      if(!allocationId)allocationId=itemId+'-allocation-'+(index+1);
    }
    if(usedIds[allocationId])throw new Error('採買分配 ID 重複');
    usedIds[allocationId]=true;
    var allocation=normalizeShoppingAllocation(value,{allocationId:allocationId});
    var targetKey=allocation.target?canonicalMemberName(allocation.target):'';
    if(targetKey&&usedTargets[targetKey])throw new Error('代購對象重複');
    if(targetKey)usedTargets[targetKey]=true;
    if(allocation.quantity===null)legacyCount++;
    else{
      total+=allocation.quantity;
      if(!Number.isSafeInteger(total))throw new Error('採買總數量超出安全範圍');
    }
    return allocation;
  });

  if(own&&(allocations.length!==1||own!==1))throw new Error('自己的分配不可與代購對象混用');
  if(legacyCount&&allocations.length!==1)throw new Error('舊式採買數量格式錯誤');
  return allocations;
}
function normalizeShoppingItem(source,options){
  source=source&&typeof source==='object'?source:{};
  options=options||{};
  var itemId=String(source.id||options.id||'').trim();
  var name=String(source.name||'').replace(/\u3000/g,' ').replace(/\s+/g,' ').trim();
  var category=String(source.category||'').trim();
  if(!name)throw new Error('採買品名不可空白');
  if(category==='代購')category='';
  if(category&&SHOPPING_CATEGORIES.indexOf(category)<0)throw new Error('採買分類不在允許範圍');
  var createdAt=String(source.createdAt||'').trim();
  if(!createdAt)createdAt=timestampDate(options.now==null?Date.now():options.now).toISOString();
  if(!isFinite(Date.parse(createdAt)))throw new Error('採買建立時間格式錯誤');

function buildTransferSuggestions(memberBalances,currency,memberOrder){

  if(memberBalances&&!Array.isArray(memberBalances)&&Array.isArray(memberBalances.members)){
    if(!Array.isArray(memberOrder)&&Array.isArray(memberBalances.memberOrder))memberOrder=memberBalances.memberOrder;
    memberBalances=memberBalances.members;
  }
  var field=currency==='JPY'?'netJpy':'netTwd',orderInfo=settlementOrderInfo(memberOrder||[]),debtors=[],creditors=[],totalDebt=0,totalCredit=0;
  (memberBalances||[]).forEach(function(item){

    if(amount<0){totalDebt+=-amount;if(!isSafeLedgerInteger(totalDebt))throw new Error('結算應付總額超過安全整數範圍');debtors.push({member:item.member,amount:-amount});}
    else if(amount>0){totalCredit+=amount;if(!isSafeLedgerInteger(totalCredit))throw new Error('結算應收總額超過安全整數範圍');creditors.push({member:item.member,amount:amount});}
  });
  if(totalDebt!==totalCredit)throw new Error('結算淨額總和必須為零');
  function byAmountThenMember(left,right){return right.amount-left.amount||compareSettlementMembers(left.member,right.member,orderInfo);}
  var suggestions=[];
  while(debtors.length&&creditors.length){
    debtors.sort(byAmountThenMember);creditors.sort(byAmountThenMember);
    var debtor=debtors[0],creditor=creditors[0],amount=Math.min(debtor.amount,creditor.amount);
    suggestions.push({from:debtor.member,to:creditor.member,amount:amount,currency:currency});
    debtor.amount-=amount;creditor.amount-=amount;
    if(!debtor.amount)debtors.shift();
    if(!creditor.amount)creditors.shift();

/* ================= 結算握手(ADR 0007:claim → confirm/reject,append-only) ================= */
function isSettlementClaimRecord(record){ return !!record&&record.recordType==='settlement_claim'; }

function createSettlementClaim(from,to,amount,currency,testMode,now,randomFn){

  if(!canonicalMemberName(payer))throw new Error('付款人必填');

  if(canonicalMemberName(payer)===canonicalMemberName(receiver))throw new Error('付款人與收款人不可相同');
  if(currency!=='JPY'&&currency!=='TWD')throw new Error('結算幣別必須是 JPY 或 TWD');
  if(!isSafeLedgerInteger(value)||value<=0)throw new Error('結清金額必須是正整數');
  return normalizeLedgerRecord({
    member:payer,category:'其他',detail:'[結清] '+payer+' → '+receiver,
    amountJpy:currency==='JPY'?value:0,amountTwd:currency==='TWD'?value:0,
    note:'',participants:JSON.stringify([receiver]),payMethod:'',
    recordType:'settlement_claim',targetRecordId:'',deleteReason:'',batchId:'',inputCurrency:currency

}
function createSettlementResponse(type,claim,member,reason,testMode,now,randomFn){

  if(!isSettlementClaimRecord(claim))throw new Error('目標必須是結清紀錄');
  if(!canonicalMemberName(actor))throw new Error('操作者必填');
  var receivers=parseParticipants(claim,function(){});
  if(!receivers||receivers.length!==1)throw new Error('結清紀錄缺少收款人');
  if(canonicalMemberName(actor)!==canonicalMemberName(receivers[0]))throw new Error('只有收款人可以回覆結清');
  var cleanReason=String(reason||'').trim();
  if(cleanReason.length>50)throw new Error('退回原因最多 50 個字');
  return normalizeLedgerRecord({
    member:actor,category:'其他',detail:type==='settlement_confirm'?'[結清確認]':'[結清退回]',
    amountJpy:0,amountTwd:0,note:type==='settlement_reject'?cleanReason:'',participants:'',payMethod:'',
    recordType:type,targetRecordId:String(claim.id||''),deleteReason:'',batchId:''

}
/* 全事件穩定全序:record.time ASC → record.id ASC。
   claim/claim、confirm/reject、terminal event 與下一筆 claim、withdraw 與下一筆 claim
   一律共用本 comparator;generation close 因此是可比較的 terminal event position,
   而非單純的 closesAt 時間字串 —— 否則同毫秒的 reject 會讓新付款靜默失效。 */

  return String(aTime||'').localeCompare(String(bTime||''))||String(aId||'').localeCompare(String(bId||''));

function laterSettlementPosition(a,b){

function deriveSettlements(records,warnFn,universe){
  // ADR 0007 — settlement handshake as an append-only event stream of claim generations.
  // Per settlement key (universe, from, to, currency): canonical = earliest claim by the
  // stable total order (normalized record.time ASC -> record.id ASC). Claims raised while a
  // generation is open are suppressed duplicates (permanently inert, warned). A generation is
  // terminated by a valid confirm/reject/withdraw of the canonical; only an explicit new claim
  // after that terminal event opens the next generation. This guarantees deterministic
  // convergence across every input ordering (optimistic and remote) — not server-arrival order.
  universe=universe==='test'?'test':'formal';

  raw.forEach(function(record){
    if(!isSettlementClaimRecord(record)||!inUniverse(record))return;
    var from=String(record.member||'').trim(),receivers=parseParticipants(record,warnFn),currency=settlementClaimCurrency(record),amount=settlementClaimAmount(record);
    if(!canonicalMemberName(from)){settlementWarning(warnFn,'結算排除結清 '+String(record.id||'')+':缺少付款人');return;}
    if(!receivers||receivers.length!==1){settlementWarning(warnFn,'結算排除結清 '+String(record.id||'')+':收款人快照無效');return;}
    if(canonicalMemberName(from)===canonicalMemberName(receivers[0])){settlementWarning(warnFn,'結算排除結清 '+String(record.id||'')+':付款人與收款人相同');return;}
    if(!currency||amount===null){settlementWarning(warnFn,'結算排除結清 '+String(record.id||'')+':金額或幣別無效');return;}
    var info={rec:record,id:String(record.id),time:String(record.time||''),from:from,to:receivers[0],currency:currency,amount:amount,

  var responsesByClaim=Object.create(null);

    if(canonicalMemberName(record.member)!==canonicalMemberName(target.to)){settlementWarning(warnFn,'忽略結算回覆 '+String(record.id||'')+':只有收款人可以回覆');return;}

      // 一律 inert —— 不影響餘額、不進正式歷史,只留 diagnostic warning。

    }

  }

  var byKey=Object.create(null);

  var entries=[],generations=[],suppressed=Object.create(null);

        suppressed[info.id]=true;

        return;
      }
      var term=terminalOf(info);
      genOpen=true;genCloses=term.closesAt;
      var entry={key:universe+' '+key,claim:info.rec,claimPos:{time:info.time,id:info.id},generation:index++,

  var newestByKey=Object.create(null);

  Object.keys(responsesByClaim).forEach(function(cid){
    if(suppressed[cid])responsesByClaim[cid].forEach(function(r){settlementWarning(warnFn,'結算收斂:忽略指向被抑制結清 '+cid+' 的回覆 '+String(r.id||''));});
  });
  return {
    entries:entries,
    generations:generations,
    confirmed:entries.filter(function(entry){return entry.status==='confirmed';}),

/* 主面板只顯示每個 settlement key 的最新可操作 generation;較舊的 rejected／confirmed 進歷史。 */
function latestSettlementGenerations(handshake){
  return ((handshake&&handshake.entries)||[]).filter(function(entry){return entry.latest;});
}

  return ((handshake&&handshake.entries)||[]).filter(function(entry){return !entry.latest;});
}
function applyConfirmedSettlements(balances,confirmedEntries){
  var source=balances&&Array.isArray(balances.members)?balances:{members:[],memberOrder:[],invalidRecords:[]};
  var members=source.members.map(function(item){return Object.assign({},item);}),index=Object.create(null);

/* 結算操作可靠性(Ticket 7):pre-await 單裝置操作鎖 + 送出中/等待同步/失敗 按鈕狀態機。

  acquire:function(key){key=String(key||'');if(!key||held[key])return false;held[key]=true;return true;},

  currency=currency==='TWD'?'TWD':'JPY';

  }catch(ignore){return primary;}
}
function settlementExchangeRate(){
  try{return currentLedgerSettings().exchangeRate;}catch(ignore){return 0;}
}
/* 參考幣別一律由結算幣別換算而來,不得使用另一幣獨立累計的餘額。

function settlementReferenceTransfers(suggestions,rate){
  return (suggestions||[]).map(function(item){
    var other=item.currency==='TWD'?'JPY':'TWD',amount=settlementReferenceAmount(item.amount,item.currency,rate);

/* ================= 結算狀態機(§3 統一文案) =================
   一筆結算在使用者眼中的狀態,完全由「已推導的 generation 狀態」+「該紀錄是否已被遠端讀回」
   +「本機是否正在送出／送出失敗」決定。已操作過的按鈕不得因重新渲染而復原。 */

   狀態機的 label 維持 §3 核准原文不變,只在顯示層去重:
   chip 與按鈕文案完全相同時不出 chip;chip 尾端就是按鈕動作時只留狀態部分。 */

  var chip=String(label||''),action=String(actionLabel||'');
  if(!chip||!action)return chip;

}
/* 一列最終的 chip:在既有去重規則之上再加一條 —— 當這一列已經擺出「確認已收／退回」

   是同一件事說兩遍,而且逼整列變成兩行。其餘 chip 帶有按鈕沒有的資訊,一律保留。 */

}
function settlementEntryStatus(entry,me,options){
  var opts=options||{},phase=String(opts.phase||'idle'),meKey=canonicalMemberName(me);
  var view={label:'',reason:'',waitingSync:false,canClaim:false,canRespond:false,canRemark:false,canWithdraw:false,canRetry:false,sortKind:'submitted'};
  if(!entry)return view;
  var isPayer=canonicalMemberName(entry.from)===meKey,isReceiver=canonicalMemberName(entry.to)===meKey;
  var latest=entry.latest!==false;
  if(phase==='submitting'){view.label='送出中…';view.sortKind=isReceiver?'awaiting-you':'submitted';return view;}
  if(phase==='failed'){view.label='同步失敗・重新同步';view.canRetry=true;view.sortKind='sync-error';return view;}
  if(entry.status==='pending'){
    view.waitingSync=settlementRecordAwaitingSync(entry.claim);
    if(isReceiver){view.label='待你確認';view.canRespond=latest;view.sortKind='awaiting-you';return view;}
    // 付款人:POST accepted 或安全寫入 durable queue／bridge 後,「我已付款」不得重新出現。
    // 「已送出」是冗字:這一列有「撤回」可按,本身就代表已經送出過。
    view.label='等待對方確認';view.canWithdraw=isPayer&&latest;view.sortKind='submitted';return view;
  }
  if(entry.status==='confirmed'){
    view.waitingSync=settlementRecordAwaitingSync(entry.response);
    view.label=view.waitingSync?'已確認・同步中':'已完成';
    view.sortKind='submitted';return view;
  }
  if(entry.status==='rejected'){
    view.waitingSync=settlementRecordAwaitingSync(entry.response);
    view.reason=String(entry.response&&entry.response.note||'').trim();
    if(view.waitingSync){view.label='已退回・同步中';view.sortKind=isPayer?'rejected':'submitted';return view;}
    view.label=isPayer?'對方已退回':'已退回';
    view.canRemark=isPayer&&latest;
    view.sortKind=isPayer?'rejected':'submitted';return view;
  }
  view.label='已完成';return view;
}
/* 主面板排序:待你確認 → 對方已退回／需重新付款 → 待你付款 → 已送出・等待確認 → 同步異常 */
var SETTLEMENT_PANEL_ORDER={'awaiting-you':0,'rejected':1,'to-pay':2,'submitted':3,'sync-error':4};
function compareSettlementPanelRows(left,right){
  var a=SETTLEMENT_PANEL_ORDER[left&&left.sortKind],b=SETTLEMENT_PANEL_ORDER[right&&right.sortKind];
  return (a===undefined?9:a)-(b===undefined?9:b);
}
/* §7.4 等待提示分級;record.id 一律只縮短顯示,不在一般畫面完整暴露。 */
function settlementWaitHint(waitedMs){
  var waited=Number(waitedMs)||0;
  if(waited<=30000)return '等待同步';
  if(waited<120000)return '同步較久,可手動重試';
  return '同步異常';
}
function shortRecordId(id){
  var text=String(id||'');
  if(!text)return '';
  var parts=text.split('-');
  return '…-'+parts[parts.length-1];
}
/* §10 待確認期間新增的消費:只改善顯示語意,不動 buildMemberBalances／buildTransferSuggestions。
   本行貼在摘要金額正下方,必須短到能與金額同欄 —— 只講對象、上筆已結清金額、新帳款金額,
   不重述「待處理」(下方「需要你處理」區塊已經是那個意思)。
   結清是「一對成員之間的淨額」,由多筆消費彙總而來,沒有單一明細可指名,因此只講金額不講品項。 */
function settlementNewChargeNote(entry,remainingAmount,me){
  var remaining=Number(remainingAmount)||0;
  if(!entry||remaining<=0)return '';
  var other=canonicalMemberName(entry.from)===canonicalMemberName(me)?entry.to:entry.from;
  return other+' 上筆 '+formatLedgerCurrencyAmount(entry.currency,entry.amount)+' 已結清・新帳款 '+formatLedgerCurrencyAmount(entry.currency,remaining);
}
/* §7.5 待處理徽章:只計入與 currentMember 直接相關、且屬最新 generation 的待辦。 */
function settlementBadgeCount(handshake,me){
  var key=canonicalMemberName(me);
  if(!key)return 0;
  return latestSettlementGenerations(handshake).filter(function(entry){
    if(entry.status==='pending')return canonicalMemberName(entry.to)===key;
    if(entry.status==='rejected')return canonicalMemberName(entry.from)===key;
    return false;
  }).length;
}
/* §12 身分切換提醒:只有「舊身分仍有未完成結算」且「要建立全新身分」時才提醒。
   切換至既有已註冊身分不是改名,不顯示警告;本函式不修改任何 record.member。 */
function identitySwitchWarningNeeded(handshake,member,creatingNewIdentity){
  if(!creatingNewIdentity)return false;
  var key=canonicalMemberName(member);
  if(!key)return false;
  return latestSettlementGenerations(handshake).some(function(entry){
    if(entry.status!=='pending'&&entry.status!=='rejected')return false;
    return canonicalMemberName(entry.from)===key||canonicalMemberName(entry.to)===key;
  });
}

/* ================= §9 已確認收款的 10 秒一次性復原資格(純函式) =================
   產品裁定:確認送出後只在操作裝置提供一次 10 秒復原,逾時即為終局結果;
   結清歷史不提供任何永久撤銷入口。同時要求:操作者是原收款者、response 是有效
   settlement_confirm、尚未被 deletion 撤銷、此為該 settlement key 的最新有效
   generation,且距 response.time 未超過 10 秒。UI 與 handler 都必須檢查。 */
var SETTLEMENT_UNDO_WINDOW_MS=10*1000;
function settlementConfirmUndoEligibility(entry,allEntries,actor,now){
  var invalid={allowed:false,reason:'invalid',expiresAt:0};
  if(!entry||entry.status!=='confirmed')return invalid;
  var response=entry.response;
  if(!response||response.recordType!=='settlement_confirm')return invalid;
  var responseAt=Date.parse(String(response.time||'')),at=Number(now);   // ISO 比較,不依顯示時區字串
  if(!isFinite(responseAt)||!isFinite(at))return invalid;
  // 明顯位於未來的 response.time 不可信,不得用來延長復原期限。
  if(responseAt>at+SETTLEMENT_UNDO_WINDOW_MS)return invalid;
  var expiresAt=responseAt+SETTLEMENT_UNDO_WINDOW_MS,list=allEntries||[],claimId=String(entry.claim&&entry.claim.id||'');
  if(canonicalMemberName(actor)!==canonicalMemberName(entry.to))return {allowed:false,reason:'not-receiver',expiresAt:expiresAt};
  // 重新推導後同一 claim 不再帶著這筆 confirm,代表它已被 deletion／revoke record 撤銷。
  var undone=list.some(function(other){
    if(!other||other===entry||String(other.claim&&other.claim.id||'')!==claimId)return false;
    return !(other.status==='confirmed'&&other.response&&other.response.id===response.id);
  });
  if(undone)return {allowed:false,reason:'already-undone',expiresAt:expiresAt};
  var pos=entry.claimPos||{time:String(entry.claim&&entry.claim.time||''),id:claimId};
  var superseded=list.some(function(other){
    if(!other||other===entry||other.key!==entry.key)return false;
    var otherPos=other.claimPos||{time:String(other.claim&&other.claim.time||''),id:String(other.claim&&other.claim.id||'')};
    return compareSettlementEvents(otherPos.time,otherPos.id,pos.time,pos.id)>0;
  });
  if(superseded)return {allowed:false,reason:'superseded',expiresAt:expiresAt};
  if(at>expiresAt)return {allowed:false,reason:'expired',expiresAt:expiresAt};
  return {allowed:true,reason:'allowed',expiresAt:expiresAt};
}
/* Toast 只給「剩餘」期限:動畫、重新渲染或同步延遲都不得延長自 response.time 起算的 10 秒。 */
function settlementUndoToastDurationMs(response,now){
  var responseAt=Date.parse(String(response&&response.time||'')),at=Number(now);
  if(!isFinite(responseAt)||!isFinite(at))return 0;
  return Math.max(0,responseAt+SETTLEMENT_UNDO_WINDOW_MS-at);
}
/* §1 自動收起結算面板的判斷:只有「面板開著」且「已經沒有任何需要我處理的列」才收起,
   讓 10 秒復原 toast 完全不被遮擋。還有其他待處理項目時一律不關 —— 否則使用者得為
   每一筆重新點開面板。rowCount 必須來自主面板實際列出的列數,算不出來時保守不關。 */
function settlementPanelShouldClose(rowCount,panelOpen){
  var count=Number(rowCount);
  if(rowCount===null||rowCount===''||rowCount===undefined||!isFinite(count))return false;
  return !!panelOpen&&count===0;
}
function settlementUndoBlockMessage(reason){
  if(reason==='expired')return '復原期限已結束，此筆收款確認已完成';
  if(reason==='superseded')return '此筆已有後續結算，無法復原舊確認';
  if(reason==='not-receiver')return '只有原收款者可以復原確認';
  if(reason==='already-undone')return '此筆確認已經復原';
  return '此筆結算狀態無法復原';
}

/* ================= §7 ledger fast pull(doGet 加速層 client 端) =================
   doGet 只服務 ledger 單表,且回傳資料必須走與 CSV 完全相同的正規化與驗證管線 ——
   因此增量列先還原成 CSV 文字,再交給既有 parseTable。不另闢解析路徑。 */
function ledgerFastPullCsvField(value){
  var text=value===null||value===undefined?'':String(value);
  return /[",\n\r]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text;
}
function ledgerFastPullCsv(headers,rows){
  var lines=[(headers||[]).join(',')];
  (rows||[]).forEach(function(row){lines.push((row||[]).map(ledgerFastPullCsvField).join(','));});
  return lines.join('\n');
}
/* 非 JSON(配額用盡、部署失效、權限錯誤的 HTML 錯誤頁)一律視為失敗並降級回 CSV:
   不嘗試解析、不從 HTML 擷取資料、不清除 bridge、不讓按鈕復原。 */
function readLedgerFastPullResponse(text){
  var payload=null;
  try{payload=JSON.parse(String(text||''));}
  catch(error){return {ok:false,error:'回應不是可解析的 JSON'};}
  if(!payload||typeof payload!=='object'||payload.ok!==true||!Array.isArray(payload.rows))return {ok:false,error:String(payload&&payload.error||'ledger 增量讀取失敗')};
  return {ok:true,serverTime:String(payload.serverTime||''),total:Number(payload.total)||0,
    after:Number(payload.after)||0,reset:payload.reset===true,rows:payload.rows};
}
/* §11 時鐘偏移:以 serverTime 與 request 往返中點估算。僅告知,不自動校時、
   不改寫任何 record.time、不阻擋操作,也不參與 canonical ordering。 */
function computeClockOffsetMs(serverTime,requestStartedAt,responseReceivedAt){
  var serverAt=Date.parse(String(serverTime||'')),start=Number(requestStartedAt),end=Number(responseReceivedAt);
  if(!isFinite(serverAt)||!isFinite(start)||!isFinite(end))return null;
  return serverAt-(start+end)/2;
}
function clockOffsetNeedsWarning(offsetMs){
  if(offsetMs===null||offsetMs===undefined)return false;
  var value=Number(offsetMs);
  return isFinite(value)&&Math.abs(value)>120000;
}
function clockOffsetLabel(offsetMs){
  if(offsetMs===null||offsetMs===undefined||!isFinite(Number(offsetMs)))return '無資料';
  var minutes=Math.round(Math.abs(Number(offsetMs))/60000);
  return minutes?('本機時間偏移:約 '+minutes+' 分鐘'):'正常';
}
/* Polling 節奏:面板開啟 5 秒 → 閒置 2 分鐘退避 15 秒 → 閒置 10 分鐘退避 60 秒;
   面板關閉但 bridge 仍有未讀回紀錄時降為 30 秒,直到全部讀回才完全停止。
   兩層退避是為了保護 Apps Script 每日執行配額。hidden／offline 一律暫停。 */
function createLedgerFastPullController(options){
  var opts=options||{};
  var now=opts.now||function(){return Date.now();};
  var setTimer=opts.setTimer||function(fn,delay){return setTimeout(fn,delay);};
  var clearTimer=opts.clearTimer||function(id){clearTimeout(id);};
  var timer=null,inFlight=null,started=false,lastNewDataAt=now();
  function panelActive(){
    var open=typeof opts.isPanelOpen==='function'&&opts.isPanelOpen();
    var simple=typeof opts.isSimpleMode==='function'&&opts.isSimpleMode();
    return open&&!simple;
  }
  function bridgeActive(){return typeof opts.hasBridgeRecords==='function'&&opts.hasBridgeRecords();}
  function paused(){
    if(typeof opts.isHidden==='function'&&opts.isHidden())return true;
    return typeof opts.isOnline==='function'&&!opts.isOnline();
  }
  function currentInterval(){
    if(paused())return 0;
    if(panelActive()){
      var idle=now()-lastNewDataAt;
      if(idle>=600000)return 60000;
      if(idle>=120000)return 15000;
      return 5000;
    }
    return bridgeActive()?30000:0;
  }
  function clear(){if(timer!==null){clearTimer(timer);timer=null;}}
  function schedule(){
    clear();
    if(!started)return;
    var interval=currentInterval();
    if(!interval)return;
    timer=setTimer(function(){timer=null;trigger('interval').then(schedule,schedule);},interval);
  }
  function trigger(reason){
    if(inFlight)return inFlight;                       // 同時最多一個 fast pull in-flight
    if(typeof opts.pull!=='function')return Promise.resolve({ok:false});
    var work;
    try{work=Promise.resolve(opts.pull(reason));}catch(error){work=Promise.reject(error);}
    inFlight=work.then(function(result){
      inFlight=null;
      if(result&&Number(result.newRecords)>0)lastNewDataAt=now();   // 一有新資料立即回復 5 秒
      return result;
    },function(error){inFlight=null;return {ok:false,error:error};});
    return inFlight;
  }
  return {
    start:function(){started=true;schedule();},
    stop:function(){started=false;clear();},
    reschedule:function(){schedule();},
    resume:function(reason){started=true;var work=trigger(reason);schedule();return work;},
    trigger:trigger,
    currentInterval:currentInterval,
    isActive:function(){return timer!==null;},
    lastNewDataAt:function(){return lastNewDataAt;}
  };
}

/* ================= Durable delivery bridge =================
   POST accepted 之後、遠端 read model 讀回同一 record.id 之前的空窗,由本橋接承接。
   交接必須是原子的:先持久化寫入 bridge → 確認寫入成功 → 才可將 record 移出 retry queue。
   bridge 寫入失敗時 record 必須留在 queue,不得產生資料遺失空窗;伺服器既有 record.id
   去重仍負責避免重複入帳。bridge 不因等待過久自動刪除,只有遠端讀回同一 id 才清除。 */
function ledgerDeliveryBridgeRecords(){
  var records=[];
  try{var parsed=JSON.parse(localStorage.getItem(LEDGER_DELIVERY_BRIDGE_KEY)||'[]');if(Array.isArray(parsed))records=parsed;}
  catch(error){AppLog.repo('交付橋接讀取失敗:'+(error.message||error));}
  try{
    // 舊版只橋接刪除;沿用同一份未讀回紀錄,避免升級後在途刪除消失。
    var legacyRaw=localStorage.getItem(LEDGER_DELETION_BRIDGE_KEY);
    if(legacyRaw){
      var legacy=JSON.parse(legacyRaw);
      if(Array.isArray(legacy)&&legacy.length){
        var seen={};records.forEach(function(item){if(item&&item.id)seen[item.id]=true;});
        legacy.forEach(function(item){if(item&&item.id&&!seen[item.id]){seen[item.id]=true;records.push(item);}});
      }
    }
  }catch(error){AppLog.repo('舊版刪除橋接遷移失敗:'+(error.message||error));}
  return records;
}
function writeLedgerDeliveryBridge(records){
  if(records.length)localStorage.setItem(LEDGER_DELIVERY_BRIDGE_KEY,JSON.stringify(records));
  else localStorage.removeItem(LEDGER_DELIVERY_BRIDGE_KEY);
  localStorage.removeItem(LEDGER_DELETION_BRIDGE_KEY);
}
/* 回傳 true 代表已可驗證地持久化;呼叫端只有在 true 時才可從 retry queue 移除該 record。 */
function rememberLedgerDeliveryBridge(record){
  if(!record||!record.id)return false;
  try{
    var records=ledgerDeliveryBridgeRecords();
    if(records.some(function(item){return item.id===record.id;})){writeLedgerDeliveryBridge(records);return true;}
    records.push(record);writeLedgerDeliveryBridge(records);
    return ledgerDeliveryBridgeRecords().some(function(item){return item.id===record.id;});
  }catch(error){
    AppLog.repo('交付橋接寫入失敗:'+(error.message||error)+' — 紀錄留在佇列');
    return false;
  }
}
function reconcileLedgerDeliveryBridge(cloudRecords){
  var confirmed={};
  (cloudRecords||[]).forEach(function(record){if(record&&record.id)confirmed[record.id]=true;});
  var records=ledgerDeliveryBridgeRecords(), next=records.filter(function(record){return !confirmed[record.id];});
  if(next.length!==records.length)writeLedgerDeliveryBridge(next);
  return next;
}
function ledgerDeliveryBridgeHasRecords(){return ledgerDeliveryBridgeRecords().length>0;}
function mergeLedgerRecordSets(cloudRecords,queuedRecords,bridgeRecords){
  var byId={}, merged=[];
  [cloudRecords||[],queuedRecords||[],bridgeRecords||[]].forEach(function(records){records.forEach(function(record){if(record&&record.id&&!byId[record.id]){byId[record.id]=true;merged.push(record);}});});
  return merged.sort(function(a,b){return String(b.time||'').localeCompare(String(a.time||''));});
}

function createLedgerRepository(options){
  var opts=options||{}, storage=opts.storage, post=opts.post, now=opts.now||Date.now, random=opts.random||Math.random, flushInFlight=null;
  function readQueue(){
    try{
      var parsed=JSON.parse(storage.getItem(LEDGER_QUEUE_KEY)||'[]');
      return Array.isArray(parsed)?parsed:[];
    }catch(error){ AppLog.repo('分帳佇列讀取失敗:'+(error.message||error)); return []; }
  }
  function writeQueue(queue){
    storage.setItem(LEDGER_QUEUE_KEY,JSON.stringify(queue));
    if(typeof opts.onChange==='function') opts.onChange(queue.length);
  }
  function pendingCount(){ return readQueue().length; }
  function flushQueue(){
    if(flushInFlight) return flushInFlight;
    var sent=0, sawDup=false;
    function sendNext(){
      var queue=readQueue();
      if(!queue.length) return Promise.resolve({ok:true,sent:sent,dup:sawDup,pending:0});
      var current=queue[0];
      return Promise.resolve().then(function(){ return post(current); }).then(function(response){
        if(!response||response.ok!==true) throw new Error(response&&response.error||'伺服器未確認寫入');
        // 原子式 handoff:bridge 必須先成功持久化,才可把 record 移出 retry queue。
        var handedOff=true;
        if(typeof opts.onDelivered==='function'){
          try{ handedOff=opts.onDelivered(current,response)!==false; }
          catch(bridgeError){ AppLog.repo('交付橋接失敗:'+(bridgeError.message||bridgeError)); handedOff=false; }
        }
        if(!handedOff){
          // 不得產生資料遺失空窗;留在佇列由既有補送機制承接,伺服器依 record.id 去重。
          return {ok:false,sent:sent,dup:sawDup,pending:pendingCount(),error:new Error('本機交付橋接寫入失敗,紀錄留在佇列')};
        }
        var latest=readQueue().filter(function(item){return item.id!==current.id;});
        writeQueue(latest); sent++; if(response.dup) sawDup=true;
        return sendNext();
      }).catch(function(error){
        AppLog.repo('分帳送出失敗:'+(error.message||error)+' — 已留在本機佇列');
        return {ok:false,sent:sent,dup:sawDup,pending:pendingCount(),error:error};
      });
    }
    flushInFlight=sendNext().then(function(result){flushInFlight=null;return result;},function(error){flushInFlight=null;throw error;});
    return flushInFlight;
  }
  function add(record){
    var at=now(), normalized=normalizeLedgerRecord(record,at,random,typeof opts.isTestMode==='function'&&opts.isTestMode());
    try{ validateLedgerRecord(normalized); }
    catch(error){ return Promise.reject(error); }
    var queue=readQueue();
    if(!queue.some(function(item){return item.id===normalized.id;})){ queue.push(normalized); writeQueue(queue); }
    return flushQueue().then(function(result){
      var delivered=!readQueue().some(function(item){return item.id===normalized.id;});
      return {ok:delivered,dup:!!result.dup,pending:pendingCount(),record:normalized,error:result.error};
    });
  }
  function enqueueBatch(records){
    var testMode=typeof opts.isTestMode==='function'&&opts.isTestMode();
    var normalized=(records||[]).map(function(record){
      var item=normalizeLedgerRecord(record,now(),random,testMode);
      validateLedgerRecord(item);return item;
    });
    if(!normalized.length)throw new Error('記帳批次不可為空');
    var next=readQueue().slice(),seen={};
    next.forEach(function(item){seen[item.id]=true;});
    normalized.forEach(function(item){if(!seen[item.id]){seen[item.id]=true;next.push(item);}});
    writeQueue(next);
    Promise.resolve().then(function(){return flushQueue();}).then(function(){
      if(typeof opts.onBackgroundFlush==='function')opts.onBackgroundFlush();
    },function(error){AppLog.repo('背景同步失敗：'+(error.message||error));});
    return {ok:true,queued:true,records:normalized,pending:next.length};
  }
  return {add:add,enqueueBatch:enqueueBatch,flushQueue:flushQueue,pendingCount:pendingCount,queuedRecords:readQueue};
}

function ledgerSyncErrorMessage(error){
  var message=String(error&&error.message||error||'').trim();
  if(/timeout|分帳寫入逾時/i.test(message))return '同步逾時，請確認網路後重試';
  if(/failed to fetch|network|offline|無法連線/i.test(message))return '無法連線，請確認網路後重試';
  return message||'同步失敗，請稍後再試';
}
function formatLedgerSyncRecordTime(value){
  var stamp=typeof value==='string'?Date.parse(value):Number(value),date=timestampDate(stamp),valid=date&&isFinite(date.getTime());
  return valid?date.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'建立時間不明';
}
function createLedgerQueueSyncCoordinator(repository,options){
  var opts=options||{},inFlight=null,lastError='';
  function flush(trigger){
    if(inFlight)return inFlight;
    var before=repository.pendingCount(),source=String(trigger||'auto');
    if(!before)return Promise.resolve({ok:true,sent:0,pending:0,error:'',trigger:source});
    var flushResult;try{flushResult=repository.flushQueue();}catch(error){flushResult=Promise.reject(error);}

function postLedgerSettings(settings){

      if(settled)return;

    var promise, body=JSON.stringify({

    }catch(error){finish(reject,error);return;}

      return fetch(LEDGER_POST_URL,{method:'POST',body:body});
    });

      if(!response.ok)throw new Error('HTTP '+response.status);
      return response.json();
    }).then(function(result){finish(resolve,result);},function(error){finish(reject,error);});
  });
}

function copyPersonalStateText(text,timeoutMs){
  if(typeof navigator==='undefined'||!navigator.clipboard||typeof navigator.clipboard.writeText!=='function')return Promise.reject(new Error('clipboard unavailable'));
  timeoutMs=Number(timeoutMs)||1500;
  return new Promise(function(resolve,reject){
    var settled=false;
    var timer=setTimeout(function(){if(settled)return;settled=true;reject(new Error('剪貼簿逾時'));},timeoutMs);
    var finish=function(fn,value){if(settled)return;settled=true;clearTimeout(timer);fn(value);};
    var promise;
    try{promise=navigator.clipboard.writeText(text);}catch(error){finish(reject,error);return;}
    Promise.resolve(promise).then(function(){finish(resolve);},function(error){finish(reject,error);});
  });
}
function exportPersonalState(){

     沒有任何回復機會,污染會變成永久。故模擬啟用中一律擋下匯出,而不是匯出一份髒的。 */
  if(isTimeSimulationActive()){toast('時間模擬進行中,請先於診斷面板結束模擬再備份');return Promise.resolve(false);}
