<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e3a44">
<title>TripPilot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root,[data-theme="ocean"]{
  /* 疊層順序寫成具名 token。身分選擇器的基準層維持 130 —— 它低於採買清單(145)
     等既有 overlay,那是刻意的既有關係,全域抬高會讓開著的選擇器蓋住整個 App
     (實測會攔截採買清單的點擊)。只有「從設定頁叫出來」時才需要疊在設定頁之上,
     因此另給一個 modifier 層級,180 落在既有的 170 與 185(照片修復)之間。 */
  --z-settings-overlay:170;
  --z-member-overlay:130;
  --z-member-over-settings:180;
  --tabbar-height:62px;
  --font-ui:"PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --t-paper:#f5f1e8;--t-card:#fffdf8;--t-chrome:#0e3a44;--t-action:#12707f;
  --t-accent:#df5f3a;--t-accent-bg:#fbeee7;--t-ink:#22303a;--t-ink-soft:#5c6b73;
  --t-ink-faint:#7c8a90;--t-line:#e5ddcd;--t-line-soft:#eee8db;
  --t-tabbar:rgba(255,253,248,.96);--t-secondary:#7659a0;
  --paper:var(--t-paper);--card:var(--t-card);--sea-deep:var(--t-chrome);
  --sea:var(--t-action);--coral:var(--t-accent);--coral-bg:var(--t-accent-bg);
  --ink:var(--t-ink);--ink-soft:var(--t-ink-soft);--ink-faint:var(--t-ink-faint);
  --line:var(--t-line);--line-soft:var(--t-line-soft);--violet:var(--t-secondary);
  --gold:#c1963c;
  --gold-ink:#85661c;
  --warning-border:#e7c37d;
  --warning-bg:#fff8e8;
  --warning-ink:#75530b;
  --correction-border:#b9d7d2;
  --green:#367055;
  --today-hero-text:#fff;
  --today-hero-emphasis:#fff3b5;
  --today-hero-summary-border:rgba(255,255,255,.22);
  --today-hero-summary-divider:rgba(255,255,255,.25);
  --today-hero-weather-shadow:rgba(8,36,27,.2);
  --shadow:0 2px 12px rgba(24,44,52,.08);
  --shadow-lg:0 8px 28px rgba(24,44,52,.16);
}
[data-theme="ivory"]{
  --t-paper:#faf9f5;--t-card:#ffffff;--t-chrome:#16243d;--t-action:#800000;
  --t-accent:#e25a0f;--t-accent-bg:#fdece2;--t-ink:#16243d;--t-ink-soft:#4a5361;
  --t-ink-faint:#727c8c;--t-line:#dcd8cc;--t-line-soft:#e8e5dc;
  --t-tabbar:rgba(255,255,255,.96);--t-secondary:#7659a0;
}
[data-theme="wisteria"]{
  --t-paper:#f6f3f7;--t-card:#ffffff;--t-chrome:#3b2d4d;--t-action:#6a3d7d;
  --t-accent:#c0416e;--t-accent-bg:#fae9ef;--t-ink:#2a2331;--t-ink-soft:#575061;
  --t-ink-faint:#7e7689;--t-line:#e6dee9;--t-line-soft:#efe9f2;
  --t-tabbar:rgba(255,255,255,.96);--t-secondary:#2f6f6a;
}
[data-theme="cedar"]{
  --t-paper:#f3f5f0;--t-card:#ffffff;--t-chrome:#23402f;--t-action:#2f6b4f;
  --t-accent:#d2622c;--t-accent-bg:#fbeadf;--t-ink:#1f2b23;--t-ink-soft:#4d5a50;
  --t-ink-faint:#79857c;--t-line:#dfe5da;--t-line-soft:#eaefe6;
  --t-tabbar:rgba(255,255,255,.96);--t-secondary:#7659a0;
}
[data-theme="mist"]{
  --t-paper:#f4f5f7;--t-card:#ffffff;--t-chrome:#3f4c5e;--t-action:#416b8a;
  --t-accent:#c86d4e;--t-accent-bg:#f8eae4;--t-ink:#25303d;--t-ink-soft:#56616f;
  --t-ink-faint:#747f8c;--t-line:#dce0e5;--t-line-soft:#e9ecef;
  --t-tabbar:rgba(255,255,255,.96);--t-secondary:#7659a0;
}
[data-theme="tea"]{
  --t-paper:#f7f2ed;--t-card:#fffdfb;--t-chrome:#4e3d32;--t-action:#896748;
  --t-accent:#b64f5c;--t-accent-bg:#f8e7e9;--t-ink:#332820;--t-ink-soft:#62564e;
  --t-ink-faint:#81756d;--t-line:#e5d9ce;--t-line-soft:#efe7df;
  --t-tabbar:rgba(255,253,251,.96);--t-secondary:#7659a0;
}
@media(prefers-reduced-motion:reduce){html,*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:light}
html,body{touch-action:pan-x pan-y}
body{
  font-family:var(--font-ui);
  background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-height) + env(safe-area-inset-bottom));
}
a{color:var(--sea)}
input,select,textarea{font-size:16px}

/* ===== 頂部列 ===== */
.hdr{position:sticky;top:0;z-index:60;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar{
  background:var(--sea-deep);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 0;
}
.brand{display:flex;align-items:center;gap:8px;padding:0 0 8px 8px;justify-content:flex-start;min-width:0}
.brand .logo{
  width:26px;height:26px;border-radius:7px;object-fit:cover;display:block;flex:0 0 26px;
}
.brand .logo.simulating{filter:hue-rotate(120deg) saturate(1.35)}
.sim-marker{display:none;color:#ffe19a;font-size:11px;font-weight:800}
.sim-marker.on{display:inline}
.brand .t{flex:1;color:#fff;font-size:15px;font-weight:700;letter-spacing:.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .sync{
  position:relative;min-height:44px;font-size:12px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:4px;
  background:transparent;border-radius:20px;padding:5px 10px;border:none;cursor:pointer;
  font-family:inherit;
}
.brand-actions{position:static;flex:0 0 auto;display:flex;align-items:center;gap:5px}
.settings-btn{position:relative;width:44px;height:44px;min-height:44px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.brand .sync::before,.settings-btn::before{content:"";position:absolute;z-index:0;inset:4px;border-radius:inherit;background:rgba(255,255,255,.1);pointer-events:none}
.brand .sync>*,.settings-btn>*{position:relative;z-index:1}
@media(max-width:390px){.brand .logo{width:24px;height:24px;flex-basis:24px}.brand .sync{padding:5px 8px}}
.brand .sync .dot{width:7px;height:7px;border-radius:50%;background:#5ec27a}
.brand .sync .dot.stale{background:var(--gold)}
.brand .sync .dot.err{background:var(--coral)}
.brand .sync.spinning .dot{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.trip-tabs{display:flex;gap:6px}
.trip-tab{
  flex:1;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.5);
  padding:9px 4px 11px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;
  font-family:inherit;transition:.2s;
}
.trip-tab .sub{display:block;font-size:10.5px;font-weight:400;opacity:.7;margin-top:1px}
.trip-tab.active{color:#fff;border-color:var(--coral)}

/* ===== 日期橫向 ===== */
.daybar{
  background:var(--sea);display:flex;gap:7px;overflow-x:auto;padding:8px 12px;
  scrollbar-width:none;
}
.daybar::-webkit-scrollbar{display:none}
.day-chip{
  min-height:44px;flex:0 0 auto;background:rgba(255,255,255,.13);border:none;border-radius:18px;cursor:pointer;
  color:rgba(255,255,255,.85);font-family:inherit;padding:6px 13px;font-size:13px;
  font-weight:600;white-space:nowrap;transition:.2s;line-height:1.3;text-align:center;
}
.day-chip .dow{font-size:9.5px;opacity:.8;display:block;font-weight:400}
.day-chip.active{background:var(--coral);color:#fff}
.day-chip.today-chip{box-shadow:0 0 0 2px #ffd98a inset}

/* ===== 內容 ===== */
.wrap{max-width:620px;margin:0 auto;padding:14px 12px 40px;min-height:calc(100vh - var(--tabbar-height) - env(safe-area-inset-bottom));min-height:calc(100dvh - var(--tabbar-height) - env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* 今日首頁 hero */
.today-hero{
  background:linear-gradient(140deg,var(--sea-deep),var(--sea));color:#fff;
  border-radius:16px;padding:11px 14px 12px;margin-bottom:0;box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.today-hero::after{
  content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
  background:radial-gradient(circle,rgba(223,95,58,.35),transparent 70%);
}
.today-hero .lbl{font-size:11px;letter-spacing:.14em;opacity:.75;font-weight:600}
.today-hero .date{font-size:24px;font-weight:800;margin:2px 0 2px;position:relative}
.today-hero .loc{font-size:13px;opacity:.9;position:relative}
.today-hero .empty{font-size:14px;opacity:.9;margin-top:6px;line-height:1.6;position:relative}
.today-hero-trip{display:block}
.today-hero-top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;position:relative}
.today-hero-top .lbl{min-width:0}.today-hero-top .loc{flex:0 0 auto;text-align:right;white-space:nowrap}
.today-hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;position:relative}
.today-weather-art{flex:0 0 76px;text-align:center;font-size:46px;line-height:1;filter:drop-shadow(0 5px 8px var(--today-hero-weather-shadow));position:relative}
.today-hero-summary{display:grid;grid-template-columns:minmax(0,.9fr) 1px minmax(0,1.1fr);gap:10px;align-items:center;padding-top:9px;border-top:1px solid var(--today-hero-summary-border);position:relative}
.today-hero-summary.single{grid-template-columns:minmax(0,1fr)}
.today-hero-summary-divider{width:1px;height:32px;background:var(--today-hero-summary-divider)}
.today-hero-summary-item{min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;color:var(--today-hero-text)}
.today-hero-summary-label{font-size:9px;letter-spacing:.08em;opacity:.74;font-weight:800;white-space:nowrap}
.today-hero-summary-value{display:flex;align-items:baseline;gap:4px;width:100%;min-width:0;overflow:hidden;margin-top:2px;font-size:13px;font-weight:900;white-space:nowrap}
.today-hero-summary-value small{flex:0 0 auto;font-size:10px;color:var(--today-hero-emphasis)}
.today-hero-shopping-summary{appearance:none;width:100%;min-height:44px;border:0;background:transparent;padding:0;text-align:right;font:inherit;align-items:flex-end;cursor:pointer}
.today-hero-shopping-summary .today-hero-summary-value{justify-content:flex-end}
.today-hero-shopping-generic .today-hero-summary-value{justify-content:flex-end}
.today-hero-shopping-summary:focus-visible{outline:2px solid var(--today-hero-text);outline-offset:3px;border-radius:7px}
.today-hero-shopping-stop{flex:0 1 auto;max-width:7em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-hero-shopping-separator,.today-hero-shopping-count{flex:0 0 auto}
.today-hero-shopping-separator{opacity:.58}
.today-hero-shopping-category{flex:0 0 auto;min-width:0;white-space:nowrap;font-weight:700;opacity:.8}
.mini-tl{margin-top:14px;position:relative}
.mini-item{display:flex;gap:11px;align-items:flex-start;padding:6px 0}
.mini-item .mt{font-size:12.5px;font-weight:700;color:#ffd98a;min-width:46px;padding-top:1px}
.mini-item .mc{flex:1;font-size:14px;font-weight:600;line-height:1.4}
.mini-item .mc small{display:block;font-size:11.5px;font-weight:400;opacity:.75;margin-top:1px}
.mini-item .md{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);margin-top:5px;flex:0 0 auto}
.mini-item.done .mc{opacity:.5;text-decoration:line-through}
.today-jump{
  display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);color:#fff;
  border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;position:relative;
}

/* 住宿卡 */
.hotel{
  background:var(--card);border-left:4px solid var(--gold);border-radius:12px;
  padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow);
}
.hotel .h-lbl{font-size:10.5px;letter-spacing:.1em;color:var(--gold-ink);font-weight:700;margin-bottom:4px}
.hotel .h-name{font-size:15.5px;font-weight:700;margin-bottom:5px}
.hotel .h-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.65;white-space:pre-line}

/* 日標題 */
.day-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;padding-bottom:9px;border-bottom:2px solid var(--line)}
.day-head .num{font-size:12px;font-weight:800;color:#fff;background:var(--coral);border-radius:7px;padding:3px 9px;letter-spacing:.03em}
.day-head .date{font-size:19px;font-weight:800;color:var(--sea-deep)}
.day-head .prog{margin-left:auto;font-size:12px;color:var(--ink-faint);font-weight:600}
.trip-filter{display:flex;gap:8px;margin:10px 0 12px}
.trip-filter-btn{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:9px 10px;font-size:13px;font-weight:800}
.trip-back-now{flex:0 0 auto;min-height:44px;border:1px solid var(--sea);background:var(--card);color:var(--sea-deep);border-radius:999px;padding:9px 12px;font:inherit;font-size:13px;font-weight:900;white-space:nowrap;cursor:pointer}
.trip-back-now:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.trip-filter-btn.on{background:var(--sea);border-color:var(--sea);color:#fff}

/* 行程項目 */
.item{background:var(--card);border-radius:13px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;transition:.2s}
.item.checked{opacity:.62}
.item-main{display:flex;align-items:flex-start;gap:11px;padding:12px 13px}
.chk{
  flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  background:#fff;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;
  transition:.15s;font-size:14px;color:#fff;
}
.chk.on{background:var(--green);border-color:var(--green)}
.chk:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.time{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--coral);background:var(--coral-bg);border-radius:6px;padding:3px 7px;margin-top:1px;min-width:50px;text-align:center;line-height:1.3}
.time.blank{background:var(--line-soft);color:var(--ink-faint)}
.body{flex:1;min-width:0}
.act{font-size:15.5px;font-weight:700;line-height:1.35;word-break:break-word}
.item.checked .act{text-decoration:line-through}
.place-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
.place{font-size:14px;font-weight:600;color:var(--sea);word-break:break-word}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;margin-top:5px}
.tag.food{background:#fdeee3;color:#c0562e}
.tag.shop{background:#e9f2ec;color:var(--green)}
.tag.move{background:#e7f0f2;color:var(--sea)}
.tag.stay{background:#f4ecd8;color:#9a7620}
.tag.play{background:#efeaf6;color:var(--violet)}
.snippet{font-size:12.5px;color:var(--ink-faint);margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}

/* 導航按鈕列 */
.nav-btns{display:flex;gap:6px;padding:0 13px 11px 48px;flex-wrap:wrap}
.nav-btn{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;
  cursor:pointer;font-family:inherit;color:var(--ink-soft);text-decoration:none;transition:.15s;
}
.nav-btn:active{transform:scale(.96)}
.nav-btn.g{color:var(--sea);border-color:#bfe0e2;background:#eef8f8}
.nav-btn.t{color:var(--violet);border-color:#ddd2ee;background:#f4f0fa}
.nav-btn.u{color:#111;border-color:#ccc;background:#f4f4f4}

/* 展開詳情 */
.more-btn{
  display:inline-flex;align-items:center;gap:5px;margin:0 13px 11px 48px;
  font-size:12px;font-weight:600;color:var(--ink-faint);cursor:pointer;
  background:var(--line-soft);border:none;border-radius:8px;padding:6px 11px;font-family:inherit;
}
.more-btn .arw{transition:transform .25s;font-size:9px}
.more-btn.open .arw{transform:rotate(180deg)}
.detail{display:none;margin:0 13px 12px 48px;padding:11px 13px;background:#faf8f2;border-radius:10px;border:1px solid var(--line)}
.detail.open{display:block;animation:fade .25s ease}
.detail .sec{font-size:12.5px;line-height:1.7;white-space:pre-line;color:#3f4a50}
.detail .sec + .sec{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.detail .sec-lbl{font-size:11px;font-weight:700;color:var(--coral);margin-bottom:3px;letter-spacing:.05em}
.detail .sec.move .sec-lbl{color:var(--sea)}
.detail a{word-break:break-all}
.detail .hl{background:#fdf0d5;padding:0 3px;border-radius:3px;color:#8a6416;font-weight:600}

/* 分段標籤 */
.seg{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.12em;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.seg::before,.seg::after{content:"";height:1px;background:var(--line);flex:1}

/* ===== 分帳 ===== */
.split-intro{font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6}
.card{background:var(--card);border-radius:13px;padding:15px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:13px}
.card h3{font-size:14.5px;color:var(--sea-deep);margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.people-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.pchip{background:var(--sea);color:#fff;border-radius:16px;padding:5px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pchip .x{cursor:pointer;opacity:.7;font-weight:700}
.inline-add{display:flex;gap:7px;margin-top:8px}
.inline-add input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;font-family:inherit;background:#fff}
.inline-add input:focus{outline:none;border-color:var(--sea)}
.btn{background:var(--sea);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--sea);border:1px solid var(--sea)}
.btn.coral{background:var(--coral)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%;margin-top:4px}

.exp-item{padding:11px 0;border-top:1px dashed var(--line)}
.exp-item:first-child{border-top:none}
.exp-item .er1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exp-item .edesc{font-weight:600;font-size:14px}
.exp-item .eamt{font-weight:700;color:var(--coral);white-space:nowrap;font-size:14px}
.exp-item .er2{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.exp-item .edel{min-height:44px;border:0;background:transparent;color:var(--ink-faint);cursor:pointer;margin-top:3px;padding:8px 0;font:inherit;font-size:12px;font-weight:700}

.result-card{background:linear-gradient(140deg,var(--sea-deep),var(--sea));color:#fff}
.result-card h3{color:#fff}
.bal-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.15)}
.bal-row:first-of-type{border-top:none}
.bal-row .who{font-weight:600}
.bal-row .num{font-weight:700}
.bal-row .num.pos{color:#8ff0a8}
.bal-row .num.neg{color:#ffb59e}
.settle{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.settle .s-line{font-size:13.5px;padding:6px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.settle .s-line b{color:#ffd98a}

.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:16px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--sea)}
.payer-grid{display:flex;flex-wrap:wrap;gap:6px}
.payer-opt{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;background:#fff;font-weight:600;color:var(--ink-soft)}
.payer-opt.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.split-with{display:flex;flex-wrap:wrap;gap:6px}
.sw-opt{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;background:#fff;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.sw-opt.on{background:#e9f2ec;color:var(--green);border-color:var(--green)}

.empty-state{text-align:center;padding:30px 20px;color:var(--ink-faint);font-size:13.5px;line-height:1.7}
.shop-empty-actions{margin-top:14px}
.shop-top{display:flex;align-items:stretch;gap:8px;margin-bottom:12px}
.shop-top .shop-search{flex:1 1 auto;min-width:0;margin-bottom:0}
.shop-list-entry{flex:0 0 auto;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--sea-deep);font:inherit;font-size:13px;font-weight:900;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.shop-list-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:12px;font-weight:900}
.shop-list-count[hidden]{display:none}
.shop-search-summary{padding:2px 2px 10px;font-size:12.5px;font-weight:800;color:var(--ink-faint)}
.shop-wants-actions{display:flex;justify-content:flex-end;padding:0 12px 4px}
.shop-wants-actions .btn{min-height:40px;font-size:13px}
.render-retry{display:block;min-height:44px;margin:14px auto 0}

/* ===== 底部導覽 ===== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--t-tabbar);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  height:calc(var(--tabbar-height) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-btn{
  flex:1;height:var(--tabbar-height);background:none;border:none;cursor:pointer;padding:8px 0 7px;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-faint);font-size:12px;font-weight:600;
}
.tabbar-btn .ic{font-size:24px;line-height:1}
.tabbar-btn{position:relative}
.tabbar-btn.active{color:var(--sea-deep);font-weight:800}
.tabbar-btn.active::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:currentColor}
.app-icon{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.settings-btn .app-icon{width:19px;height:19px}
.settings-btn .settings-sliders{width:22px;height:22px;stroke-width:1.75}
.tabbar-icon-wrap{position:relative;display:inline-flex}

.totop{
  position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));width:42px;height:42px;
  border-radius:50%;background:var(--sea-deep);color:#fff;border:none;font-size:19px;cursor:pointer;
  z-index:65;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;
  display:flex;align-items:center;justify-content:center;
}
.totop.show{opacity:.9;pointer-events:auto}

.toast{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--sea-deep);color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;
  /* toast 依定義是最上層的短暫回饋層,必須高於每一個 overlay(目前最高 160)。
     原本的 90 低於所有 overlay —— 在結算 sheet(135)開著時,「已確認收款 [復原]」
     整個被蓋住,使用者既看不到也點不到那 10 秒。有動作的 toast 才吃點擊。 */
  z-index:200;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow-lg);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast-action{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.toast-action:active{transform:scale(.96)}

.loading{text-align:center;padding:50px 20px;color:var(--ink-faint)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--sea);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.button-spinner{display:inline-block;width:14px;height:14px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== V1 元件 ===== */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drive-chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;margin-top:5px;background:#e7f0f2;color:var(--sea)}
.qa-row{display:flex;gap:7px;padding:0 13px 12px 48px;flex-wrap:wrap}
.qa-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-family:inherit;color:var(--ink-soft);text-decoration:none;transition:.15s;min-height:38px}
.qa-btn:active{transform:scale(.96)}
.qa-btn.drv{color:#fff;border-color:var(--sea);background:var(--sea)}
.qa-btn.pk{color:#1256a0;border-color:#bcd6f0;background:#eaf3fc}
.qa-btn.nf{color:#9a7620;border-color:#e8d9ae;background:#faf3df}
.qa-btn.fr{color:#0e6d8c;border-color:#b8dde9;background:#e8f6fb}
.qa-btn.sp{color:var(--green);border-color:#c4dccd;background:#edf5f0}
.qa-btn.mo{color:var(--ink-faint);border-color:var(--line);background:var(--line-soft)}
.qa-btn.on{outline:2px solid currentColor;outline-offset:-2px}
.panel{display:none;margin:0 13px 12px 48px;padding:12px 13px;background:#faf8f2;border-radius:11px;border:1px solid var(--line)}
.panel.open{display:block;animation:fade .25s ease}
.mapcode-box{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0e3a44;color:#fff;border-radius:10px;padding:11px 13px;margin-bottom:9px}
.mapcode-open{cursor:pointer}
.mapcode-open:active{transform:scale(.99)}
.mc-lbl{font-size:10px;opacity:.7;letter-spacing:.05em}
.mc-val{font-size:18px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.mapcode-fullscreen{position:fixed;inset:0;z-index:120;background:rgba(6,32,38,.96);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.mapcode-fullscreen .mapcode-dialog{width:100%;max-width:360px}
.mapcode-fullscreen .mapcode-label{font-size:13px;font-weight:900;letter-spacing:.16em;opacity:.7;margin-bottom:14px}
.mapcode-fullscreen .mapcode-value{font-size:clamp(38px,13vw,64px);font-weight:950;line-height:1.08;letter-spacing:.04em;font-variant-numeric:tabular-nums;word-break:break-word}
.mapcode-fullscreen .mapcode-hint{margin-top:18px;font-size:13px;font-weight:700;opacity:.62}
.copy-btn{background:var(--coral);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.copy-btn:active{transform:scale(.96)}
.pc-row{display:flex;gap:10px;font-size:13px;line-height:1.6;padding:5px 0;border-top:1px dashed var(--line)}
.pc-row:first-child,.mapcode-box+.pc-row{border-top:none}
.pc-k{flex:0 0 auto;color:var(--ink-faint);font-weight:600;min-width:56px}
.pc-v{flex:1;color:#3f4a50;word-break:break-word}
.pc-tip{margin-top:9px;font-size:12.5px;line-height:1.65;color:#8a6416;background:#fdf6e0;border-radius:8px;padding:8px 11px}
.note-rich{display:block}
.note-p{margin:0 0 5px;line-height:1.65;word-break:break-word}
.note-p:last-child{margin-bottom:0}
.note-list{list-style:none;margin:5px 0 6px;padding:0;display:grid;gap:4px}
.note-li,.note-alert{display:flex;align-items:flex-start;gap:6px;line-height:1.65;word-break:break-word}
.note-marker{flex:0 0 auto;color:var(--coral);font-weight:800}
.note-alert{margin:5px 0;color:#7b4e00;background:rgba(255,255,255,.45);border-radius:7px;padding:4px 7px}
.parking-list{margin:0;padding-left:18px}
.parking-list li+li{margin-top:4px}
/* 下一站 */
.nx-hero{background:var(--card);border:2px solid var(--coral);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-lg)}
.nx-hero.all-done{border-color:var(--green)}
.nx-lbl{font-size:11px;font-weight:800;color:var(--coral);letter-spacing:.12em;margin-bottom:5px}
.nx-time{display:inline-block;font-size:13px;font-weight:800;color:var(--coral);background:var(--coral-bg);border-radius:7px;padding:3px 9px;margin-bottom:6px}
.nx-act{font-size:20px;font-weight:800;line-height:1.35;color:var(--ink)}
.nx-place{font-size:13.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.nx-navbtn{display:block;text-align:center;background:var(--sea);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800;text-decoration:none;margin-top:12px}
.nx-navbtn:active{transform:scale(.98)}
.nx-done{display:block;width:100%;background:#fff;color:var(--green);border:1.5px solid var(--green);border-radius:12px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.nx-ticket{position:relative;margin:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(14,58,68,.08)}
.nx-ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--coral),var(--gold))}
.nx-ticket-main{padding:16px 16px 12px 20px}
.nx-ticket-main.openable{cursor:pointer}
.nx-ticket-kicker{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);font-weight:800;text-transform:uppercase;margin-bottom:8px}
.nx-ticket-time{display:inline-block;font-size:13px;font-weight:800;color:var(--coral);background:var(--coral-bg);border-radius:7px;padding:3px 9px;margin-bottom:8px}
.nx-ticket-title{font-size:24px;line-height:1.18;font-weight:900;color:var(--ink);margin-bottom:6px;word-break:break-word}
.nx-ticket-act{font-size:14px;color:var(--ink-soft);font-weight:700;margin-bottom:10px}
.nx-ticket-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.nx-ticket-tag{font-size:12px;border-radius:999px;padding:4px 8px;background:#f3efe6;color:var(--ink-soft);font-weight:700}
.nx-ticket-tags .now-badge{margin-left:0;vertical-align:0;align-self:center}
.nx-ticket-lines{display:grid;gap:6px;margin-top:8px}
.nx-ticket-line{font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.nx-ticket-line b{color:var(--ink);font-weight:800}
.nx-ticket-note .note-rich{margin-top:4px}
.nx-ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nx-ticket-actions .qa-btn{margin:0}
.nx-primary-actions{padding:0 16px 10px 20px}
.nx-ticket.has-next-buy .nx-ticket-kicker,.nx-ticket.has-next-buy .nx-ticket-time,.nx-ticket.has-next-buy .nx-ticket-title{max-width:calc(100% - 54px);box-sizing:border-box}
.nx-buy-badge{position:absolute;z-index:2;top:8px;right:8px;display:grid;place-items:center;min-width:44px;height:44px;padding:0 4px;border:0;border-radius:10px;background:transparent;color:var(--gold-ink);font:inherit;cursor:pointer;touch-action:manipulation}
.nx-buy-badge-visual{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:2px 8px;border:1px solid var(--gold);border-radius:999px;background:var(--warning-bg);font-size:13px;font-weight:900;line-height:1;white-space:nowrap;box-sizing:border-box}
.nx-buy-badge:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
/* 移出 .nx-ticket-main 之後要自己補回對齊用的內距(原本是繼承卡片本體的 padding) */
.nx-more{margin:0 16px 10px 20px}
.nx-more-summary{min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:800;color:var(--sea-deep);cursor:pointer;list-style:none}
.nx-more-summary::-webkit-details-marker{display:none}
.nx-more-summary::after{content:"▾";margin-left:5px;font-size:11px}
.nx-more[open] .nx-more-summary::after{content:"▴"}
.nx-more-summary:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.nx-drive-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;background:var(--sea);color:#fff;border-radius:12px;font-size:16px;font-weight:900;text-decoration:none}
.nx-drive-btn:active{transform:scale(.98)}
.nx-secondary-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px 20px}
.nx-secondary-actions:empty{display:none}
.nx-secondary-actions .qa-btn{margin:0}
.nx-ticket-low{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px dashed var(--line);padding:12px 16px 14px 20px;background:#fffaf0}
.nx-decision-btn{min-height:46px;border-radius:12px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;padding:0 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nx-decision-btn.done{background:var(--green);color:#fff;border:1.5px solid var(--green)}
.nx-decision-btn.skip{min-width:88px;max-width:120px;background:#f7f3ea;color:var(--ink-faint);border:1px solid var(--line)}
.nx-decision-btn:active{transform:scale(.97)}
.nx-remain{margin:0 12px 12px;color:var(--ink-faint);font-size:13px;text-align:center}
.nx-cluster-summary{font-size:14px;line-height:1.55;color:var(--sea-deep);font-weight:800;margin:4px 0 8px}
.nx-cluster-expand{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--sea-deep);font:inherit;font-size:13px;font-weight:800;padding:10px;margin-top:10px;cursor:pointer}
.nx-cluster-expand.on{background:#f1f8f8;border-color:var(--sea)}
.nx-cluster-list{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--line)}
.nx-cluster-stop{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s,transform .15s}
.nx-cluster-stop:active{background:#f7f3ea;transform:scale(.99)}
.nx-cluster-stop.auto{opacity:.58}
.nx-cluster-time{color:var(--coral);font-size:12px;font-weight:900;padding-top:2px}
.nx-cluster-name{font-size:14px;font-weight:900;color:var(--ink);line-height:1.4}
.nx-cluster-meta{font-size:12px;color:var(--ink-faint);font-weight:700;margin-top:3px}
.nx-cluster-status{display:inline-block;background:var(--line-soft);color:var(--ink-faint);border-radius:5px;padding:3px 6px;font-size:11px;font-weight:800;margin-top:6px}
.nx-cluster-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.nx-cluster-actions .qa-btn{margin:0}
.nx-empty-ticket{margin:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px;text-align:center;color:var(--ink-soft)}
.today-pretrip-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.today-pretrip-title-row .date{min-width:0}.pretrip-count{flex:0 0 auto;font-size:14px;font-weight:900;color:var(--gold-ink);background:#fff7dc;border:1px solid #ead88e;border-radius:999px;display:inline-flex;padding:5px 10px;margin-top:0;white-space:nowrap;position:relative}
.tomorrow-card{margin:12px;background:linear-gradient(135deg,#fffaf0,#eef8f9);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.tomorrow-lbl{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--sea);margin-bottom:7px}
.tomorrow-title{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:9px}
.tomorrow-list{display:grid;gap:7px;margin-top:10px}
.tomorrow-item{font-size:13.5px;line-height:1.45;color:var(--ink-soft);background:rgba(255,255,255,.62);border-radius:9px;padding:8px 10px}
.tomorrow-item b{color:var(--ink);font-weight:900}
.item.now-item{border-color:rgba(232,111,79,.42);box-shadow:0 0 0 2px rgba(232,111,79,.12),var(--shadow)}
.now-badge{display:inline-flex;align-items:center;margin-left:6px;background:var(--coral);color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;vertical-align:2px}
.auto-skip-badge{display:inline-flex;align-items:center;margin-left:6px;background:var(--ink-faint);color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;vertical-align:2px}
.tomorrow-card.compact{margin:0 12px 12px;padding:12px 14px}
.tomorrow-card.compact .tomorrow-title{font-size:15px;margin-bottom:6px}
.tomorrow-card.compact .tomorrow-list{gap:5px}
.tomorrow-card.compact .tomorrow-item{font-size:12.5px;padding:6px 9px}
.mini-card{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:8px;cursor:pointer}
.mini-card .mt{font-size:12px;font-weight:700;color:var(--coral);min-width:44px;padding-top:2px}
.mini-card .mc{flex:1;font-size:14px;font-weight:600;line-height:1.4}
.mini-card .mc small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-faint);margin-top:1px}
.today-jump.dark{background:var(--sea-deep);color:#fff;width:100%;text-align:center;margin-top:6px}
/* 渡輪 */
.ferry-head{font-size:13px;font-weight:800;color:var(--sea-deep);margin-bottom:6px}
.ferry-last{font-size:12px;font-weight:700;color:#a03b1c;background:#fdeee7;border-radius:8px;padding:7px 10px;margin-bottom:8px}
.ferry-co{font-size:13.5px;font-weight:800;color:var(--ink);margin:10px 0 4px}
.ferry-dir{font-size:11.5px;font-weight:700;color:var(--ink-faint);margin:6px 0 4px;display:flex;justify-content:space-between}
.ferry-hint{font-weight:400;color:var(--coral)}
.ft-wrap{display:flex;flex-wrap:wrap;gap:4px}
.ft-wrap.collapsed .ft-chip:not(.hl){display:none}
.ft-chip{font-size:11.5px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ft-chip.hl{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:800}
.ft-chip i{font-style:normal;opacity:.7}
.ft-more{display:block;width:100%;margin-top:7px;background:none;border:1px dashed var(--line);border-radius:8px;padding:7px;font-size:12px;font-weight:600;color:var(--ink-faint);cursor:pointer;font-family:inherit}
/* 購物 */
.shop-mall{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px;scroll-margin-top:150px}
.sm-name{font-size:17px;font-weight:800;color:var(--sea-deep)}
.sm-hours{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.sm-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.shop-filter{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;scrollbar-width:none}

<script>
/* ---- APP_VERSION SAFE ACCESS (C2) ----
   app-version.js 是獨立外部 script,離線快取未命中或部署缺檔時**會**載不到,
   此時 APP_VERSION 這個 var 根本不存在,任何裸讀都會拋 ReferenceError
   (2026-07-30 實證:「資料與版本」頁因此整頁打不開)。
   全檔禁止直接讀 APP_VERSION,一律走這兩個 helper;
   tools/check-app-version.js 會掃出違規的裸讀並讓 CI 失敗。
     appVersion()      → 版本字串,取不到時回空字串(給資料欄位用)
     appVersionLabel() → 版本字串,取不到時回「未知」(給 UI 顯示用) */
function appVersion(){
  return typeof APP_VERSION==='string'&&APP_VERSION?APP_VERSION:'';
}
function appVersionLabel(){
  return appVersion()||'未知';
}
/* ---- /APP_VERSION SAFE ACCESS ---- */
var THEME_STORAGE_KEY='trip_theme';
var THEME_IDS=['ocean','ivory','wisteria','cedar','mist','tea'];
var THEME_REGISTRY={
  ocean:{id:'ocean',name:'海洋／岡山',chrome:'#0e3a44'},
  ivory:{id:'ivory',name:'象牙／靛藍',chrome:'#16243d'},
  wisteria:{id:'wisteria',name:'藤紫／夜櫻',chrome:'#3b2d4d'},
  cedar:{id:'cedar',name:'杉綠／宮島',chrome:'#23402f'},
  mist:{id:'mist',name:'霧藍／瀨戶',chrome:'#3f4c5e'},
  tea:{id:'tea',name:'焙茶／倉敷',chrome:'#4e3d32'}
};
var themeDiagnosticQueue=[];
var themeUnknownLogged={};
function normalizeThemeId(value){
  var id=String(value||'');
  return THEME_IDS.indexOf(id)>=0?id:'ocean';
}
function reportUnknownTheme(value){
  var id=String(value||'');
  if(!id||THEME_IDS.indexOf(id)>=0||themeUnknownLogged[id])return;
  themeUnknownLogged[id]=true;
  var message='未知主題「'+id+'」，已改用海洋／岡山';
  if(typeof AppLog!=='undefined'&&AppLog&&typeof AppLog.repo==='function')AppLog.repo(message);
  else themeDiagnosticQueue.push(message);
}
function currentThemeId(){
  var rootId=document&&document.documentElement&&document.documentElement.dataset?document.documentElement.dataset.theme:'';
  if(THEME_IDS.indexOf(rootId)>=0)return rootId;
  try{return normalizeThemeId(localStorage.getItem(THEME_STORAGE_KEY));}
  catch(error){return 'ocean';}
}
function applyTheme(themeId,options){
  var requested=String(themeId||''),id=normalizeThemeId(requested),config=THEME_REGISTRY[id];
  reportUnknownTheme(requested);
  var persist=!options||options.persist!==false;
  if(persist)localStorage.setItem(THEME_STORAGE_KEY,id);
  document.documentElement.dataset.theme=id;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',config.chrome);
  return config;
}
function selectTheme(themeId){
  var previous=currentThemeId();
  try{
    var selected=applyTheme(themeId);
    if(typeof openSettings==='function')openSettings('theme');
    return {ok:true,id:selected.id};
  }catch(error){
    applyTheme(previous,{persist:false});
    if(typeof toast==='function')toast('主題無法儲存，已保留原設定');
    return {ok:false};
  }
}
(function(){
  var stored='';
  try{stored=localStorage.getItem(THEME_STORAGE_KEY)||'ocean';}
  catch(error){stored='ocean';}
  applyTheme(stored,{persist:false});
})();
</script>

                   'transit':'transit','train':'transit','電車':'transit','大眾運輸':'transit' },
          desc:'Driving→drive(🚗導航+停車卡);Transit/Train→transit(🚃路線)' },

/* ── 由 Schema 自動產生對照文件(Markdown) ── */
function schemaDoc(){
  var md = '# CMS ↔ App 欄位對照(由 schema.js 自動產生)\n\n版本:' + SCHEMA.version + '\n';
  Object.keys(SCHEMA.sheets).forEach(function(k){
    var s = SCHEMA.sheets[k];
    md += '\n## ' + s.label + '(gid=' + s.gid + ',kind=' + s.kind + ')\n';
    if(s.columns){
      md += '| Google Sheet 欄位 | App Property | 必填 | 說明 |\n|---|---|---|---|\n';
      s.columns.forEach(function(c){
        var h = c.header + (c.aliases ? '(別名:' + c.aliases.join('/') + ')' : '');
        md += '| ' + h + ' | ' + c.field + ' | ' + (c.required?'✅':'') + ' | ' + (c.desc||'') + ' |\n';
      });
    }
    if(s.keys){
      md += '| Key | App Property | 說明 |\n|---|---|---|\n';
      s.keys.forEach(function(c){
        var h = c.header + (c.aliases ? '(別名:' + c.aliases.join('/') + ')' : '');
        md += '| ' + h + ' | ' + c.field + ' | ' + (c.desc||'') + ' |\n';
      });
    }
    if(s.layout){
      md += '自由格式:成員列標記「' + s.layout.membersRowMark + '」;欄位位置 → 類別[' + s.layout.catCol + '] 明細[' + s.layout.nameCol + '] 台幣[' + s.layout.twdCol + '] 日幣[' + s.layout.jpyCol + '] 備註[' + s.layout.noteCol + ']';
      if(s.layout.totalMarks) md += ';合計列標記「' + s.layout.totalMarks.join('/') + '」';
      md += '\n';
    }
    if(s.desc) md += '> ' + s.desc + '\n';
  });
  return md;
}
if(typeof window !== 'undefined') window.schemaDoc = schemaDoc;

<script>
/* ===== validator.js(部署為獨立檔)===== */
/* ============================================================
   validator.js — 自體防錯防線(Guardrails)
   ============================================================
   職責:
   1. AppLog:六類錯誤日誌,格式固定「[分類] 訊息」,
      AI Debug 時看一眼 console 即可定位,不需貼整段程式碼
   2. 表頭驗證(buildHeaderMap):缺必填欄/未知欄位 → 警告不崩潰
   3. healthCheck():資料一致性健康報告(重複ID/懸空引用/型別覆蓋)
   依賴:schema.js(SCHEMA 必須先載入)
   ============================================================ */

/* ---- 六類錯誤日誌 ---- */
var APP_LOG_LIMIT=100;
var APP_LOG_MESSAGE_LIMIT=1000;
var AppLog=(function(){
  var entries=[];
  function safeText(value){
    try{return String(value===undefined?'':value);}
    catch(error){return '[無法讀取診斷訊息]';}
  }
  function timestamp(){
    try{return typeof appNow==='function'?appNow().toISOString():'';}
    catch(error){return '';}
  }
  function write(category,level,prefix,message){
    var text=safeText(message);
    console[level](prefix+text);
    entries.push({at:timestamp(),category:category,level:level,message:text.slice(0,APP_LOG_MESSAGE_LIMIT)});
    if(entries.length>APP_LOG_LIMIT)entries.splice(0,entries.length-APP_LOG_LIMIT);
  }
  function snapshot(){
    return entries.map(function(entry){
      return {at:entry.at,category:entry.category,level:entry.level,message:entry.message};
    });
  }
  return {
    schema:function(message){write('schema','warn','[Schema Error] ',message);},
    parser:function(message){write('parser','warn','[Parser Error] ',message);},
    data:function(message){write('data','warn','[Data Error] ',message);},
    repo:function(message){write('repository','warn','[Repository Error] ',message);},
    render:function(message){write('render','error','[Render Error] ',message);},
    sync:function(message){write('sync','warn','[Sync Error] ',message);},
    snapshot:snapshot,
    clear:function(){entries.length=0;}
  };
})();

/* ---- 表頭正規化 ---- */
function normH(h){ return String(h||'').trim().toLowerCase().replace(/\s+/g,''); }
function normHBase(h){ return normH(h).replace(/[（(].*?[)）]/g,''); }

/* ---- 表頭驗證與對照(Schema 驅動) ---- */
function buildHeaderMap(rows, def){
  var result = { map:{}, headerIdx:-1, blockers:[], warnings:[] };
  var best = { idx:-1, hits:0 };
  for(var i=0;i<Math.min(rows.length,10);i++){
    var hits = 0;
    (rows[i]||[]).forEach(function(cell){
      var h = normHBase(cell);
      if(!h) return;
      def.columns.forEach(function(c){
        var cand = [c.header].concat(c.aliases||[]).map(normHBase);
        if(cand.indexOf(h)>=0) hits++;
      });
    });
    if(hits > best.hits){ best = { idx:i, hits:hits }; }
  }
  if(best.idx < 0 || best.hits === 0){
    var missingHeaderMessage = def.label + ':找不到表頭列 — 請確認工作表第一列為欄位名稱';
    AppLog.schema(missingHeaderMessage);
    result.blockers.push(makeValidationFinding('blocker','HEADER_MISSING',def.label,missingHeaderMessage));
    return result;
  }
  result.headerIdx = best.idx;
  rows[best.idx].forEach(function(cell, idx){
    var h = normHBase(cell);
    if(!h) return;
    var matched = null;
    def.columns.forEach(function(c){
      if(matched) return;
      var cand = [c.header].concat(c.aliases||[]).map(normHBase);
      if(cand.indexOf(h)>=0) matched = c.field;
    });
    if(matched){ if(!(matched in result.map)) result.map[matched] = idx; }
    else{
      var unknownMessage = def.label + ':未知欄位「' + cell + '」(第' + (idx+1) + '欄) — 已忽略;若為新欄位請更新 schema.js';
      AppLog.schema(unknownMessage);
      result.warnings.push(makeValidationFinding('warning','HEADER_UNKNOWN',def.label,unknownMessage));
    }
  });
  def.columns.forEach(function(c){
    if(c.required && !(c.field in result.map)){
      var requiredMessage = def.label + ":Missing required field '" + c.header + "'(" + c.field + ") — 相關卡片可能無法顯示";
      AppLog.schema(requiredMessage);
      result.blockers.push(makeValidationFinding('blocker','HEADER_REQUIRED',def.label,requiredMessage));
    }
  });
  return result;
}

function makeValidationFinding(level,code,sheet,message){
  return { level:level, code:code, sheet:sheet||'', message:String(message||'') };
}

function sameDisplayName(a,b){
  var left=String(a||'').toLowerCase().replace(/\s+/g,'');
  var right=String(b||'').toLowerCase().replace(/\s+/g,'');
  return !!(left&&right&&(left.indexOf(right)>=0||right.indexOf(left)>=0));
}

function validateSnapshotData(db,raw,schema){
  var result={blockers:[],warnings:[]}, sheets=(schema&&schema.sheets)||{};
  function block(code,sheet,message){ result.blockers.push(makeValidationFinding('blocker',code,sheet,message)); }
  function warn(code,sheet,message){ result.warnings.push(makeValidationFinding('warning',code,sheet,message)); }
  function ids(list,field,sheet){
    var seen={};
    (list||[]).forEach(function(row){
      var id=String(row&&row[field]||'').toUpperCase().trim();
      if(!id) return;
      if(seen[id]) block('DUPLICATE_ID',sheet,'重複ID:' + sheet + ' ' + id);
      seen[id]=true;
    });
    return seen;
  }
  Object.keys(sheets).forEach(function(key){
    if(!raw||!raw[key]||String(raw[key]).trim().length<5){
      block('SHEET_MISSING',key,'資料缺席:工作表 ' + sheets[key].label + ' 無任何資料來源(內建/快取/線上皆空)');
    }
  });
  db=db&&typeof db==='object'&&!Array.isArray(db)?db:{};
  function validObjects(list,sheet,label){
    var valid=[];
    list.forEach(function(row,index){
      if(!row||typeof row!=='object'||Array.isArray(row)){
        block('DB_STRUCTURE',sheet,label + ' 第 ' + (index+1) + ' 筆必須是物件');
      }else{
        valid.push(row);
      }
    });
    return valid;
  }
  function validList(field,sheet){
    if(!Array.isArray(db[field])){
      block('DB_STRUCTURE',sheet,field + ' 必須是陣列');
      return [];
    }
    return validObjects(db[field],sheet,field);
  }
  var placeList=validList('placeList','places');
  var restList=validList('rest','rest');
  var shopList=validList('shop','shop');
  var hotelList=validList('hotels','hotels');
  function boundedValue(value,maxLength){ return String(value||'').slice(0,maxLength); }
  function requiredValues(list,key){
    var def=sheets[key]||{}, columns=def.columns||[], idField=def.idField;
    (list||[]).forEach(function(row,index){
      var identity=String(idField&&row[idField]||'').trim()||('row ' + (index+1));
      columns.forEach(function(column){
        if(column.required&&!String(row[column.field]||'').trim()){
          var message=boundedValue(def.label||key,30) + ' ' + boundedValue(identity,30) + ": missing required '" + boundedValue(column.header||column.field,30) + "' (" + boundedValue(column.field,24) + ')';
          block('REQUIRED_VALUE',key,message);
        }
      });
    });
  }
  requiredValues(placeList,'places');
  requiredValues(restList,'rest');
  requiredValues(shopList,'shop');
  requiredValues(hotelList,'hotels');
  var tripDays=[];
  if(!db.trip||typeof db.trip!=='object'||Array.isArray(db.trip)){
    block('DB_STRUCTURE','itin','trip 必須是物件');
  }else if(!Array.isArray(db.trip.days)||!db.trip.days.length){
    block('DB_STRUCTURE','itin','trip.days 必須是非空陣列');
  }else{
    tripDays=validObjects(db.trip.days,'itin','trip.days');
  }
  var cfg=null;
  if(!db.cfg||typeof db.cfg!=='object'||Array.isArray(db.cfg)){
    block('DB_STRUCTURE','cfg','cfg 必須是物件');
  }else{
    cfg=db.cfg;
  }
  var pids=ids(placeList,'placeId','places');
  var rids=ids(restList,'restId','rest');
  ids(shopList,'shopId','shop');
  var hids=ids(hotelList,'hotelId','hotels');
  var typeColumn=null;
  ((sheets.places&&sheets.places.columns)||[]).forEach(function(column){ if(column.field==='type') typeColumn=column; });
  var typeValues=typeColumn&&typeColumn.values||{};
  placeList.forEach(function(place){
    var rawType=String(place.type||'').trim();
    if(rawType&&!typeValues[rawType]&&!typeValues[rawType.toLowerCase()]){
      block('UNKNOWN_PLACE_TYPE','places','未註冊型別:' + place.placeId + ' 型別「' + rawType + '」無對應卡片渲染');
    }
    var hotelId=String(place.hotelId||'').toUpperCase().trim();
    var normalizedType=typeValues[rawType]||typeValues[rawType.toLowerCase()]||String(place.tnorm||'').toLowerCase();
    if(normalizedType==='hotel'&&!hotelId){
      block('HOTEL_REF_REQUIRED','places','住宿停靠點 ' + place.placeId + ' 缺少 HID');
    }else if(normalizedType!=='hotel'&&hotelId){
      block('HOTEL_REF_SCOPE','places','非住宿地點 ' + place.placeId + ' 不得引用 Hotels ' + hotelId);
    }
    if(hotelId&&!hids[hotelId]){
      block('BROKEN_REF','places','懸空引用:Places ' + place.placeId + ' → ' + hotelId + ' 不存在於 Hotels');
    }
  });
  restList.forEach(function(rest){
    var pid=String(rest.placeId||'').toUpperCase().trim();
    if(pid&&!pids[pid]) block('BROKEN_REF','rest','懸空引用:Restaurants ' + rest.restId + ' → ' + pid + ' 不存在於 Places');
  });
  shopList.forEach(function(shop){
    var pid=String(shop.placeId||'').toUpperCase().trim();
    if(pid&&!pids[pid]) block('BROKEN_REF','shop','懸空引用:Shopping ' + shop.shopId + ' → ' + pid + ' 不存在於 Places');
  });
  tripDays.forEach(function(day,dayIndex){
    if(!Array.isArray(day.items)){
      block('DB_STRUCTURE','itin','trip.days 的每一天都必須包含 items 陣列');
      return;
    }
    validObjects(day.items,'itin','trip.days[' + dayIndex + '].items').forEach(function(item){
      var ref=String(item.ref||'').toUpperCase().trim(), linked=null;
      if(/^P\d+/.test(ref)&&!pids[ref]) block('BROKEN_REF','itin','懸空引用:行程 ' + day.date + '「' + item.act + '」→ ' + ref + ' 不存在於 Places');
      if(/^R\d+/.test(ref)){
        if(!rids[ref]) block('BROKEN_REF','itin','懸空引用:行程 ' + day.date + '「' + item.act + '」→ ' + ref + ' 不存在於 Restaurants');
        linked=restList.filter(function(rest){return String(rest.restId||'').toUpperCase()===ref;})[0]||null;
        if(linked&&item.place&&linked.name&&!sameDisplayName(item.place,linked.name)){
          block('REF_NAME_MISMATCH','itin','引用名稱不一致:行程 ' + day.date + '「' + item.place + '」→ ' + ref + '「' + linked.name + '」');
        }
      }
    });
  });
  if(cfg){
    ['tripname','startdate','enddate','travelmode'].forEach(function(field){
      if(!String(cfg[field]||'').trim()) block('CFG_REQUIRED','cfg','TripConfig 缺少 ' + field);
    });
    function isoDateValue(value){
      var match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||'').trim());
      if(!match) return null;
      var year=Number(match[1]), month=Number(match[2]), day=Number(match[3]);
      var leap=year%4===0&&(year%100!==0||year%400===0);
      var monthDays=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
      if(year<1||month<1||month>12||day<1||day>monthDays[month-1]) return null;
      return year*10000+month*100+day;
    }
    var startText=String(cfg.startdate||'').trim(), endText=String(cfg.enddate||'').trim();
    var startValue=startText?isoDateValue(startText):null, endValue=endText?isoDateValue(endText):null;
    if(startText&&startValue===null) block('CFG_DATE','cfg','TripConfig startdate 必須是有效的 YYYY-MM-DD 日期');
    if(endText&&endValue===null) block('CFG_DATE','cfg','TripConfig enddate 必須是有效的 YYYY-MM-DD 日期');
    if(startValue!==null&&endValue!==null&&endValue<startValue) block('CFG_DATE','cfg','TripConfig enddate 不得早於 startdate');
    var mode=String(cfg.travelmode||'').trim().toLowerCase();
    if(mode&&mode!=='drive'&&mode!=='transit') block('CFG_TRAVELMODE','cfg','TripConfig travelmode 必須是 drive 或 transit');
    var exchangeRate=Number(cfg.exchangeRate);
    if(!String(cfg.exchangeRate||'').trim()||!isFinite(exchangeRate)||exchangeRate<=0){
      block('CFG_EXCHANGE_RATE','cfg','TripConfig exchangeRate 必須是大於 0 的數字');
    }
    var ledgerCurrency=String(cfg.ledgerDefaultCurrency||'').trim().toUpperCase();
    if(ledgerCurrency!=='JPY'&&ledgerCurrency!=='TWD'){
      block('CFG_LEDGER_CURRENCY','cfg','TripConfig ledgerDefaultCurrency 必須是 JPY 或 TWD');
    }
  }
  return result;
}

/* ---- 專案健康檢查(資料一致性) ----
   回傳 findings 陣列並輸出報告;AI 每次交付前必跑 */
function currentHealthFindings(){
  var validation = validateSnapshotData(DB,RAW,SCHEMA);
  var findings = validation.blockers.concat(validation.warnings);
  return findings.map(function(f){ return f.message; });
}
function healthCheck(){
  var findings = currentHealthFindings();
  /* 輸出報告 */
  if(findings.length){
    console.warn('━━ Project Health Check:發現 ' + findings.length + ' 項 ━━');
    findings.forEach(function(message){ AppLog.data(message); });
  }else{
    console.log('━━ Project Health Check:PASS(資料一致性無異常)━━');
  }
  return findings;
}
if(typeof window !== 'undefined') window.healthCheck = healthCheck;

</script>
<script>
/* ===== app ===== */
/* ============================================================
   日本行程 App V2 — CMS 資料架構
   Google 試算表 7 張工作表 = 內容管理系統
   行程總表 / Places / Restaurants / Shopping / Hotels / Expenses / TripConfig
   三層防線:內建資料 → localStorage 快取 → 背景同步
   ============================================================ */

/* console 防呆(部分 WebView 缺 console.info 等) */
(function(){
  try{
    if(typeof window.console==='undefined') window.console={};
    ['log','info','warn','error','debug'].forEach(function(k){
      if(typeof console[k]!=='function') console[k]=function(){};
    });
  }catch(e){}
})();
if(typeof themeDiagnosticQueue!=='undefined'){
  themeDiagnosticQueue.splice(0).forEach(function(message){AppLog.repo(message);});
}

/* ================= CONFIG(唯一設定點) ================= */
/* 資料來源設定完全由 schema.js(SCHEMA)提供 —— 唯一資料規格 */
var PUB = SCHEMA.pubBase;
var SHEETS = Object.keys(SCHEMA.sheets).map(function(k){
  return { key:k, gid:SCHEMA.sheets[k].gid };
});
var FETCH_TIMEOUT = SCHEMA.fetchTimeoutMs, FETCH_RETRIES = SCHEMA.fetchRetries;

function lsGet(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ AppLog.repo('讀取 '+k+' 失敗:'+(e.message||e)+' — 使用預設值'); return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ AppLog.repo('寫入 '+k+' 失敗:'+(e.message||e)+' — 個人狀態可能未保存'); } }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeHtmlAttr(s){return escapeHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function jsString(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,''); }
function jsHtmlAttrString(s){return jsString(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function timestampDate(value){ return new Date(Number(value)); }
function appNow(){
  var sim=lsGet('trip_time_simulation',null);
  if(sim&&sim.mode==='offset'&&typeof sim.offsetMs==='number') return new Date(Date.now()+sim.offsetMs);
  if(sim&&sim.mode==='custom'&&sim.value){
    var custom=new Date(sim.value);
    if(!isNaN(custom.getTime())) return custom;
  }
  try{
    var q=new URLSearchParams(window.location.search||'');
    var pd=q.get('previewDate');
    if(pd&&/^\d{4}-\d{2}-\d{2}$/.test(pd)){
      var d=new Date(pd+'T09:00:00');
      if(!isNaN(d.getTime())) return d;
    }
  }catch(e){}
  return new Date();
}
function todayMD(){ var d=appNow(); return ('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2); }
var toastTimer, toastAction=null;
function clearToast(){
  var el=document.getElementById('toast');
  if(!el) return;
  el.classList.remove('show','has-action');
  el.textContent='';
  toastAction=null;
}
function runToastAction(){
  if(!toastAction) return;
  var fn=toastAction;
  clearTimeout(toastTimer);
  clearToast();
  fn();
}
function toast(msg,actionText,actionFn,durationMs){
  var el=document.getElementById('toast');
  if(!el)return;
  toastAction=typeof actionFn==='function'?actionFn:null;
  if(toastAction){
    el.innerHTML='<span>'+escapeHtml(msg)+'</span><button class="toast-action" onclick="runToastAction()">'+escapeHtml(actionText||'復原')+'</button>';
    el.classList.add('has-action');
  }else{
    el.textContent=msg;
    el.classList.remove('has-action');
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  var duration=Number(durationMs);
  if(!isFinite(duration)||duration<0)duration=toastAction?3500:2000;
  toastTimer=setTimeout(clearToast,duration);

/* ================= CSV 解析 ================= */
function parseCSV(text){
  var rows=[],row=[],field='',inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i],n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){ field+='"'; i++; }
      else if(c==='"') inQ=false;
      else field+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){}
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ================= 表格 → 物件(依表頭名稱對應,容錯欄位順序) ================= */

   Schema 驅動 Parser + Validator

/* 表格型解析:rows → 物件陣列(欄位名 = Schema field) */
function parseTable(csvText, sheetKey){
  var def = SCHEMA.sheets[sheetKey];
  var rows = parseCSV(csvText||'');
  var hm = buildHeaderMap(rows, def);   // 驗證與警告由 validator.js 處理
  if(hm.headerIdx < 0) return [];
  var out = [];
  for(var r=hm.headerIdx+1; r<rows.length; r++){
    var row = rows[r]; if(!row) continue;
    var o = {}, any = false;
    for(var f in hm.map){
      var v = (row[hm.map[f]]||'').trim();

}

/* Key/Value 型解析(TripConfig):依 Schema keys 正規化 */
function parseKeyValue(csvText, sheetKey){
  var def = SCHEMA.sheets[sheetKey];
  var rows = parseCSV(csvText||'');

    var matched = null;
    (def.keys||[]).forEach(function(kd){

/* ================= 行程解析(7欄:日期/時間/活動/地點/ID/交通/備註) ================= */
function buildItin(rows){
  var meta={ title:'' }, days=[], cur=null;
  var dayRe=/第.+天\s*(\d{1,2})\/(\d{1,2})\s*[\(（]?([日一二三四五六])?/;
  rows.forEach(function(r,idx){
    var c=[]; for(var i=0;i<7;i++) c.push((r[i]||'').trim());
    if(idx===0&&c[0]&&!meta.title){ meta.title=c[0]; return; }
    if(c[0]==='飯店') return;
    if(c[0]==='日期'&&c[1]==='時間') return;
    var dtext=c[0]||c[1];
    var m=dtext.match(dayRe);
    if(/第.+天/.test(dtext)&&m){
      cur={ date:m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0'), dow:m[3]||'', items:[] };
      days.push(cur);
      if(!c[2]&&!c[3]) return;
    }
    if(!cur) return;
    var it={ time:c[1], act:c[2], place:c[3], ref:c[4], move:c[5], note:c[6] };
    if(!it.act&&!it.place&&!it.move&&!it.note) return;
    cur.items.push(it);
  });
  days.forEach(function(d){ d.items.forEach(function(it,i){ it.id=d.date+'_'+i; }); });
  return { meta:meta, days:days };
}

function fetchWithTimeout(url,ms){

  var attempt=new Promise(function(resolve,reject){

    if(!p){ try{ p=fetch(bust); }catch(e2){ reject(e2); return; } }

  });
  return Promise.race([attempt,timeout]);

    var stageLabels={download:'下載失敗',structure:'資料結構檢查失敗',validation:'資料驗證失敗',storage:'本機儲存失敗',boot:'啟動資料驗證失敗'};
    var detail=stageLabels[failureRecord.stage]||'同步作業失敗';
    failedSheet=bounded(syncSheetDisplayName(failureRecord.sheet),40);
    var code=bounded(failureRecord.code,40).replace(/[^0-9A-Za-z_-]/g,'');
    var reason=bounded(failureRecord.reason,160);
    failure=detail+(code?' ['+code+']':'')+(reason?'：'+reason:'');
    failedSources.push({key:bounded(failureRecord.sheet,40),label:failedSheet,reason:failure,sourceTime:''});
  }else if(partialKeys.length){
    failedSources=partialKeys.map(function(key){var meta=sheetMeta[key]||{};return {key:key,label:syncSheetDisplayName(key),reason:key==='ledger'?'分帳紀錄下載失敗，已沿用目前快照；其他工作表已更新':bounded(meta.reason||'本次未更新',160),sourceTime:formatSyncRelativeTime(meta.sourceCreatedAt,now,false)};});
    failedSheet=failedSources.map(function(item){return item.label;}).join('、');
    failure=failedSources.map(function(item){return item.reason;}).join('；');
  }
  var updatedAt=snapshot&&snapshot.createdAt||null,lastCompleteAt=snapshotLastCompleteAt(snapshot,snapshotState);
  return {
    state:state,
    label:label,
    relative:formatSyncRelativeTime(updatedAt,now,false),
    dataUpdated:formatSyncAbsoluteTime(updatedAt)||'尚無資料更新紀錄',
    lastComplete:formatSyncAbsoluteTime(lastCompleteAt)||'尚無完整同步紀錄',
    schemaVersion:SCHEMA.version,
    generationId:snapshot&&snapshot.generationId||'內建資料',
    failure:failure,
    failedSheet:failedSheet,
    failedSources:failedSources
  };
}
function syncHeaderModel(state,snapshot,now){
  var labels={syncing:'同步中',online:'已同步',partial:'部分同步',failed:'更新失敗',offline:'離線版',cache:'離線版','legacy-migrated':'離線版',builtin:'內建版'};
  var label=labels[state]||'更新失敗',relative=formatSyncRelativeTime(snapshot&&snapshot.createdAt,now,true),fullRelative=formatSyncRelativeTime(snapshot&&snapshot.createdAt,now,false);

function setButtonBusy(button,busy,label){
  if(!button)return;
  if(busy){
    if(button.getAttribute('aria-busy')==='true')return;
    button.setAttribute('data-busy-label',button.textContent);button.setAttribute('aria-busy','true');button.disabled=true;
    button.innerHTML='<span class="button-spinner" aria-hidden="true"></span>'+escapeHtml(label||'處理中');
  }else{
    var original=button.getAttribute('data-busy-label');if(original!==null)button.textContent=original;
    button.removeAttribute('data-busy-label');button.removeAttribute('aria-busy');button.disabled=false;
  }
}
function retrySyncFromPanel(button){
  setButtonBusy(button,true,'同步中');
  return syncAll(true).then(function(result){
    setButtonBusy(button,false);

    return result;
  },function(error){
    setButtonBusy(button,false);

  });
}
function setSyncState(state){

var DB={ places:{}, placeList:[], rest:[], shop:[], hotels:[], expCMS:[], expMembers:[], ledger:[], cfg:{}, trip:null };
function normType(t){ return schemaType(t); }

/* Expenses 表為自由格式(非欄位表):
   - 「同行成員:」列 → 成員清單(可供分帳初始化)
   - 類別列(交通/住宿/門票…,僅第1欄有值)→ 之後項目歸此類
   - 項目列:明細(第2欄)+ $台幣(第5欄)/ ¥日幣(第6欄)+ 備註(第7欄)
   - 小計/總計列獨立標記 */
function parseExpensesFree(rows){
  var L = SCHEMA.sheets.exp.layout;   // 欄位位置由 Schema 定義
  var members=[], items=[], curCat='';
  rows.forEach(function(r){
    var c0=(r[L.catCol]||'').trim(), c1=(r[L.nameCol]||'').trim(),
        twd=(r[L.twdCol]||'').trim(), jpy=(r[L.jpyCol]||'').trim(), note=(r[L.noteCol]||'').trim();
    if(c0.indexOf(L.membersRowMark)>=0){
      for(var i=L.nameCol;i<r.length;i++){ var v=(r[i]||'').trim(); if(v) members.push(v); }
      return;
    }
    if(c0==='項目' && c1==='明細') return;   // 表頭列
    var isTotal = L.totalMarks.some(function(m){ return c0.indexOf(m)===0; });
    if(isTotal){ items.push({cat:c0, name:'', twd:twd, jpy:jpy, note:note, total:true}); return; }
    if(c0 && !c1 && !twd && !jpy && !note){ curCat=c0.replace(/[：:]$/,''); return; }
    if(c1){ items.push({cat:(c0||curCat), name:c1, twd:twd, jpy:jpy, note:note}); }
  });
  return { members:members, items:items };
}

function createDB(raw){
  var db={trip:null,placeList:[],places:{},rest:[],shop:[],hotels:[],expCMS:[],expMembers:[],ledger:[],cfg:{}};
  db.trip=buildItin(parseCSV(raw.itin||''));
  db.placeList=parseTable(raw.places,'places');
  db.placeList.forEach(function(place){ place.tnorm=normType(place.type); if(place.placeId) db.places[place.placeId.toUpperCase()]=place; });
  db.rest=parseTable(raw.rest,'rest');
  db.shop=parseTable(raw.shop,'shop');
  db.hotels=parseTable(raw.hotels,'hotels');
  var expense=parseExpensesFree(parseCSV(raw.exp||''));
  db.expCMS=expense.items;
  db.expMembers=expense.members;
  // CSV 與 doGet 增量共用同一個正規化入口(parseLedgerSheetCsv),欄位映射不得分岔。
  db.ledger=typeof parseLedgerSheetCsv==='function'?parseLedgerSheetCsv(raw.ledger||'紀錄ID,時間,成員,類別,明細,日幣,台幣,備註\n'):[];
  db.cfg=parseKeyValue(raw.cfg,'cfg');
  return db;
}

function buildDB(){
  DB=createDB(RAW);
  // CSV 快照重建後,ledger 已讀計數歸零,下一次 fast pull 會重新取回完整增量。
  if(typeof ledgerFastPullState!=='undefined'){ledgerFastPullState.after=0;ledgerFastPullState.total=0;}
  return DB;
}
var _refWarned = {};
function resolveRef(it){
  var ref=(it.ref||'').toUpperCase().trim();
  if(/^P\d+/.test(ref) && DB.places[ref]) return { kind:'place', p:DB.places[ref] };
  if(/^[PR]\d+/.test(ref) && !DB.places[ref] && !_refWarned[ref]){
    var isR = ref.charAt(0)==='R';
    var hasR = isR && DB.rest.some(function(x){ return (x.restId||'').toUpperCase()===ref; });
    if(!hasR && !isR){ AppLog.data('行程引用 '+ref+' 不存在於 Places — 改用名稱備援'); _refWarned[ref]=1; }
  }
  if(/^R\d+/.test(ref)){
    var r=DB.rest.find(function(x){ return (x.restId||'').toUpperCase()===ref; });
    if(r) return { kind:'rest', r:r };
  }
  // 名稱備援
  if(it.place){
    var flat=it.place.replace(/\s+/g,'');
    var p=DB.placeList.find(function(x){ return x.name && (flat.indexOf(x.name.replace(/\s+/g,''))>=0 || x.name.replace(/\s+/g,'').indexOf(flat)>=0); });
    if(p) return { kind:'place', p:p };
    var r2=DB.rest.find(function(x){ return x.name && flat.indexOf(x.name.replace(/\s+/g,''))>=0; });
    if(r2) return { kind:'rest', r:r2 };
  }
  return null;
}
function restaurantsOf(placeId){
  return DB.rest.filter(function(r){ return (r.placeId||'').toUpperCase()===String(placeId).toUpperCase(); });
}
function hotelOf(place){
  var hotelId=String(place&&place.hotelId||'').toUpperCase().trim();
  if(!hotelId) return null;
  return DB.hotels.find(function(h){
    return String(h&&h.hotelId||'').toUpperCase().trim()===hotelId;
  })||null;
}
function transport(){
  return DB.cfg.travelmode || 'drive';   // 值已由 Schema(cfg.keys.values)正規化為 drive/transit
}

function getChecks(){ return lsGet('trip_checks',{}); }
function toggleCheck(id){ var c=getChecks(); if(c[id]) delete c[id]; else c[id]=true; lsSet('trip_checks',c); }
function dayProgressKey(day,dayIndex){
  var d=(day&&day.date)?day.date:('day'+(dayIndex+1));
  return 'day_'+(dayIndex+1)+'_'+String(d).replace(/[^0-9A-Za-z]/g,'_');
}
function getNextStopProgress(){ return lsGet('trip_next_stop_progress',{}); }
function saveNextStopProgress(progress){ lsSet('trip_next_stop_progress',progress); }
function emptyDayProgress(){ return { done:{}, skip:{} }; }
function normalizeDayProgress(progress){
  progress=progress||{};
  return { done:progress.done||{}, skip:progress.skip||{}, autoSkip:progress.autoSkip||{} };
}
function getDayProgress(day,dayIndex){
  var all=getNextStopProgress();
  return normalizeDayProgress(all[dayProgressKey(day,dayIndex)]);
}
function hasDayProgress(progress){
  progress=normalizeDayProgress(progress);
  return Object.keys(progress.done).length>0 || Object.keys(progress.skip).length>0;
}
function setItemCompletion(day,dayIndex,itemId,status){
  var all=getNextStopProgress();
  var key=dayProgressKey(day,dayIndex);
  var progress=normalizeDayProgress(all[key]);
  delete progress.done[itemId];
  delete progress.skip[itemId];
  delete progress.autoSkip[itemId];
  if(status==='done') progress.done[itemId]=true;
  if(status==='skip') progress.skip[itemId]=true;
  all[key]=progress;
  saveNextStopProgress(all);
  var checks=getChecks();
  if(status==='done') checks[itemId]=true;
  else delete checks[itemId];
  lsSet('trip_checks',checks);
}
function markNextStop(day,dayIndex,itemId,status){
  setItemCompletion(day,dayIndex,itemId,status);
}
/* 時間不能重來、行程不會同天回訪:已過時間且從未手動處理的項目,除了「最後一個」保留待確認外,
   其餘自動標記為略過(寫入 progress.skip,並記錄於 autoSkip 供 UI 顯示標籤與一鍵修正)。
   回傳 true 代表這次呼叫「新」標記了(用於決定是否要 toast),false 代表本來就已清除過,不重複動作。 */
function autoSkipStaleItem(day,dayIndex,itemId){
  if(typeof findToday==='function'&&findToday()!==dayIndex) return false;
  var all=getNextStopProgress();
  var key=dayProgressKey(day,dayIndex);
  var progress=normalizeDayProgress(all[key]);
  if(progress.done[itemId]||progress.skip[itemId]) return false;
  setItemCompletion(day,dayIndex,itemId,'skip');
  all=getNextStopProgress(); progress=normalizeDayProgress(all[key]); progress.autoSkip[itemId]=true; all[key]=progress; saveNextStopProgress(all);
  return true;
}
function isAutoSkipped(itemId,progress){
  return !!(progress&&progress.autoSkip&&progress.autoSkip[itemId]);
}
function isNextStopCleared(item,progress,checks){
  if(!item||!item.id) return false;
  progress=normalizeDayProgress(progress);
  checks=checks||{};
  return !!(progress.done[item.id]||progress.skip[item.id]||checks[item.id]);
}

/* ================= 導航 / 高亮 ================= */
function navigationIntent(it,res){
  var query='',kind='nearby';
  if(res&&res.kind==='place'&&res.p){query=String(res.p.name||'').trim();kind='exact';}
  else if(res&&res.kind==='rest'&&res.r){query=String(res.r.name||'').trim();kind='exact';}
  else query=String(it&&it.place||it&&it.act||'').replace(/\n[\s\S]*/,'').trim();
  return query?{kind:kind,query:query}:null;
}
function navigationDirectionsUrl(intent,origin){
  if(!intent||!String(intent.query||'').trim())return '';
  var query=String(intent.query).trim(),parts=['api=1'];
  var validOrigin=origin&&isFinite(Number(origin.latitude))&&isFinite(Number(origin.longitude));
  if(validOrigin)parts.push('origin='+encodeURIComponent(String(Number(origin.latitude))+','+String(Number(origin.longitude))));
  parts.push('destination='+encodeURIComponent(validOrigin&&intent.kind==='nearby'?query:query+' 日本'));
  parts.push('travelmode='+(transport()==='drive'?'driving':'transit'));
  return 'https://www.google.com/maps/dir/?'+parts.join('&');
}
function tripItemForNavigation(dayIndex,itemId){
  var days=DB&&DB.trip&&DB.trip.days||[],day=days[Number(dayIndex)];
  if(!day)return null;
  return (day.items||[]).filter(function(item){return item&&item.id===String(itemId);})[0]||null;
}
function navQuery(it,res){
  var intent=navigationIntent(it,res);
  return intent?encodeURIComponent(intent.query+' 日本'):'';
}
function navUrl(it,res){return navigationDirectionsUrl(navigationIntent(it,res));}
function renderTripNavigationLink(it,res,dayIndex,className){
  var intent=navigationIntent(it,res);if(!intent)return '';
  var label=transport()==='drive'?'🚗 導航':'🚃 路線';
  var click=intent.kind==='nearby'?' onclick="return openTripNavigation(event,'+Number(dayIndex)+',\''+jsHtmlAttrString(it.id)+'\')"':'';
  return '<a class="'+escapeHtml(className||'qa-btn drv')+'" href="'+navigationDirectionsUrl(intent)+'" target="_blank" rel="noopener"'+click+'>'+label+'</a>';
}
function openTripNavigation(event,dayIndex,itemId){
  var item=tripItemForNavigation(dayIndex,itemId),intent=item&&navigationIntent(item,resolveRef(item));
  if(!intent||intent.kind==='exact')return true;
  if(event&&event.preventDefault)event.preventDefault();
  var fallback=navigationDirectionsUrl(intent),target=null;
  try{target=window.open('about:blank','_blank');if(target)target.opener=null;}catch(ignore){target=null;}
  function navigate(url){
    if(target){
      try{if(target.location&&typeof target.location.replace==='function')target.location.replace(url);else target.location=url;return;}catch(ignore){}
    }
    window.location.href=url;
  }
  if(typeof navigator==='undefined'||!navigator.geolocation||typeof navigator.geolocation.getCurrentPosition!=='function'){
    navigate(fallback);return false;
  }
  navigator.geolocation.getCurrentPosition(function(position){
    var coords=position&&position.coords||{};
    navigate(navigationDirectionsUrl(intent,{latitude:coords.latitude,longitude:coords.longitude})||fallback);
  },function(){navigate(fallback);},{enableHighAccuracy:false,timeout:6000,maximumAge:300000});
  return false;
}
function highlightNote(text){
  var t=escapeHtml(text);
  t=t.replace(/(https?:\/\/[^\s，、]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(訂單編號[：:]\s*\d+)/g,'<span class="hl">$1</span>');
  t=t.replace(/(TEL[：:]\s*[\d\-+ ]+)/gi,'<span class="hl">$1</span>');
  t=t.replace(/(¥[\d,]+)/g,'<span class="hl">$1</span>');
  return t;
}
function parseNoteLine(line){
  var t=(line||'').trim();
  var m=t.match(/^(•|-|\d+[.、]|[①②③④⑤⑥⑦⑧⑨⑩])\s*(.+)$/);
  if(m) return {type:'list', marker:m[1], text:m[2]};
  m=t.match(/^(※)\s*(.+)$/);
  if(m) return {type:'alert', marker:m[1], text:m[2]};
  return {type:'text', text:t};
}
function renderNote(text){
  if(!text) return '';
  var lines=String(text).split(/\r?\n/), out='', listOpen=false;
  function closeList(){ if(listOpen){ out+='</ul>'; listOpen=false; } }
  lines.forEach(function(line){
    var raw=(line||'').trim();
    if(!raw){ closeList(); return; }
    var item=parseNoteLine(raw);
    if(item.type==='list'){
      if(!listOpen){ out+='<ul class="note-list">'; listOpen=true; }
      out+='<li class="note-li"><span class="note-marker">'+escapeHtml(item.marker)+'</span><span>'+highlightNote(item.text)+'</span></li>';
      return;
    }
    closeList();
    if(item.type==='alert'){
      out+='<div class="note-alert"><span class="note-marker">'+escapeHtml(item.marker)+'</span><span>'+highlightNote(item.text)+'</span></div>';
    }else{
      out+='<div class="note-p">'+highlightNote(item.text)+'</div>';
    }
  });
  closeList();
  return out?'<div class="note-rich">'+out+'</div>':'';
}
function renderNoteBlock(text, icon){
  return text?'<div class="pc-tip">'+renderNote(text)+'</div>':'';
}
function extractDrive(moveText){
  if(!moveText) return '';
  var m=moveText.match(/開車約?\s*([\d.]+\s*(小時|分鐘)[\d.]*\s*(分鐘)?)/);
  return m?'開車約'+m[1].replace(/\s+/g,''):'';
}
function typeTag(res){
  if(!res) return null;
  if(res.kind==='rest') return {cls:'food',label:'🍜 '+(res.r.cat||'美食')};
  var t=res.p.tnorm;
  var rawType=(res.p.type||'').trim();
  if(rawType==='機場') return {cls:'move',label:'🛫 機場'};
  if(rawType==='纜車') return {cls:'play',label:'🚡 纜車'};
  if(t==='shopping') return {cls:'shop',label:'🏬 購物'};
  if(t==='restarea') return {cls:'food',label:'🍜 美食區'};
  if(t==='hotel') return {cls:'stay',label:'🏨 住宿'};
  if(t==='ferry') return {cls:'move',label:'⛴ 渡輪碼頭'};
  if(t==='parking') return {cls:'move',label:'🚗 租車/停車'};
  if(t==='fuel') return {cls:'move',label:'⛽ 加油站'};
  return {cls:'play',label:'⛩️ 景點'};
}

function linkRow(k,url,label){ return url?'<div class="pc-row"><span class="pc-k">'+k+'</span><span class="pc-v"><a href="'+escapeHtml(url)+'" target="_blank" rel="noopener">'+(label||'開啟連結')+'</a></span></div>':''; }
function tipBox(v){ return renderNoteBlock(v); }
function parseScheduleLinks(text){
  text=String(text||'');
  var links=[], re=/https?:\/\/[^\s"'<>]+/g, m, last=0;
  while((m=re.exec(text))){
    var url=m[0].replace(/[、，。)）\]]+$/,'');
    var chunk=text.slice(last,m.index).trim();
    var q=chunk.match(/「([^」]+)」[^「」]*$/);
    var label=(q&&q[1]?q[1]:chunk.replace(/\s+/g,' ').replace(/^[:：\-–—]+/,'').trim());
    if(!label) label='官方';
    if(label.indexOf('時刻表')<0) label+='時刻表';
    links.push({ label:label, url:url });
    last=re.lastIndex;
  }
  return links;
}
function renderScheduleLinks(text, className, styleText){
  var links=parseScheduleLinks(text);
  return links.map(function(link){
    return '<a class="'+className+'" '+(styleText?'style="'+styleText+'" ':'')+
      'href="'+escapeHtml(link.url)+'" target="_blank" rel="noopener">⛴ '+escapeHtml(link.label)+'</a>';
  }).join('');
}

/* 停車資訊「引用其他 Place」解析
   規則:停車備註(或停車費)欄若寫「停車同P004」,
   自動找到 P004 並完整繼承其停車資訊(MAPCODE/停車費/停車備註)。
   - 支援多層引用(P006→P005→P004),深度上限 3 防止循環引用
   - 引用的 PlaceID 不存在時:console.warn 提示、顯示原本內容、絕不報錯 */
function resolveParking(p, depth){
  depth = depth || 0;
  /* 現行 Places 停車資訊 = MAPCODE + 停車(單欄文字) */
  var park = { mapcode:p.mapcode||'', pnote:p.pnote||'' };
  var refM = park.pnote.match(/停車同\s*(P\d+)/i);
  if(!refM) return park;
  if(depth >= 3){ AppLog.data('停車引用層數過深(疑似循環引用),停止解析:'+p.placeId); return park; }
  var refId = refM[1].toUpperCase();
  var target = DB.places[refId];
  if(!target){ AppLog.data('找不到停車引用的地點:'+refId+'(來自 '+p.placeId+')'); return park; }
  return resolveParking(target, depth+1);   // 完整繼承目標停車資訊
}

/* 停車面板:MAP CODE 大字純顯示(看著輸入車機),不提供複製按鈕 */
