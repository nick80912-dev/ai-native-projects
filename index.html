function validatePersonalStatePayload(payload){
  if(!payload||payload.format!=='trip-personal-state'||!isSupportedPersonalStateVersion(payload.version))throw new Error('個人狀態格式錯誤');
  if(payload.version<3&&payload.proxyTargets===undefined)payload.proxyTargets=[];
  if(payload.version<4&&payload.shoppingItems===undefined)payload.shoppingItems=[];
  if(payload.version<8){
    payload.themeId=currentThemeId();
    payload.shoppingUnits=shoppingUnitStore.all();
    payload.travelNotes=travelNoteStore.all();
  }else if(THEME_IDS.indexOf(String(payload.themeId||''))<0){
    throw new Error('主題格式錯誤');
  }
  if(!Array.isArray(payload.proxyTargets))throw new Error('代購對象清單格式錯誤');
  if(!Array.isArray(payload.shoppingItems))throw new Error('採買清單格式錯誤');
  payload.proxyTargets=ledgerProxyTargetStore.normalize(payload.proxyTargets);
  payload.shoppingItems=shoppingItemsWithoutPhotoRefs(shoppingListStore.normalize(payload.shoppingItems));
  payload.shoppingUnits=shoppingUnitStore.normalize(payload.shoppingUnits);
  payload.travelNotes=travelNoteStore.normalize(payload.travelNotes);
  return payload;
}
function applyPersonalStatePayload(payload){
  var keys=['trip_checks','trip_shop_wants','trip_member',LEDGER_QUEUE_KEY,PERSONAL_LEDGER_KEY,LEDGER_CATEGORY_OPTIONS_KEY,LEDGER_PAY_METHOD_OPTIONS_KEY,LEDGER_PROXY_TARGETS_KEY,SHOPPING_LIST_KEY,THEME_STORAGE_KEY,SHOPPING_UNIT_OPTIONS_KEY,TRAVEL_NOTES_KEY];
  var before=keys.map(function(key){return {key:key,value:localStorage.getItem(key)};});
  try{
    lsSet('trip_checks',payload.checks);
    lsSet('trip_shop_wants',payload.wants);
    localStorage.setItem('trip_member',String(payload.member));
    localStorage.setItem(LEDGER_QUEUE_KEY,JSON.stringify(payload.ledgerQueue));
    localStorage.setItem(PERSONAL_LEDGER_KEY,JSON.stringify(payload.personalLedger));
    localStorage.setItem(LEDGER_CATEGORY_OPTIONS_KEY,JSON.stringify(payload.ledgerCategories));
    localStorage.setItem(LEDGER_PAY_METHOD_OPTIONS_KEY,JSON.stringify(payload.ledgerPayMethods));
    localStorage.setItem(LEDGER_PROXY_TARGETS_KEY,JSON.stringify(payload.proxyTargets));
    localStorage.setItem(SHOPPING_LIST_KEY,JSON.stringify(payload.shoppingItems));
    localStorage.setItem(THEME_STORAGE_KEY,payload.themeId);
    localStorage.setItem(SHOPPING_UNIT_OPTIONS_KEY,JSON.stringify(payload.shoppingUnits));
    localStorage.setItem(TRAVEL_NOTES_KEY,JSON.stringify(payload.travelNotes));
  }catch(error){
    before.forEach(function(item){
      if(item.value===null)localStorage.removeItem(item.key);
      else localStorage.setItem(item.key,item.value);
    });
    throw error;
  }
  applyTheme(payload.themeId,{persist:false});
}
function restorePersonalState(){
  var box=document.getElementById('personalStateBox'), payload;
  try{ payload=JSON.parse(box&&box.value||''); }catch(error){ toast('JSON 格式錯誤'); return; }
  if(!payload||payload.format!=='trip-personal-state'||!isSupportedPersonalStateVersion(payload.version)||!payload.checks||Array.isArray(payload.checks)||typeof payload.checks!=='object'||!payload.wants||Array.isArray(payload.wants)||typeof payload.wants!=='object'||!Array.isArray(payload.ledgerQueue)||!memberIsAllowed(String(payload.member||''))){ toast('個人狀態格式驗證失敗'); return; }
  if(payload.version===1){payload.personalLedger=[];payload.ledgerCategories=DEFAULT_LEDGER_CATEGORIES.slice();payload.ledgerPayMethods=DEFAULT_LEDGER_PAY_METHODS.slice();}
  /* v<9 的想逛 key 是索引型,必須在寫入前轉換(保持全有或全無的原子語意)。
     模糊候選一律移除 —— 備份裡的 index 同樣不可信,拿它猜測只會把錯誤映射固定下來。 */
  if(payload.version<9)payload.wants=migrateShopWantKeys(payload.wants,shopMalls()).wants;
  try{validatePersonalStatePayload(payload);}catch(error){toast(error.message||'代購對象清單格式錯誤');return;}
  if(!Array.isArray(payload.personalLedger)||!Array.isArray(payload.ledgerCategories)||!Array.isArray(payload.ledgerPayMethods)){toast('個人狀態格式驗證失敗');return;}
  try{ payload.ledgerQueue.forEach(function(record){if(!record||!String(record.id||'').trim()||!String(record.time||'').trim())throw new Error('佇列缺少 ID 或時間');validateLedgerRecord(normalizeLedgerRecord(record,Date.now(),Math.random,false));}); }
  catch(error){ toast('佇列紀錄格式驗證失敗'); return; }
  try{
    payload.personalLedger=payload.personalLedger.map(function(record){if(!record||!String(record.id||'').trim()||!String(record.time||'').trim())throw new Error('個人帳缺少 ID 或時間');var normalized=normalizePersonalLedgerRecord(record,Date.now(),Math.random);validateLedgerRecord(normalized);return normalized;});
    payload.ledgerCategories=payload.ledgerCategories.map(normalizeLedgerOption).filter(function(value,index,values){return values.indexOf(value)===index;});
    payload.ledgerPayMethods=payload.ledgerPayMethods.map(normalizeLedgerOption).filter(function(value,index,values){return values.indexOf(value)===index;});
  }catch(error){toast('個人帳或自訂選項格式驗證失敗');return;}
  try{applyPersonalStatePayload(payload);}catch(error){toast('本機資料還原失敗');return;}
  closePersonalStateDialog(); closeSettings(); renderAll(); updateLedgerPendingStatus(); ledgerRepository.flushQueue(); toast('個人狀態已還原');
}

function formatShoppingPhotoBytes(value){
  var bytes=Math.max(0,Number(value)||0);
  if(bytes<1024)return Math.round(bytes)+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(bytes<10*1024?1:0)+' KB';
  return (bytes/(1024*1024)).toFixed(bytes<10*1024*1024?1:0)+' MB';
}

  if(state.invalidReferences.length)return state.invalidReferences.length+' 個附件待修復';
  if(state.capacity&&state.capacity.low)return '儲存空間偏低';
  return state.storedPhotoCount+' 張 · '+formatShoppingPhotoBytes(state.storedBytes);
}

function confirmShoppingPhotoCleanup(){
  var orphans=(shoppingPhotoAuditState.orphanPhotos||[]).slice();

  var bytes=orphans.reduce(function(total,record){return total+(Number(record.size)||0);},0);
  if(!confirm('清理 '+orphans.length+' 張未使用照片（'+formatShoppingPhotoBytes(bytes)+'）？'))return Promise.resolve(false);
  return cleanupShoppingPhotoOrphans(orphans.map(function(record){return record.id;})).then(function(results){
    return refreshShoppingPhotoAudit({force:true,reason:'settings-cleanup'}).then(function(){
      var failed=results.filter(function(result){return !result.removed;}).length;

      toast(failed?'已清理部分照片，'+failed+' 張未能移除':'未使用照片已清理');

function settingsDataHealthModel(input){
  var supplied=input&&typeof input==='object',source=supplied?input:{};
  var sync=source.sync||syncStatusModel(),pending=source.pendingCount;
  if(pending==null)pending=ledgerRepository.pendingCount();pending=Math.max(0,Number(pending)||0);
  var photoSummary=source.photoSummary==null?shoppingPhotoStorageSummary():String(source.photoSummary);
  var photoAttention=source.photoAttention;
  if(photoAttention==null){var photoState=shoppingPhotoAuditState||{};photoAttention=!!(photoState.ready&&(photoState.unavailable||(photoState.invalidReferences||[]).length));}
  var failedLabels=(sync.failedSources||[]).map(function(item){return String(item&&item.label||'').trim();}).filter(Boolean);
  var tripAttention=sync.state==='partial'||sync.state==='failed',attention=(tripAttention?1:0)+(pending?1:0)+(photoAttention?1:0);
  var relative=sync.relative&&sync.relative!=='時間未知'?' · '+sync.relative:'';
  return {
    summary:attention?attention+' 項需注意':'資料狀態正常',attentionCount:attention,
    rows:[
      {key:'trip',label:'行程資料',value:String(sync.label||'資料狀態未知')+relative,detail:failedLabels.length?'未更新：'+failedLabels.join('、'):''},
      {key:'shared',label:'團體帳',value:pending?pending+' 筆待同步':'已送出',detail:'團體紀錄會跨裝置同步'},

      {key:'photos',label:'照片附件',value:photoSummary,detail:'照片只保存在此裝置'}
    ]
  };
}

  var request=fetch(ledgerFastPullUrl(after),{method:'GET'}).then(function(response){
    if(!response.ok)throw new Error('HTTP '+response.status);

  return Promise.race([request,timeout]).then(function(text){
    var payload=readLedgerFastPullResponse(text);
    if(!payload.ok){
      // 非 JSON(配額用盡／部署失效／權限錯誤的 HTML 錯誤頁)或 ok:false → 降級回 CSV。
      ledgerFastPullState.lastFailureAt=Date.now();
      AppLog.sync('ledger 增量讀取降級回 CSV:'+(payload.error||'未知原因'));
      return {ok:false,newRecords:0};
    }
    var offset=computeClockOffsetMs(payload.serverTime,startedAt,Date.now());
    if(offset!==null)ledgerFastPullState.offsetMs=offset;
    if(payload.reset)ledgerFastPullState.after=0;

      var parsed=parseLedgerSheetCsv(ledgerFastPullCsv(ledgerSheetHeaders(),payload.rows));
      var known={};

      parsed.forEach(function(record){

        known[record.id]=true;DB.ledger.push(record);added++;
      });
    }
    ledgerFastPullState.after=Number(payload.after)+payload.rows.length;
    ledgerFastPullState.total=payload.total;
    ledgerFastPullState.lastSuccessAt=Date.now();
    if(added){reconcileLedgerDeliveryBridge(DB.ledger);refreshSettlementSurfaces();}
    else if(reason==='interval')updateSettlementBadge();
    return {ok:true,newRecords:added};
  },function(error){
    ledgerFastPullState.lastFailureAt=Date.now();
    AppLog.sync('ledger 增量讀取失敗,維持 CSV 路徑:'+(error.message||error));

  });
}

function ledgerOptionalDateLabel(value,now){
  var text=String(value||'').trim(),normalized,match;
  try{normalized=parseLedgerDateInput(text);}
  catch(ignore){return text;}
  match=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(normalized);
  if(!match)return text;
  now=now instanceof Date?now:appNow();
  var year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);
  if(year===now.getFullYear()&&month===now.getMonth()+1&&day===now.getDate())return '今天';
  return year===now.getFullYear()?month+'/'+day:year+'/'+month+'/'+day;
}

function ledgerSettlementCurrency(){
  try{return currentLedgerSettings().defaultCurrency;}catch(ignore){return 'JPY';}
}
/* 本機正在送出／送出失敗的 phase,決定 status chip 走哪一個分支。 */
function settlementEntryPhase(entry){
  var keys=[settlementResponseLockKey(entry.claim.id),settlementWithdrawLockKey(entry.claim.id),
    settlementClaimLockKey(ledgerUniverseMode(),entry.from,entry.to,entry.currency)];
  if(entry.response&&entry.response.id)keys.push(settlementUndoLockKey(entry.response.id));
  var phase='idle';
  keys.forEach(function(key){var value=settlementActionPhase(key);if(value==='submitting')phase='submitting';else if(value==='failed'&&phase!=='submitting')phase='failed';});
  return phase;
}
/* 等待同步的時間長度決定 §7.4 的提示分級;record.id 只縮短顯示。 */
function settlementSyncTag(entry,view){
  if(!view.waitingSync)return '';
  var record=entry.status==='pending'?entry.claim:entry.response;
  var waited=Math.max(0,Date.now()-Date.parse(String(record&&record.time||''))||0);
  var hint=settlementWaitHint(waited);
  /* chip 已含「同步中」時,30 秒內的「等待同步」與它同義,不重複顯示;
     逾 30 秒的提示帶有 chip 沒有的「已經等太久」訊號,必須保留。 */
  if(hint==='等待同步'&&String(view.label||'').indexOf('同步中')>=0)return '';
  return '<span class="ledger-settle-sync" title="'+escapeHtml(shortRecordId(record&&record.id))+'">'+escapeHtml(hint)+'</span>';
}
/* 主面板的一列:對象、金額、明確 status chip、唯一主要操作。 */
function ledgerHandshakeStatusLine(entry,me){
  var view=settlementEntryStatus(entry,me,{phase:settlementEntryPhase(entry)});
  var amount=escapeHtml(formatLedgerCurrencyAmount(entry.currency,entry.amount));
  var other=canonicalMemberName(entry.from)===canonicalMemberName(me)?entry.to:entry.from;
  var safeId=jsHtmlAttrString(entry.claim.id),actions='',actionLabel='';
  // actionLabel 供顯示層去重;兩顆按鈕時留空,因為 chip 不對應其中任一顆。
  if(view.canRespond)actions='<span class="ledger-settle-actions"><button class="btn sm" onclick="ledgerConfirmSettlementClaim(\''+safeId+'\')">確認已收</button><button class="btn sm ghost" onclick="ledgerRejectSettlementClaim(\''+safeId+'\')">退回</button></span>';
  // 退回後的「再標記一次」與轉帳建議建立的是同一種 settlement_claim,因此用同一個詞。
  // 刻意不用祈使句式的付款動詞 —— App 不會代為轉帳,錢是使用者在 App 外自己付的,
  // 這顆按鈕只是「我付過了」的陳述。
  else if(view.canRemark){actions='<span class="ledger-settle-actions"><button class="btn sm" onclick="ledgerRemarkSettlementPaid(\''+safeId+'\')">我已付款</button></span>';actionLabel='我已付款';}
  else if(view.canRetry){actions='<span class="ledger-settle-actions"><button class="btn sm" onclick="retryLedgerQueueSync()">重新同步</button></span>';actionLabel='重新同步';}
  else if(view.canWithdraw){actions='<span class="ledger-settle-actions"><button class="btn sm ghost" onclick="ledgerWithdrawSettlementClaim(\''+safeId+'\')">撤回</button></span>';actionLabel='撤回';}
  else if(view.label==='送出中…'){actions='<span class="ledger-settle-actions"><button class="btn sm" disabled><span class="button-spinner"></span>送出中…</button></span>';actionLabel='送出中…';}
  /* 前綴在窄螢幕吃掉約三分之一可用寬度,而右側狀態 chip 已表明本列處於退回態,
     語意不靠前綴也成立;保留 aria-label 讓讀屏仍讀得到欄位名稱。 */
  var reason=view.reason?'<span class="ledger-settle-reason" aria-label="退回原因">'+escapeHtml(view.reason)+'</span>':'';
  var chipText=settlementRowChipText(view.label,actionLabel,view.canRespond);
  /* 一列講得完就不要兩列:動作一律併入主列右側,與 chip、等待提示同一個固定寬度欄位。
     只有「退回原因」需要自己的一列 —— 它是長度不可控的自由文字,擠進主列會把右側
     壓垮。等待提示也留在右欄:移進左欄會和姓名搶同一個可壓縮空間,窄螢幕反而更早換行。
     需要兩列時:第一列「對象/金額 ｜ 狀態」,第二列「退回原因 ｜ 動作」,兩列各自
     space-between 才對得齊;收款者自己退回時沒有動作,補一個空 span 維持左右定位。 */
  var inlineActions=!reason;
  var foot=reason?'<div class="ledger-settle-foot">'+reason+(actions||'<span></span>')+'</div>':'';
  return '<div class="ledger-settlement-line ledger-settle-row ledger-settle-'+escapeHtml(view.sortKind)+'">'+
    '<div class="ledger-settle-main"><span class="ledger-settle-who">'+escapeHtml(other)+' '+amount+'</span>'+
    '<span class="ledger-settle-state">'+(chipText?'<span class="ledger-settle-chip">'+escapeHtml(chipText)+'</span>':'')+settlementSyncTag(entry,view)+(inlineActions?actions:'')+'</span></div>'+foot+'</div>';
}
/* §7 次層結清紀錄只呈現歷史事實:已完成者顯示雙方、金額與完成時間,不提供任何永久修改操作。
   10 秒一次性復原只存在於操作裝置當次的 toast,因此本列永遠不輸出操作按鈕。 */
function ledgerHandshakeHistoryLine(entry,me){
  var view=settlementEntryStatus(entry,me,{phase:settlementEntryPhase(entry)});
  var amount=escapeHtml(formatLedgerCurrencyAmount(entry.currency,entry.amount));
  var doneAt=entry.status==='confirmed'&&!view.waitingSync?formatLedgerSyncRecordTime(entry.response&&entry.response.time):'';
  return '<div class="ledger-settlement-line ledger-settle-history"><span>'+escapeHtml(entry.from)+' → '+escapeHtml(entry.to)+' '+amount+'</span>'+
    '<span><span class="ledger-settle-chip">'+escapeHtml(view.label)+'</span>'+

function ledgerSettleSuggestionLines(items,me,pendingEntries){
  if(!items.length)return '<div class="empty-state">目前不需轉帳</div>';
  var meKey=canonicalMemberName(me);
  return items.map(function(item){
    var hasPending=(pendingEntries||[]).some(function(entry){return entry.currency===item.currency&&canonicalMemberName(entry.from)===canonicalMemberName(item.from)&&canonicalMemberName(entry.to)===canonicalMemberName(item.to);});
    var action='';
    if(canonicalMemberName(item.from)===meKey&&!hasPending){
      var busy=settlementActionPhase(settlementClaimLockKey(ledgerUniverseMode(),item.from,item.to,item.currency))==='submitting';
      action=busy?'<span class="ledger-settle-actions"><button class="btn sm" disabled><span class="button-spinner"></span>送出中…</button></span>':'<span class="ledger-settle-actions"><button class="btn sm" onclick="ledgerMarkSettlementPaid(\''+jsHtmlAttrString(item.to)+'\','+Number(item.amount)+',\''+jsHtmlAttrString(item.currency)+'\')">我已付款</button></span>';
    }
    return '<div class="ledger-settlement-line"><span>'+escapeHtml(item.from)+' → '+escapeHtml(item.to)+'</span><span>'+escapeHtml(formatLedgerCurrencyAmount(item.currency,item.amount))+action+'</span></div>';
  }).join('');
}
/* 面板資料一律先依 currentMember 過濾,再產生 DOM;第三人姓名／金額不進 DOM。 */
function settlementPanelModel(){

/* §11 偏移只告知,不自動校時、不阻擋操作。 */

/* §10 本筆已完成、但同一對象另有新產生帳款時的說明;輸出為摘要金額同欄的小字。 */
function settlementNewChargeNotices(model){
  return model.actionable.filter(function(entry){return entry.status==='confirmed';}).map(function(entry){
    var remaining=0;
    model.suggestions.forEach(function(item){
      if(item.currency===entry.currency&&canonicalMemberName(item.from)===canonicalMemberName(entry.from)&&canonicalMemberName(item.to)===canonicalMemberName(entry.to))remaining+=Number(item.amount||0);
    });
    var note=settlementNewChargeNote(entry,remaining,model.me);
    return note?'<em class="ledger-settlement-hint">'+escapeHtml(note)+'</em>':'';
  }).join('');
}
/* 「需要你處理」的列表。自動關閉面板的判斷必須與這裡同源 ——
   兩邊各算一套就會出現「面板還列著東西卻被自動關掉」。 */
function settlementActionableRows(model){
  var me=model.me,pendingClaims=model.handshake.pending;
  var rows=model.actionable.filter(function(entry){return entry.status!=='confirmed';}).map(function(entry){
    return {sortKind:settlementEntryStatus(entry,me,{phase:settlementEntryPhase(entry)}).sortKind,html:ledgerHandshakeStatusLine(entry,me)};
  });
  model.suggestions.forEach(function(item){
    if(canonicalMemberName(item.from)!==canonicalMemberName(me))return;
    var covered=pendingClaims.some(function(entry){return entry.currency===item.currency&&canonicalMemberName(entry.from)===canonicalMemberName(item.from)&&canonicalMemberName(entry.to)===canonicalMemberName(item.to);});
    var openGeneration=model.actionable.some(function(entry){return entry.status!=='confirmed'&&entry.currency===item.currency&&canonicalMemberName(entry.from)===canonicalMemberName(item.from)&&canonicalMemberName(entry.to)===canonicalMemberName(item.to);});
    if(covered||openGeneration)return;
    rows.push({sortKind:'to-pay',html:ledgerSettleSuggestionLines([item],me,pendingClaims)});
  });
  return rows.sort(compareSettlementPanelRows);
}

/* 只有 POST 未成功且本機 durable queue／bridge 也未持久化時,才算 failed。
   已安全持久化者一律維持已操作狀態,不得靜默恢復成普通操作按鈕。 */
function settlementRecordIsDurable(record){
  if(!record||!record.id)return false;
  if(ledgerRepository.queuedRecords().some(function(item){return item.id===record.id;}))return true;
  return ledgerDeliveryBridgeRecords().some(function(item){return item.id===record.id;});
}
/* doneToast(durable) 讓呼叫端在「已安全保存」時附加一次性 action toast(目前只有 10 秒復原);
   回傳 null 即維持一般提示。寫入完全失敗時走 reject 分支,不會有機會顯示成功或動作。 */
function appendSettlementRecord(record,doneMessage,lockKey,doneToast){
  if(lockKey)setSettlementActionPhase(lockKey,'submitting');
  refreshSettlementSurfaces();
  var sending;
  // localStorage 寫入失敗(配額、私密模式)會同步拋出:此時 record 既未 POST 也未安全入列,
  // 必須走與非同步失敗完全相同的路徑 —— 明確錯誤 + 釋放鎖,不得靜默無反應。
  try{sending=ledgerRepository.add(record);}
  catch(error){sending=Promise.reject(error);}
  return sending.then(function(delivery){
    var durable=delivery.ok||settlementRecordIsDurable(record);
    if(lockKey){setSettlementActionPhase(lockKey,durable?'':'failed');settlementActionLock.release(lockKey);}
    refreshSettlementSurfaces();
    var message=delivery.ok?doneMessage:doneMessage+'，待同步';
    var action=typeof doneToast==='function'?doneToast(durable):null;
    if(action)toast(message,action.actionText,action.actionFn,action.durationMs);
    else toast(message);
    triggerLedgerFastPull('after-post');
    return delivery;
  },function(error){
    if(lockKey){setSettlementActionPhase(lockKey,settlementRecordIsDurable(record)?'':'failed');settlementActionLock.release(lockKey);}
    refreshSettlementSurfaces();toast(error.message||'結算操作失敗');throw error;
  });
}

/* §9 10 秒一次性復原:只由「確認已收」完成後的 toast 呼叫,結清歷史沒有入口。

   並以 undo:{responseId} 這把獨立 action lock 保證連點只產生一筆 deletion record。 */
function ledgerUndoSettlementConfirm(responseId){
  var me=settlementActionGuard();if(!me)return;
  var handshake=deriveSettlements(mergedLedgerRecords(),null,ledgerUniverseMode());
  var entry=handshake.confirmed.filter(function(item){return item.response&&item.response.id===responseId;})[0];
  if(!entry){
    // 已被撤銷的 confirm 仍留在事件流中,只是不再是有效 confirmed;兩者訊息不同。
    var known=mergedLedgerRecords().some(function(item){return item&&item.id===responseId;});
    toast(settlementUndoBlockMessage(known?'already-undone':'invalid'));return;
  }
  var eligibility=settlementConfirmUndoEligibility(entry,handshake.generations,me,Date.now());
  if(!eligibility.allowed){toast(settlementUndoBlockMessage(eligibility.reason));return;}
  var lockKey=settlementUndoLockKey(responseId);
  if(!settlementActionLock.acquire(lockKey))return;
  var record;
  try{record=createLedgerDeletion(entry.response,me,'復原確認');}
  catch(error){settlementActionLock.release(lockKey);toast(error.message||'無法復原');return;}
  appendSettlementRecord(record,'已復原，款項已回到待確認',lockKey);
}

/* 回到目前這一頁的頂端。減少動態時直接跳,否則平滑捲動 ——
   scrollTo 的 behavior:'smooth' 是明確值,不會被 CSS 的 scroll-behavior 覆寫,
   因此必須自己判斷 prefers-reduced-motion。 */
function scrollCurrentViewToTop(){
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(viewUiState[curView]) viewUiState[curView].scrollY=0;
  window.scrollTo({top:0,behavior:reduced?'instant':'smooth'});
}
function switchView(v,intent){
  /* 分帳次層頁再點「分帳」仍先回 dashboard,沿用現況 */
  if(v==='split'&&curView==='split'){
    if(ledgerUiState.page!=='dashboard')returnLedgerDashboard();
    else{closeLedgerRecordActions();scrollCurrentViewToTop();}
    return;
  }
  /* 再點目前所在的分頁 = 只是回頂,不是換頁。
     實測舊作法會 renderCurrent() 整份重繪(第一個 .item 節點被換掉)、
     並以 behavior:'instant' 由 488 一步跳到 0 —— 使用者看到的就是閃一下。
     這裡直接攔截:不重繪、不動 .view.active、不碰暫態 UI 狀態,只平滑捲動。
     帶明確 intent 的程式化跳轉不走這條,仍以 intent 定位為優先。 */
  if(v===curView&&!intent){ scrollCurrentViewToTop(); return; }
  /* 離開前先記住位置 —— 必須在 curView 改變之前 */
  if(v!==curView) captureViewScroll(curView);
  if(curView==='split'){ledgerUiWorkflow.dispatch({type:'reset-selection'});closeLedgerRecordActions();}
  curView=v;
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active');});
  var t=document.getElementById('view-'+v); if(t) t.classList.add('active');
  document.querySelectorAll('.tabbar-btn').forEach(function(b){b.classList.toggle('active',b.dataset.view===v);});
  renderDaybar();
  renderCurrent(v);
  applyViewPosition(v,intent);
}
function retryCurrentView(button){

function renderCurrent(v){

  }
}

/* 真機驗收用:回報「這台裝置實際啟用的外殼版本」,不是伺服器上有什麼。
   sw.js 的 activate 會刪掉所有非當前 CACHE_NAME 的快取,所以 Cache Storage 裡
   剩下的那一筆就是答案 —— 版本字串一律讀自真實快取,index.html 不得自行寫死,
   否則兩邊會各說各話,反而騙過驗收。讀不到時明講「無法讀取」,絕不猜一個版本號。 */
function readActiveShellVersion(){
  if(!self.caches||!caches.keys)return Promise.resolve('');
  return caches.keys().then(function(keys){
    var shell=(keys||[]).filter(function(key){return String(key||'').indexOf('okayama-trip-')===0;});
    return shell.sort().join('、');
  }).catch(function(){return '';});
}

  });
}

function setupDiagnostics(){ var badge=document.getElementById('diagnosticBadge'),last=0; if(!badge) return; badge.addEventListener('touchend',function(e){ var now=Date.now(); if(now-last<300){ e.preventDefault(); openDiagnostics(); } last=now; },{passive:false}); updateSimulationMarker(); }
/* iOS 雙擊放大抑制（相容性定案，勿刪）:
   目標 iPhone 三次開關對照顯示，document 上的手勢觀測 listener
   集合會改變 WebKit 雙擊縮放仲裁；診斷關閉後現象再現。
   退役診斷子系統後只保留最小 dblclick no-op，以維持抑制效果。
   此為未文件化 WebKit compatibility workaround；若未來 iOS
   大版本後雙擊放大再現，優先檢查本監聽器是否仍在。 */
document.addEventListener('dblclick', function iosDoubleTapZoomSuppressor(){}, {passive:true});
var VIEWPORT_META=document.querySelector('meta[name="viewport"]');
var VIEWPORT_ORIGINAL=VIEWPORT_META?VIEWPORT_META.getAttribute('content'):'';
function forceViewportReflow(){ window.scrollTo(0,window.scrollY); }
function isFormControl(el){ return !!(el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName||'')); }
function recoverViewportAfterResume(meta,original,wrap,win,raf){
  if(meta&&original){ if(meta.setAttribute) meta.setAttribute('content',original); else meta.content=original; }
  if(wrap&&wrap.style){ wrap.style.transform=''; wrap.style.transition=''; }
  var x=typeof win.scrollX==='number'?win.scrollX:(win.pageXOffset||0);
  var y=typeof win.scrollY==='number'?win.scrollY:(win.pageYOffset||0);
  var frame=raf||win.requestAnimationFrame||function(fn){ return setTimeout(fn,0); };
  frame(function(){ frame(function(){ win.scrollTo(x,y); }); });
}
function restoreFocusZoom(meta,viewport,userGesture,pendingTimer){
  if(!meta||!viewport||viewport.scale<=1||userGesture) return null;
  if(pendingTimer) clearTimeout(pendingTimer);
  meta.setAttribute?meta.setAttribute('content',VIEWPORT_ORIGINAL+', maximum-scale=1'):meta.content=VIEWPORT_ORIGINAL+', maximum-scale=1';
  return setTimeout(function(){ if(meta.setAttribute) meta.setAttribute('content',VIEWPORT_ORIGINAL); else meta.content=VIEWPORT_ORIGINAL; },100);
}
function setupViewportReflow(){
  var formFocused=false,userGesture=false,restoreTimer=null;
  var wrap=document.querySelector('.wrap');
  if(window.visualViewport) window.visualViewport.addEventListener('resize',function(){ if(Math.abs(window.visualViewport.height-window.innerHeight)<2) forceViewportReflow(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) recoverViewportAfterResume(VIEWPORT_META,VIEWPORT_ORIGINAL,wrap,window); });
  window.addEventListener('pageshow',function(){ recoverViewportAfterResume(VIEWPORT_META,VIEWPORT_ORIGINAL,wrap,window); });
  document.addEventListener('focusin',function(e){ if(isFormControl(e.target)){ formFocused=true; userGesture=false; } });
  document.addEventListener('touchstart',function(e){ if(formFocused&&e.touches&&e.touches.length>1) userGesture=true; },{passive:true});
  document.addEventListener('gesturestart',function(){ if(formFocused) userGesture=true; },{passive:true});
  document.addEventListener('focusout',function(e){
    if(formFocused&&isFormControl(e.target)) restoreTimer=restoreFocusZoom(VIEWPORT_META,window.visualViewport,userGesture,restoreTimer);
    formFocused=false; userGesture=false;
    if(e.target&&e.target.closest&&e.target.closest('#diagnosticOverlay')) forceViewportReflow();
  });
}
setupDiagnostics();
setupViewportReflow();
init();
